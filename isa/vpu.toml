confidence = "high"

[[section.row]]
cells = ["`SUB`", "with `ENA` and no `WBA` — the `USUB` form — **not** a subtracting accumulate: the accumulator is left alone and the destination takes `accumulator - result`. Alongside `WBA` the accumulator takes `acc - (result << 16)` as well"]

[[section.row.source]]
kind       = "measured"
ref        = "`probes/usub.s`, read back with `vgetacc`"
confidence = "high"

[[section.row.source]]
kind       = "measured"
ref        = "`probes/acchu.s`: `vgetacc` after a `UACC HIGH SUB` reads `acc - (result << 16)`, lane for lane"
confidence = "high"

[[section.row]]
cells = ["`SUB` or no `SUB`, with `HIGH`", "the destination is the accumulator's **own** high half against the result — `(acc >> 16) - result`, saturated into the operation's width — taken *before* the update, not read back out of the accumulator afterwards. The two agree until the low half borrows: with the high half zero and a result of `0xffff`, the unsigned form answers `-32768`, the clamp, where the accumulator afterwards reads `1`. Both polarities follow it, and the saturation is at the **operation's** width even when the destination is wider"]

[[section.row.source]]
kind       = "measured"
ref        = "`probes/acchu.s`"
confidence = "high"


[[section]]
title = "What the model executes"
body = """
`VecInsn::executable` decides, by field rather than by whole-word template.
A linear sweep of `start4.elf`'s `.text` with this decoder finds **14650**
vector instructions, and **14369 of them execute**. That denominator is a
sweep, not a count of real instructions: it steps two bytes at a time and
cannot tell a jump table from code, which is most of what is left over.

The 281 that do not split by what `binutils-vc4` objdump makes of the same
address — a better measure than the page they sit in, since a linear sweep
through a jump table produces valid-looking encodings by accident:
"""
columns = ["Left over", "What it is", "Source"]
after = """
None of it is reached on a firmware boot: `boot` stops on an unimplemented
instruction by default, and `boot-check testdata/boot/firmware.toml`
passes.
"""

[[section.row]]
cells = ["149", "ALU sub-ops objdump itself only numbers — `vop48.1`, `vop49.1` and so on up to `vop63.1`, with 63 alone accounting for 75. The name is a CGEN enum slot, the same way `mem31` is; neither decoder has a form for them"]

[[section.row.source]]
kind       = "decompile"
ref        = "`binutils-vc4` objdump over the same addresses"
confidence = "high"

[[section.row]]
cells = ["72", "words objdump prints raw, as `vec48` or `vec80`: it recognises the class and nothing inside it"]

[[section.row.source]]
kind       = "decompile"
ref        = "`binutils-vc4` objdump over the same addresses"
confidence = "high"

[[section.row]]
cells = ["44", "memory-class words objdump spells `vunkld`, `vunkst` or `vunklookupml` — its own name for a transfer whose operands fit no form it knows"]

[[section.row.source]]
kind       = "decompile"
ref        = "`binutils-vc4` objdump over the same addresses"
confidence = "high"

[[section.row]]
cells = ["11", "addresses objdump does not decode at all: the two linear sweeps drifting apart inside data"]

[[section.row.source]]
kind       = "decompile"
ref        = "`binutils-vc4` objdump over the same addresses"
confidence = "high"

[[section.row]]
cells = ["5", "ordinary instructions objdump names and this decoder refuses, each one of a kind. Three of them objdump cannot spell either — it prints the B operand `r56?bit4??bit5?`, a 48-bit scalar field naming a register past `r31`. The other two carry something on a slot that has no business being there: a `*` on the inert dash of a store that names an address, and a `++` on a gather's inert slot, which is measurably **not** inert — `v8lookupm H(1,0),H(20++,0),H(21,0)` answers `0x04` in every lane where the plain form answers `0x40`, and what it steps is not established"]

[[section.row.source]]
kind       = "decompile"
ref        = "`binutils-vc4` objdump over the same addresses"
confidence = "high"

[[section]]
title = "Outside the instruction set"
body = """
No dual-issue pipeline. The MMU and the caches are flat: the four VC4 aliases
(`0x0`, `0x4000_0000`, `0x8000_0000`, `0xC000_0000`) fold onto one backing
store, so a line the firmware writes cached and never flushes reads back as the
new bytes here and the old ones on silicon. Two checks stand in for that rather
than modelling it, both off by default.
"""
columns = ["Switch", "What it reports", "Source"]
after = """
Machine side: exception and timer-IRQ delivery through the firmware's vector
table, and two VPU cores. Core 1 starts where `start4` writes its entry to
`IC1_WAKEUP` (`corectl` `+0x834`, `0x7E00_2834`), which on this bench happens
only on a boot that goes on to Linux.
"""

[[section.row]]
cells = ["`--check-coherency`", "each read that would see stale bytes on hardware (`src/coherency.rs`)"]


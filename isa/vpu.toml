[[section]]
title = "Flag-setting policy"
body = """
`cmp`, `cmn` and `btest` set flags and discard their result; the explicit
flag-setting triadics `adds`, `subs` and `shls` (sub-ops `0x28..=0x2a`) set
flags and write; `fcmp` sets them. Everything else writes its result and leaves
the flags alone.

This is the one load-bearing assumption in the scalar core.
"""

[[section.source]]
kind       = "inferred"
ref        = "a whole firmware boot and a Linux boot run on it without a golden-log divergence"
confidence = "medium"
note       = "evidence, not proof: an instruction whose flags nothing reads before the next `cmp` looks the same either way"


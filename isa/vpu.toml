[[section]]
title = "The accumulator"
body = """
One per lane, wider than an element. The modifier field is
`SRU 0x40 | ENA 0x20 | HIGH 0x10 | SIGN 0x08 | CLRA 0x04 | WBA 0x02 | SUB 0x01`;
the `UACC` and `SACC` mnemonics set `ENA|WBA` together, which is why an
accumulate usually writes the accumulator out. A dash destination keeps only
the accumulator's effect — the shape the codec code's multiply-accumulate
chains are written in.
"""
columns = ["Bit", "Effect", "Source"]

[[section.row]]
cells = ["`CLRA`", "clears the accumulator first — **even without `ENA`**"]

[[section.row.source]]
kind       = "measured"
ref        = "`probes/noena.s`"
confidence = "high"

[[section.row]]
cells = ["`ENA`", "accumulate at all; without it the destination takes the raw result"]

[[section.row.source]]
kind       = "measured"
ref        = "`probes/noena.s`"
confidence = "high"

[[section.row]]
cells = ["`ENA` without `WBA`", "the destination takes `result + accumulator` — `result` taken off it with `SUB` — and the accumulator itself does not move: `UADD`/`USUB`, not an accumulate"]

[[section.row.source]]
kind       = "measured"
ref        = "`probes/mhdt.s`: `CLRA UACC(A)` then `UADD(B)` answers `A + B + A`, with `A` still in the accumulator afterwards"
confidence = "high"

[[section.row.source]]
kind       = "manual"
ref        = "the VideoCore IV Programmers Manual's names for the two forms"
confidence = "medium"

[[section.row]]

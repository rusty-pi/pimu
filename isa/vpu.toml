[[section]]
title = "Operand width conversion"
body = """
The operation has a width of its own (`v8`, `v16`, `v32`) and the registers
have theirs. Two thirds of the vector ALU instructions in `start4.elf` name
registers **narrower** than the operation, and the unit converts — but it
converts the other way too, and the element is always addressed at the
**register's** own width, which is where it lives.
"""
columns = ["Direction", "Rule", "Source"]

[[section.row]]
cells = ["multiply, which carries no width of its own", "the widest **source** it names, not the widest register: `vmulhdt.ss HY(4,0),HX(62,0),HX(63,0)` is a 16-bit multiply whose product is written into a 32-bit register. With the `L` bit — a `v32` spelling — the width is 32 whatever the registers say, and a multiply naming no source register at all has a zero product at any width"]

[[section.row.source]]
kind       = "measured"
ref        = "`probes/setfmul.s`"
confidence = "high"

[[section.row]]

name: pimu
description: Install a released pimu from its apt repository, and optionally run it. Boots Raspberry Pi 4 firmware in a model, on Linux runners.
branding:
  icon: cpu
  color: green

inputs:
  version:
    description: The release to install, as its tag (`0.6.0`, no `v`). `latest` takes the newest release.
    default: latest
  args:
    description: Arguments for `pimu`, run in `working-directory` after the install (`boot --scenario boot.yaml`). Empty installs only.
    default: ""
  working-directory:
    description: Where `args` runs.
    default: .

outputs:
  version:
    description: The release that was installed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        [ "$RUNNER_OS" = Linux ] || { echo "::error::pimu releases are built for Linux only"; exit 1; }
        command -v apt-get > /dev/null || { echo "::error::this action installs from pimu's apt repository, which needs apt"; exit 1; }
        site=https://rusty-pi.github.io/pimu/apt
        root="$RUNNER_TEMP/pimu-apt"
        mkdir -p "$root/lists/partial" "$root/cache/archives/partial"
        curl -fsSL -o "$root/pimu.gpg" "$site/pimu.gpg"
        echo "deb [signed-by=$root/pimu.gpg] $site stable main" > "$root/pimu.list"
        user_apt() {
          apt-get -qq \
            -o Dir::Etc::sourcelist="$root/pimu.list" -o Dir::Etc::sourceparts=- \
            -o Dir::State::lists="$root/lists" -o Dir::Cache="$root/cache" \
            -o Debug::NoLocking=1 -o APT::Sandbox::User= "$@"
        }
        package=pimu
        [ "$VERSION" = latest ] || package="pimu=$VERSION"
        user_apt update
        (cd "$root" && user_apt download "$package")
        dpkg-deb --extract "$root"/pimu_*.deb "$root/package"
        echo "$root/package/usr/bin" >> "$GITHUB_PATH"
        echo "version=$(dpkg-deb --field "$root"/pimu_*.deb Version)" >> "$GITHUB_OUTPUT"
        "$root/package/usr/bin/pimu" boot --help > /dev/null

    - if: inputs.args != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PIMU_ARGS: ${{ inputs.args }}
      run: eval "pimu $PIMU_ARGS"

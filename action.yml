name: pimu
description: Install a released pimu from its apt repository, and optionally run it. Boots Raspberry Pi 4 firmware in a model, on Linux runners.
branding:
  icon: cpu
  color: green

inputs:
  version:
    description: The release to install, as its tag (`0.6.0`, no `v`). `latest` takes the newest release.
    default: latest
  args:
    description: Arguments for `pimu`, run in `working-directory` after the install (`boot --scenario boot.yaml`). Empty installs only.
    default: ""
  working-directory:
    description: Where `args` runs.
    default: .

outputs:
  version:
    description: The release that was installed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        [ "$RUNNER_OS" = Linux ] || { echo "::error::pimu releases are built for Linux only"; exit 1; }
        command -v apt-get > /dev/null || { echo "::error::this action installs from pimu's apt repository, which needs apt"; exit 1; }
        site=https://rusty-pi.github.io/pimu/apt
        keyring=/etc/apt/keyrings/pimu.gpg
        list=/etc/apt/sources.list.d/pimu.list
        sudo install -d /etc/apt/keyrings
        sudo curl -fsSL -o "$keyring" "$site/pimu.gpg"
        echo "deb [signed-by=$keyring] $site stable main" | sudo tee "$list" > /dev/null
        sudo apt-get -qq update \
          -o Dir::Etc::sourcelist="$list" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
        package=pimu
        [ "$VERSION" = latest ] || package="pimu=$VERSION"
        sudo apt-get -qq install -y "$package"
        echo "version=$(dpkg-query --show --showformat '${Version}' pimu)" >> "$GITHUB_OUTPUT"
        pimu boot --help > /dev/null

    - if: inputs.args != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PIMU_ARGS: ${{ inputs.args }}
      run: eval "pimu $PIMU_ARGS"

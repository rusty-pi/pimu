name: simulated-boot-log

# A change to Markdown or docs/ alone runs nothing (#86). docs/periph/ is the
# exception: it is generated from specs/*.toml, and cargo test checks it.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'docs/periph/**'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'docs/periph/**'
  workflow_dispatch:

# Every job runs on the hosted runners unless the repository variables
# RUNNER_BUILD and RUNNER_BOOT name a self-hosted pool instead: the compiles
# (tests, build) and the boots each get their own, sized for them, from
# valtzu/gh-action-nas-runner. Deleting the variables brings CI back here.
# Those runners have no sudo and already carry the packages, so the apt steps
# only run on the hosted ones.
jobs:
  # Fast lane: the decoder, peripheral and address-decode tests. No firmware
  # blobs, no boot — if one of these fails the boot check below is noise.
  tests:
    runs-on: ${{ vars.RUNNER_BUILD || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # tests/a64_diff.rs checks the A64 interpreter against qemu-aarch64
      # user-mode emulation.
      - name: Install qemu-user
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # The diagnostics are compiled out of every other build here; lint them
      # too, so they cannot rot unnoticed.
      - name: Lint (diag)
        run: cargo clippy --all-targets --features diag -- -D warnings

      - name: Test
        run: cargo test

  # Build once: the binary, the firmware blobs and every boot medium.
  build:
    runs-on: ${{ vars.RUNNER_BUILD || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install mtools and e2fsprogs
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y mtools e2fsprogs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch firmware blobs
        run: ./scripts/fetch-firmware.sh

      - name: Build SD image
        run: ./scripts/make-sd.sh

      # The same card with a kernel that parks the ARM, for the boots that end
      # at the handover (#52).
      - name: Build SD image with a halting kernel
        run: KERNEL=halt ./scripts/make-sd.sh firmware/sd-halt.img

      # And the card an imager writes, with Bluetooth and WiFi left enabled:
      # Linux's console is then the mini-UART (#124).
      - name: Build SD image with Bluetooth and WiFi enabled
        run: WIRELESS=1 ./scripts/make-sd.sh firmware/sd-wireless.img

      # And with the cut-down firmware (#105).
      - name: Build SD image with the cut-down firmware
        run: START4=start4cd KERNEL=halt ./scripts/make-sd.sh firmware/sd-halt-start4cd.img

      # And the card that hands the ARM to the RPi4 UEFI firmware instead of a
      # kernel, for the scenario that pins what UEFI reads out of the mailbox.
      - name: Build SD image with the UEFI armstub
        run: ./scripts/make-uefi-sd.sh

      - name: Build network-boot root
        run: ./scripts/make-netboot.sh firmware/sd-halt.img

      - name: Build rpi-virt-fw
        run: cargo build --release

      # The boots get all of this through the Actions cache rather than as an
      # artifact: artifacts count against the account's storage quota, and a
      # few dozen runs a day of these images used it up (every upload then
      # failed). The cleanup job deletes the entry once the run is over.
      - uses: actions/cache/save@v6
        with:
          key: boot-inputs-${{ github.run_id }}
          path: |
            target/release/rpi-virt-fw
            firmware/

  # Then every boot at once, each against its own scenario: the firmware boot
  # from each medium, and the Linux boot to a shell (#40).
  boot:
    needs: build
    runs-on: ${{ vars.RUNNER_BOOT || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - medium: sd
            scenario: testdata/boot/firmware-boot.toml
          - medium: usb
            scenario: testdata/boot/usb-boot.toml
          - medium: otg
            scenario: testdata/boot/otg-boot.toml
          - medium: tftp
            scenario: testdata/boot/tftp-boot.toml
          - medium: http
            scenario: testdata/boot/http-boot.toml
          - medium: linux
            scenario: testdata/boot/linux-boot.toml
          - medium: bt
            scenario: testdata/boot/bt-boot.toml
          - medium: b0
            scenario: testdata/boot/b0-boot.toml
          - medium: cd
            scenario: testdata/boot/cd-boot.toml
          - medium: uefi
            scenario: testdata/boot/uefi-boot.toml

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          key: boot-inputs-${{ github.run_id }}
          fail-on-cache-miss: true
          path: |
            target/release/rpi-virt-fw
            firmware/

      - name: Simulated boot (${{ matrix.medium }})
        run: target/release/rpi-virt-fw boot-check ${{ matrix.scenario }} --output boot-${{ matrix.medium }}.log

      # Nothing is uploaded: a failed boot's combined output goes to the job
      # log instead. Reproduce it locally for the console file that
      # `boot-check <scenario> --from boot-<medium>.log --update` wants.
      - name: Boot output
        if: failure()
        run: cat boot-${{ matrix.medium }}.log

  # Nothing a run stores is needed once it has finished: the boot inputs'
  # cache entry goes at the end, whatever the boots did, and so does any
  # artifact, which would count against the account's storage quota until it
  # expired.
  cleanup:
    needs: [build, boot]
    if: always()
    runs-on: ${{ vars.RUNNER_BUILD || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Delete this run's cache entry and artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const key = `boot-inputs-${context.runId}`;
            try {
              await github.rest.actions.deleteActionsCacheByKey({ ...context.repo, key });
              core.info(`deleted cache ${key}`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: context.runId, per_page: 100 },
            );
            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({
                ...context.repo,
                artifact_id: artifact.id,
              });
              core.info(`deleted ${artifact.name}`);
            }

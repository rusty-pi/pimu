name: simulated-boot-log

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast lane: the decoder, peripheral and address-decode tests. No firmware
  # blobs, no boot — if one of these fails the boot check below is noise.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `--lib --bins --tests` rather than a plain `cargo test`:
      # examples/dtblob_dump.rs does not compile (pre-existing).
      - name: Test
        run: cargo test --lib --bins --tests

  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install mtools
        run: sudo apt-get update && sudo apt-get install -y mtools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch firmware blobs
        run: ./scripts/fetch-firmware.sh

      - name: Build SD image
        run: ./scripts/make-sd.sh

      - name: Build rpi-virt-fw
        run: cargo build --release

      - name: Simulated boot (3 min cap)
        env:
          # Model the SR interrupt-enable bit and run the real ThreadX periodic
          # tick through vector-table entry 64, so the scheduler actually
          # preempts. This is what carries the boot past the second config.txt
          # read to '*** Restart logging' (issue #7).
          RVF_SCHED_TICK: "1"
          # Still forces the PLL / clock-rate loops to converge (issue #1) and
          # pins the DA9090 errno (issue #4). RVF_MBOX_KICK is no longer needed.
          RVF_GPIOMAN_SHIM: "1"
          # stream the UART console (incl. `MESS:` lines) as it is produced.
          RVF_LIVE_CONSOLE: "1"
        run: |
          timeout --signal=INT 180 \
            ./target/release/rpi-virt-fw recon firmware/pieeprom.bin \
              --eeprom --sd firmware/sd.img \
              --max-wall 170 --max-steps 100000000000 \
            2>&1 | tee boot.log
          status=${PIPESTATUS[0]}
          echo "recon exit status: $status"
          # 124 = hit the 3-minute wall clock; that is expected, not a failure.
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          # A timeout is acceptable only after start4 has progressed past the
          # async mailbox handoff and emitted its first MESS log.
          grep -q 'MESS:.*arasan_emmc_open' boot.log
          # ...and reached the HDMI phase, giving up on EDID exactly once per
          # controller the way real hardware with no monitor does (see
          # examples-on-real-hardware/vc4-boot.log).
          grep -q 'HDMI0:EDID giving up on reading EDID block 0' boot.log
          grep -q 'HDMI1:EDID giving up on reading EDID block 0' boot.log
          # A bounded number of give-ups, not a retry storm (regression guard
          # for the RVF_PMIC_EVENT window bug fixed in 71bd94a). The reference
          # log re-probes both controllers twice after '*** Restart logging',
          # so the ceiling is well above the first round's two.
          test "$(grep -c 'EDID giving up' boot.log)" -le 16
          # ...and got past the second config.txt read into the restart-logging
          # phase, which is where the reference log continues
          # (examples-on-real-hardware/vc4-boot.log line 19).
          grep -q '\*\*\* Restart logging' boot.log
          # gpioman must configure its pin providers for real (issue #2): the
          # confzilla schema pool has to survive its DMA relocation.
          if grep -q 'gpioman: configuration attempt' boot.log; then
            echo "gpioman provider registration regressed (#2)" >&2
            exit 1
          fi
          # ...through the HDMI bring-up, which needs SCALER_DISPID (#13):
          # both controllers re-probe EDID, then report their pixel-clock
          # limit (vc4-boot.log lines 20-31).
          grep -q 'hdmi: HDMI:hdmi_get_state is deprecated' boot.log
          grep -q 'HDMI0: hdmi_pixel_freq_limit' boot.log
          grep -q 'HDMI1: hdmi_pixel_freq_limit' boot.log
          # ...and past it into the file-loading phase, which needed the
          # hardware RNG modelled (e012fad): the ARM device tree, the config
          # overlays, the kernel command line and the kernel itself
          # (vc4-boot.log lines 32 onward).
          grep -q "Loaded 'bcm2711-rpi-4-b.dtb'" boot.log
          grep -q 'dtparam: spi=on' boot.log
          grep -q "Loaded overlay 'disable-bt'" boot.log
          grep -q "Read command line from file 'cmdline.txt'" boot.log
          grep -q "Loaded 'kernel8.img'" boot.log
          # The reset-cause register the bootloader reports (1bc5fa1); the real
          # board latches HADWRF, matching sd-card-boot.log line 4.
          grep -q 'PM_RSTS 00000020' boot.log
          # No nop-slides at all: the register file must survive preemptive
          # context switches (8d7c27a) and no callback may be null.
          if grep -q '\[derail\]' boot.log; then
            echo "derailed into a nop-slide" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-log
          path: boot.log

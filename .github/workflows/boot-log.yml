name: simulated-boot-log

# A change to Markdown or docs/ alone runs nothing (#86). docs/periph/ is the
# exception: it is generated from specs/*.toml, and cargo test checks it.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'docs/periph/**'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'docs/periph/**'
  workflow_dispatch:

# Every job runs on the hosted runners unless the repository variables
# RUNNER_BUILD and RUNNER_BOOT name a self-hosted pool instead: the compiles
# (tests, build) and the boots each get their own, sized for them, from
# valtzu/gh-action-nas-runner. Deleting the variables brings CI back here.
# Those runners have no sudo and already carry the packages, so the apt steps
# only run on the hosted ones.
#
# RUNNER_CACHE is the third: a directory every one of those runners can see,
# `/cache`. The build's output crosses to the boots through it instead of
# through the Actions cache service, which is in the cloud — see the build
# job. Unset, everything goes through the cache service as before; set it only
# while both pools run on the one host.
jobs:
  # Fast lane: the decoder, peripheral and address-decode tests. No firmware
  # blobs, no boot — if one of these fails the boot check below is noise.
  tests:
    runs-on: ${{ vars.RUNNER_BUILD || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # A self-hosted runner keeps its home directory between runs, so cargo's
      # output is already there — but actions/checkout wipes the workspace
      # (`git clean -ffdx` takes target/ with it), which is what the cache
      # action is working around. Putting the target directory on the volume
      # instead keeps it across runs for free, and the registry under
      # ~/.cargo was never wiped to begin with. That is 100 s of cloud cache a
      # job, and the last of this workflow's traffic to the cache service
      # (#130).
      #
      # Nothing prunes it, and an incremental build only ever adds, so it is
      # swept once a week, or sooner if the volume is down to its last 20 GB.
      # A sweep costs one cold build (~140 s); a full volume costs the runner.
      # The first run only plants the stamp, so a warm directory is not thrown
      # away for the clock's sake.
      - name: Keep cargo's output on the runner, not in the cloud
        if: runner.environment == 'self-hosted'
        run: |
          dir="$HOME/cargo-target"
          stamp="$dir/.swept"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          mkdir -p "$dir"
          if [ ! -e "$stamp" ]; then
            touch "$stamp"
            exit 0
          fi
          free=$(df -k --output=avail "$dir" | tail -1)
          if [ -n "$(find "$stamp" -mtime +6)" ] || [ "$free" -lt 20971520 ]; then
            echo "sweeping $dir ($(du -sh "$dir" | cut -f1), ${free}K free)"
            rm -rf "$dir"
            mkdir -p "$dir"
            touch "$stamp"
          fi

      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      # tests/a64_diff.rs checks the A64 interpreter against qemu-aarch64
      # user-mode emulation.
      - name: Install qemu-user
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # The diagnostics are compiled out of every other build here; lint them
      # too, so they cannot rot unnoticed.
      - name: Lint (diag)
        run: cargo clippy --all-targets --features diag -- -D warnings

      - name: Test
        run: cargo test

  # Build once: the binary, the firmware blobs and every boot medium.
  build:
    runs-on: ${{ vars.RUNNER_BUILD || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install mtools and e2fsprogs
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y mtools e2fsprogs

      - uses: dtolnay/rust-toolchain@stable

      # A self-hosted runner keeps its home directory between runs, so cargo's
      # output is already there — but actions/checkout wipes the workspace
      # (`git clean -ffdx` takes target/ with it), which is what the cache
      # action is working around. Putting the target directory on the volume
      # instead keeps it across runs for free, and the registry under
      # ~/.cargo was never wiped to begin with. That is 100 s of cloud cache a
      # job, and the last of this workflow's traffic to the cache service
      # (#130).
      #
      # Nothing prunes it, and an incremental build only ever adds, so it is
      # swept once a week, or sooner if the volume is down to its last 20 GB.
      # A sweep costs one cold build (~140 s); a full volume costs the runner.
      # The first run only plants the stamp, so a warm directory is not thrown
      # away for the clock's sake.
      - name: Keep cargo's output on the runner, not in the cloud
        if: runner.environment == 'self-hosted'
        run: |
          dir="$HOME/cargo-target"
          stamp="$dir/.swept"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          mkdir -p "$dir"
          if [ ! -e "$stamp" ]; then
            touch "$stamp"
            exit 0
          fi
          free=$(df -k --output=avail "$dir" | tail -1)
          if [ -n "$(find "$stamp" -mtime +6)" ] || [ "$free" -lt 20971520 ]; then
            echo "sweeping $dir ($(du -sh "$dir" | cut -f1), ${free}K free)"
            rm -rf "$dir"
            mkdir -p "$dir"
            touch "$stamp"
          fi

      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      - name: Fetch firmware blobs
        run: ./scripts/fetch-firmware.sh

      - name: Build SD image
        run: ./scripts/make-sd.sh

      # The same card with a kernel that parks the ARM, for the boots that end
      # at the handover (#52).
      - name: Build SD image with a halting kernel
        run: KERNEL=halt ./scripts/make-sd.sh firmware/sd-halt.img

      # And the card an imager writes, with Bluetooth and WiFi left enabled:
      # Linux's console is then the mini-UART (#124).
      - name: Build SD image with Bluetooth and WiFi enabled
        run: WIRELESS=1 ./scripts/make-sd.sh firmware/sd-wireless.img

      # And that card again with the WiFi driver and the CYW43455's own
      # firmware on its root filesystem, for the scenario that loads brcmfmac.
      - name: Build SD image with the WiFi driver
        run: BRCMFMAC=1 ./scripts/make-sd.sh firmware/sd-brcmfmac.img

      # And with the cut-down firmware (#105).
      - name: Build SD image with the cut-down firmware
        run: START4=start4cd KERNEL=halt ./scripts/make-sd.sh firmware/sd-halt-start4cd.img

      # And the card that hands the ARM to the RPi4 UEFI firmware instead of a
      # kernel, for the scenario that pins what UEFI reads out of the mailbox.
      - name: Build SD image with the UEFI armstub
        run: ./scripts/make-uefi-sd.sh

      - name: Build network-boot root
        run: ./scripts/make-netboot.sh firmware/sd-halt.img

      - name: Build pimu
        run: cargo build --release

      # Everything downstream — the tar below, the boots, `boot-check` — reads
      # the binary at target/release, wherever cargo was told to build it.
      - name: Put the binary where the boots look for it
        if: env.CARGO_TARGET_DIR != ''
        run: |
          mkdir -p target/release
          cp -f "$CARGO_TARGET_DIR/release/pimu" target/release/

      # The boots get all of this through the Actions cache rather than as an
      # artifact: artifacts count against the account's storage quota, and a
      # few dozen runs a day of these images used it up (every upload then
      # failed). The cleanup job deletes the entry once the run is over.
      - uses: actions/cache/save@v6
        if: vars.RUNNER_CACHE == ''
        with:
          key: boot-inputs-${{ github.run_id }}
          path: |
            target/release/pimu
            firmware/

      # On the self-hosted runners the cache service is the wrong way round:
      # the NAS is behind a domestic uplink, and every boot job pulls the whole
      # entry back from the cloud — which is what made a run's restores fail
      # with "The operation cannot be completed in timeout." Those runners
      # share one directory instead, and the inputs never leave the host
      # (#130).
      #
      # `tar -S`, because the cards are sparse: 208 MB of blocks in 1.8 GB of
      # file. Without it tar writes every hole out as zeros, and six boot jobs
      # unpacking 1.8 GB at once spent 40-50 s each on it. (Hard links would
      # cost nothing at all, but /cache is a volume of its own, and a link
      # across a mount point is EXDEV however far the two sides agree on the
      # device.)
      - name: Save the boot inputs to the shared cache
        if: vars.RUNNER_CACHE != ''
        env:
          CACHE: ${{ vars.RUNNER_CACHE }}
        run: |
          mkdir -p "$CACHE"
          tar -cSf "$CACHE/boot-inputs-$GITHUB_RUN_ID.tar" \
            target/release/pimu firmware/
          # A cancelled run never reaches its cleanup job, so its tar is still
          # there. Nothing else prunes the directory.
          find "$CACHE" -maxdepth 1 -name 'boot-inputs-*.tar' -mtime +1 -delete

  # Then every boot at once, each against its own scenario: the firmware boot
  # from each medium, and the Linux boot to a shell (#40).
  boot:
    needs: build
    name: boot (${{ matrix.name }})
    runs-on: ${{ vars.RUNNER_BOOT || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One job a scenario, except the two wireless boots: they are the same
        # card with and without the WiFi driver on it, and a job of their own
        # each costs another checkout and another unpack of the boot inputs for
        # less than three minutes of booting.
        include:
          - name: firmware
            scenarios: firmware
          - name: usb-boot
            scenarios: usb-boot
          - name: otg-boot
            scenarios: otg-boot
          - name: tftp-boot
            scenarios: tftp-boot
          - name: http-boot
            scenarios: http-boot
          - name: linux
            scenarios: linux
          - name: linux-wireless
            scenarios: linux-bt linux-wifi
          - name: b0-stepping
            scenarios: b0-stepping
          - name: firmware-cd
            scenarios: firmware-cd
          - name: uefi
            scenarios: uefi

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        if: vars.RUNNER_CACHE == ''
        with:
          key: boot-inputs-${{ github.run_id }}
          fail-on-cache-miss: true
          path: |
            target/release/pimu
            firmware/

      - name: Restore the boot inputs from the shared cache
        if: vars.RUNNER_CACHE != ''
        env:
          CACHE: ${{ vars.RUNNER_CACHE }}
        run: tar -xSf "$CACHE/boot-inputs-$GITHUB_RUN_ID.tar"

      # Every scenario in the job runs even after one has failed: a job with two
      # of them would otherwise never report the second, and a golden that has
      # to be re-pinned from this log needs all of them in one round.
      - name: Simulated boot (${{ matrix.name }})
        run: |
          rc=0
          for s in ${{ matrix.scenarios }}; do
            target/release/pimu boot-check "testdata/boot/$s.toml" --output "boot-$s.log" || rc=1
          done
          exit $rc

      # Nothing is uploaded: a failed boot's output goes to the job log instead.
      # That includes the console file `boot-check <scenario> --from
      # boot-<scenario>.log --update` wants, base64 so the escape sequences in a
      # Linux boot's console survive the round trip through this log. Wrapped
      # narrow on purpose: a line of a few hundred characters is dropped from the
      # log altogether, which silently lost the two longest consoles. To decode,
      # take the base64 lines after the marker and stop at the first line that is
      # not one:
      #
      #   sed -E 's/^.*Z //' <job log> \
      #     | sed -n '/^=== base64 boot-linux.log.console/,$p' | tail -n +2 \
      #     | sed -n '/^[A-Za-z0-9+/=]\+$/p' | base64 -d > boot-linux.log.console
      - name: Boot output
        if: failure()
        run: |
          for f in boot-*.log; do
            echo "=== $f"
            cat "$f"
          done
          for f in boot-*.log.console; do
            [ -e "$f" ] || continue
            echo "=== base64 $f"
            base64 -w 120 "$f"
            echo "=== end $f"
          done

  # Nothing a run stores is needed once it has finished: the boot inputs'
  # cache entry goes at the end, whatever the boots did, and so does any
  # artifact, which would count against the account's storage quota until it
  # expired.
  cleanup:
    needs: [build, boot]
    if: always()
    runs-on: ${{ vars.RUNNER_BUILD || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Delete this run's tar from the shared cache
        if: vars.RUNNER_CACHE != ''
        env:
          CACHE: ${{ vars.RUNNER_CACHE }}
        run: rm -f "$CACHE/boot-inputs-$GITHUB_RUN_ID.tar"

      - name: Delete this run's cache entry and artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const key = `boot-inputs-${context.runId}`;
            try {
              await github.rest.actions.deleteActionsCacheByKey({ ...context.repo, key });
              core.info(`deleted cache ${key}`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: context.runId, per_page: 100 },
            );
            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({
                ...context.repo,
                artifact_id: artifact.id,
              });
              core.info(`deleted ${artifact.name}`);
            }

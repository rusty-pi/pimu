name: simulated-boot-log

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast lane: the decoder, peripheral and address-decode tests. No firmware
  # blobs, no boot — if one of these fails the boot check below is noise.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install mtools
        run: sudo apt-get update && sudo apt-get install -y mtools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch firmware blobs
        run: ./scripts/fetch-firmware.sh

      - name: Build SD image
        run: ./scripts/make-sd.sh

      - name: Build rpi-virt-fw
        run: cargo build --release

      - name: Simulated boot (5 min cap)
        run: ./scripts/boot-check.sh boot.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-log
          # The console file is the golden transcript's raw material: download
          # it from a failed run and `boot-check --update` against it to see
          # exactly what the boot did differently.
          path: |
            boot.log
            boot.log.console

  # Does Linux boot the device tree our firmware hands the ARM? Independent of
  # the boot job above: it runs its own simulated boot, takes the `--dump-fdt`
  # blob out of it and feeds that to a stock QEMU. This proves the tree is one
  # Linux accepts — not that it survives the trip unchanged (QEMU rewrites parts
  # of it; see the comments in scripts/qemu-check.sh).
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # qemu-system-arm is the Debian/Ubuntu package that ships
      # qemu-system-aarch64; mtools is what pulls kernel8.img back out of the
      # SD image.
      - name: Install mtools and QEMU
        run: sudo apt-get update && sudo apt-get install -y mtools qemu-system-arm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch firmware blobs
        run: ./scripts/fetch-firmware.sh

      - name: Build SD image
        run: ./scripts/make-sd.sh

      - name: Build rpi-virt-fw
        run: cargo build --release

      # Exit 2 means this runner's QEMU has no `raspi4b` machine — a toolchain
      # gap, not a regression in the model, so report it as a warning and let
      # the job pass. Any other non-zero exit is a real failure.
      - name: Boot the handed-over device tree under QEMU
        run: |
          set +e
          ./scripts/qemu-check.sh
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning title=QEMU check skipped::this runner's qemu-system-aarch64 has no raspi4b machine"
            exit 0
          fi
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qemu-check
          path: |
            firmware/qemu-check/boot.log
            firmware/qemu-check/qemu.log
            firmware/qemu-check/handoff.dtb

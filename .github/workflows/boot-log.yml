name: simulated-boot-log

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast lane: the decoder, peripheral and address-decode tests. No firmware
  # blobs, no boot — if one of these fails the boot check below is noise.
  tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-unknown-none

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The library also builds `no_std` + `alloc`, which is what lets it run
      # inside a bare-metal aarch64 image (#32). Nothing here executes it, so
      # without a compile in CI the `cfg` arms rot within a week — the first
      # `Vec` or `eprintln!` added to a peripheral model breaks it silently.
      - name: Build the no_std library
        run: cargo clippy --no-default-features --target aarch64-unknown-none -- -D warnings

      # The bare-metal `-kernel` frontend (#32 stage 2). It is outside
      # `default-members`, so nothing above compiles it; without this step it
      # would rot unnoticed. This job has no QEMU, so it only builds — the
      # `qemu` job below actually boots the image.
      - name: Build the aarch64 frontend
        run: |
          cargo clippy --manifest-path aarch64/Cargo.toml \
            --target aarch64-unknown-none --release -- -D warnings
          cargo build --manifest-path aarch64/Cargo.toml \
            --target aarch64-unknown-none --release

  boot:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install mtools
        run: sudo apt-get update && sudo apt-get install -y mtools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch firmware blobs
        run: ./scripts/fetch-firmware.sh

      - name: Build SD image
        run: ./scripts/make-sd.sh

      - name: Build rpi-virt-fw
        run: cargo build --release

      - name: Simulated boot (5 min cap)
        run: ./scripts/boot-check.sh boot.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-log
          # The console file is the golden transcript's raw material: download
          # it from a failed run and `boot-check --update` against it to see
          # exactly what the boot did differently.
          path: |
            boot.log
            boot.log.console

  # Boot the bare-metal frontend for real (#32 stage 2). The image reports its
  # own exception level, so the EL2 claim the epic is built on is checked by a
  # run rather than asserted in a comment. Needs no firmware blobs and no SD
  # image — it is scaffolding that prints a banner and parks.
  aarch64:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # qemu-system-arm is the Debian/Ubuntu package that ships
      # qemu-system-aarch64.
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none

      - uses: Swatinem/rust-cache@v2

      # Exit 2 means this runner's QEMU has no `raspi4b` machine — a toolchain
      # gap rather than a regression, so warn and pass. Anything else is real.
      - name: Boot the aarch64 frontend under QEMU
        run: |
          set +e
          ./scripts/qemu-kernel.sh
          status=$?
          set -e
          if [ "$status" = 2 ]; then
            echo "::warning title=aarch64 frontend not booted::this runner's qemu-system-aarch64 has no raspi4b machine"
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi

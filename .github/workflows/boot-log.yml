name: simulated-boot-log

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every job runs on the hosted runners unless the repository variables
# RUNNER_BUILD and RUNNER_BOOT name a self-hosted pool instead: the compiles
# (tests, build) and the boots each get their own, sized for them, from
# valtzu/gh-action-nas-runner. Deleting the variables brings CI back here.
# Those runners have no sudo and already carry the packages, so the apt steps
# only run on the hosted ones.
jobs:
  # Fast lane: the decoder, peripheral and address-decode tests. No firmware
  # blobs, no boot — if one of these fails the boot check below is noise.
  tests:
    runs-on: ${{ vars.RUNNER_BUILD || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # tests/a64_diff.rs checks the A64 interpreter against qemu-aarch64
      # user-mode emulation.
      - name: Install qemu-user
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # The diagnostics are compiled out of every other build here; lint them
      # too, so they cannot rot unnoticed.
      - name: Lint (diag)
        run: cargo clippy --all-targets --features diag -- -D warnings

      - name: Test
        run: cargo test

  # Build once: the binary, the firmware blobs and every boot medium.
  build:
    runs-on: ${{ vars.RUNNER_BUILD || 'ubuntu-26.04' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install mtools and e2fsprogs
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y mtools e2fsprogs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch firmware blobs
        run: ./scripts/fetch-firmware.sh

      - name: Build SD image
        run: ./scripts/make-sd.sh

      # The same card with a kernel that parks the ARM, for the boots that end
      # at the handover (#52).
      - name: Build SD image with a halting kernel
        run: KERNEL=halt ./scripts/make-sd.sh firmware/sd-halt.img

      - name: Build network-boot root
        run: ./scripts/make-netboot.sh firmware/sd-halt.img

      - name: Build rpi-virt-fw
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: boot-inputs
          retention-days: 1
          path: |
            target/release/rpi-virt-fw
            firmware/

  # Then every boot at once, each against its own scenario: the firmware boot
  # from each medium, and the Linux boot to a shell (#40).
  boot:
    needs: build
    runs-on: ${{ vars.RUNNER_BOOT || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - medium: sd
            scenario: testdata/boot/firmware-boot.toml
          - medium: usb
            scenario: testdata/boot/usb-boot.toml
          - medium: tftp
            scenario: testdata/boot/tftp-boot.toml
          - medium: http
            scenario: testdata/boot/http-boot.toml
          - medium: linux
            scenario: testdata/boot/linux-boot.toml
          - medium: b0
            scenario: testdata/boot/b0-boot.toml

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: boot-inputs

      - name: Restore the executable bit
        run: chmod +x target/release/rpi-virt-fw

      - name: Simulated boot (${{ matrix.medium }})
        run: ./scripts/boot-check.sh --scenario=${{ matrix.scenario }} boot-${{ matrix.medium }}.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-log-${{ matrix.medium }}
          # The console file is the golden transcript's raw material: download
          # it from a failed run and `boot-check --update` against it to see
          # exactly what the boot did differently.
          path: |
            boot-${{ matrix.medium }}.log
            boot-${{ matrix.medium }}.log.console

name: simulated-boot-log

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast lane: the decoder, peripheral and address-decode tests. No firmware
  # blobs, no boot — if one of these fails the boot check below is noise.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install mtools
        run: sudo apt-get update && sudo apt-get install -y mtools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch firmware blobs
        run: ./scripts/fetch-firmware.sh

      - name: Build SD image
        run: ./scripts/make-sd.sh

      - name: Build rpi-virt-fw
        run: cargo build --release

      - name: Simulated boot (5 min cap)
        run: ./scripts/boot-check.sh boot.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-log
          path: boot.log

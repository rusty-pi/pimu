name: simulated-boot-log

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast lane: the decoder, peripheral and address-decode tests. No firmware
  # blobs, no boot — if one of these fails the boot check below is noise.
  tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # tests/a64_diff.rs checks the A64 interpreter against qemu-aarch64
      # user-mode emulation.
      - name: Install qemu-user
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  boot:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install mtools and e2fsprogs
        run: sudo apt-get update && sudo apt-get install -y mtools e2fsprogs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch firmware blobs
        run: ./scripts/fetch-firmware.sh

      - name: Build SD image
        run: ./scripts/make-sd.sh

      - name: Build rpi-virt-fw
        run: cargo build --release

      - name: Simulated boot (5 min cap)
        run: ./scripts/boot-check.sh boot.log

      - name: Linux boot to a shell (#40)
        if: always()
        run: ./scripts/boot-check.sh --scenario=testdata/boot/linux-boot.toml linux.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-log
          # The console file is the golden transcript's raw material: download
          # it from a failed run and `boot-check --update` against it to see
          # exactly what the boot did differently.
          path: |
            boot.log
            boot.log.console
            linux.log
            linux.log.console

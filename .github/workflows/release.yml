name: release

# Publishes the release an `X.Y.Z` tag names: the binaries, the packages and the
# container image built from the commit the tag points at. The tag is made by
# `.claude/skills/release/SKILL.md`, which works out the version and writes the
# notes this job publishes as the release body.
#
# Not on every push to main: this job is hosted rather than on the NAS pool, so
# its minutes are billed, and the PGO training below roughly doubles it.
#
# `workflow_dispatch` is the re-run path — dispatch it on the tag's ref, not on
# a branch, since the version and the notes both come from the tag. A dispatch
# runs the workflow as of that ref, so an old tag reruns the definition it was
# cut with: a fix here reaches it only through a new tag.
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # The boot-log guard below reads that workflow's runs through the API,
  # which an explicit permissions block otherwise denies the job's token.
  actions: read

# One release at a time, and never cancel one: each builds a different tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Debian 12 is the oldest release still on a Raspberry Pi OS install, so its
  # glibc (2.36) is what the binaries are built against: they then run there and
  # on anything newer. It is the container image's base too.
  BUILDER: debian:12
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    if: github.repository == 'rusty-pi/pimu'
    # Hosted, not the RUNNER_BUILD pool the rest of CI uses: this job needs
    # docker for the image, apt for the aarch64 cross linker, and an old glibc
    # to link against. The NAS runners have none of the three.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      # The whole history and the tags: the release body is the annotated tag's
      # own message, which a shallow checkout does not fetch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Take the version from the tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::dispatch this on an X.Y.Z tag, not on $GITHUB_REF_NAME"
            exit 1
          fi
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$GITHUB_REF_NAME is not an X.Y.Z tag"
            exit 1
          fi
          echo "PKG_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      # The tag names a commit that is already on main, so `simulated-boot-log`
      # has run on it there — on the same SHA, under a different ref. A run
      # that failed is worth stopping for before an hour of PGO.
      #
      # Absent or still going is not: that workflow skips a commit touching
      # only `**.md` or `docs/`, which would make such a commit unreleasable,
      # and waiting for one costs this hosted runner's billed minutes. The
      # release builds and boots the tagged commit itself either way.
      - name: Refuse a commit boot-log has already failed on
        run: |
          verdicts=$(gh run list --commit "$GITHUB_SHA" --workflow boot-log.yml \
            --json status,conclusion,url \
            --jq '.[] | select(.status == "completed") | "\(.conclusion) \(.url)"')
          if [ -z "$verdicts" ]; then
            echo "::warning::no finished simulated-boot-log run on $GITHUB_SHA"
            exit 0
          fi
          echo "$verdicts"
          if echo "$verdicts" | grep -qv '^success '; then
            echo "::error::simulated-boot-log did not pass on $GITHUB_SHA"
            exit 1
          fi

      # What the PGO training boots: the firmware blobs and the two cards
      # `scripts/pgo-build.sh` runs `boot --scenario` against. Public downloads, so
      # no token — unlike the EEPROM image above.
      - name: Fetch the firmware blobs and build the training cards
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y mtools e2fsprogs
          ./scripts/fetch-firmware.sh
          ./scripts/make-sd.sh
          KERNEL=halt ./scripts/make-sd.sh firmware/sd-halt.img

      # `--no-default-features` drops the `repo` commands — `run`, `run-all`,
      # `spec-docs` — which read golden transcripts out of
      # `testdata/` and write `docs/` through the build-time
      # `CARGO_MANIFEST_DIR`. None of that exists beside a released binary.
      #
      # The profile is trained once, on x86-64, and used for both targets:
      # `-Cprofile-use` keys on function names and CFG hashes rather than on
      # the target, and the alternative — an instrumented interpreter booting
      # Linux under qemu-user — costs hours. The instrumented build keeps the
      # default features; the profile then names functions the final builds do
      # not have, which LLVM ignores.
      #
      # Both binaries come out of the builder image: the host's glibc is newer
      # than what a release should require, and the aarch64 one is cross-linked
      # rather than emulated — every dependency is pure Rust, so the cross
      # toolchain is one gcc for the link.
      - name: Build for x86-64 and aarch64
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e CI=1 -e CARGO_HOME=/work/.cargo \
            "$BUILDER" bash -euo pipefail -c '
              apt-get -qq update
              apt-get -qq install -y --no-install-recommends \
                ca-certificates curl build-essential crossbuild-essential-arm64
              curl -fsSL https://sh.rustup.rs |
                sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
              export PATH="$CARGO_HOME/bin:$PATH"
              rustup target add aarch64-unknown-linux-gnu
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              scripts/pgo-build.sh --profile-only
              export RUSTFLAGS="-Cprofile-use=/work/target/pgo/merged.profdata"
              cargo build --release --no-default-features
              cargo build --release --no-default-features \
                --target aarch64-unknown-linux-gnu
            '
          mkdir -p dist
          cp target/release/pimu dist/pimu-amd64
          cp target/aarch64-unknown-linux-gnu/release/pimu dist/pimu-arm64

      # That the cross build produced an aarch64 binary, and that the native one
      # runs at all — a mislinked binary would otherwise be published.
      - name: Check the binaries
        run: |
          file dist/pimu-amd64 dist/pimu-arm64
          file dist/pimu-arm64 | grep -q 'ARM aarch64'
          dist/pimu-amd64 boot --help >/dev/null

      - name: Build the tarballs
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%:*} name=${pair#*:}
            dir="pimu-$name-linux"
            mkdir -p "$dir"
            cp "dist/pimu-$arch" "$dir/pimu"
            cp README.md "$dir/"
            tar -czf "dist/$dir.tar.gz" "$dir"
            rm -rf "$dir"
          done

      - name: Install nfpm
        run: |
          curl -fsSL -O \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM/nfpm_${NFPM}_amd64.deb"
          echo "$NFPM_SHA256  nfpm_${NFPM}_amd64.deb" | sha256sum -c -
          sudo apt-get install -y "./nfpm_${NFPM}_amd64.deb"
        env:
          NFPM: 2.47.0
          NFPM_SHA256: 3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97

      # nfpm expands the environment in its own fields but not in a content's
      # source path, so the architecture's binary is put where the config looks.
      - name: Build the packages
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%:*} rpm=${pair#*:}
            cp "dist/pimu-$arch" dist/pimu
            PKG_ARCH=$arch nfpm package -f packaging/nfpm.yaml -p deb \
              -t "dist/pimu_${PKG_VERSION}_$arch.deb"
            PKG_ARCH=$arch nfpm package -f packaging/nfpm.yaml -p rpm \
              -t "dist/pimu-$PKG_VERSION.$rpm.rpm"
          done
          rm dist/pimu

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # One buildx run for both architectures: the Dockerfile only copies the
      # binary TARGETARCH names, so neither image needs to execute anything.
      # `:latest` follows the newest release, so the README's `docker run` line
      # needs no version in it.
      - name: Build and push the image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:$PKG_VERSION" --tag "$IMAGE:latest" --push .

      # The release body is the annotated tag's own message — the notes written
      # when the tag was made — with the install instructions appended here, so
      # that they stay right without every tag repeating them. A lightweight tag
      # has no message of its own, so such a release gets only the appended part.
      - name: Publish the release
        run: |
          if [ "$(git cat-file -t "$PKG_VERSION")" = tag ]; then
            git tag -l --format='%(contents)' "$PKG_VERSION" > notes.md
          else
            echo "::warning::$PKG_VERSION is lightweight, so it carries no notes"
            : > notes.md
          fi

          cat >> notes.md <<EOF

          ---

          - \`pimu-x86_64-linux.tar.gz\`, \`pimu-aarch64-linux.tar.gz\`: the binary and the README.
          - \`.deb\` and \`.rpm\` of the same, installing \`/usr/bin/pimu\`.
          - \`docker run --rm -v "\$PWD:/boot" $IMAGE:$PKG_VERSION boot\` — amd64 and arm64, also tagged \`:latest\`.

          Built against Debian 12's glibc 2.36, so they run on that and anything
          newer. No firmware is included: a boot needs an EEPROM image of your own
          (\`--eeprom\`), e.g. one from
          [\`raspberrypi/rpi-eeprom\`](https://github.com/raspberrypi/rpi-eeprom).
          EOF

          # A re-dispatch on a tag whose release already exists replaces it
          # rather than failing, so a job that died after publishing can be run
          # again.
          if gh release view "$PKG_VERSION" >/dev/null 2>&1; then
            gh release edit "$PKG_VERSION" --title "$PKG_VERSION" --notes-file notes.md
            gh release upload "$PKG_VERSION" \
              dist/*.tar.gz dist/*.deb dist/*.rpm --clobber
          else
            gh release create "$PKG_VERSION" --verify-tag --title "$PKG_VERSION" \
              --notes-file notes.md dist/*.tar.gz dist/*.deb dist/*.rpm
          fi

name: periph-docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # docs/periph/ is generated from specs/*.toml and committed. Regenerate it and
  # fail on any difference: a hand edit, a file missing from the commit, or one
  # left behind by a removed spec.
  up-to-date:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate docs/periph
        run: cargo run --quiet -- spec-docs --update

      - name: Compare with the commit
        run: |
          if [ -n "$(git status --porcelain -- docs/periph)" ]; then
            git status --short -- docs/periph
            git diff -- docs/periph
            echo "::error::docs/periph is out of date; run 'cargo run -- spec-docs --update' and commit the result"
            exit 1
          fi

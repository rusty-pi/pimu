name: package-repos

# The scripts that turn a release's .deb and .rpm files into the apt and dnf
# repositories on the Pages site, run on a throwaway key and empty packages.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-apt-repo.sh'
      - 'scripts/test-apt-repo.sh'
      - 'scripts/build-rpm-repo.sh'
      - 'scripts/test-rpm-repo.sh'
      - '.github/workflows/package-repos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-apt-repo.sh'
      - 'scripts/test-apt-repo.sh'
      - 'scripts/build-rpm-repo.sh'
      - 'scripts/test-rpm-repo.sh'
      - '.github/workflows/package-repos.yml'
  workflow_dispatch:

jobs:
  repo:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y createrepo-c rpm
      - run: scripts/test-apt-repo.sh
      - run: scripts/test-rpm-repo.sh

name: pages

# Puts the page in web/ on GitHub Pages with every release, built from the
# commit the `X.Y.Z` tag points at, together with the apt repository at `/apt/`
# that serves the release's `.deb` files.
#
# `release` calls this once it has published the release, since the repository
# is made of the `.deb` files that job builds. It is a workflow of its own: it
# needs a different token and no docker, and a failure here must not hold a
# release back — the release is already out by the time this runs.
#
# One-time setup:
#
# 1. Settings > Pages > Source: "GitHub Actions".
# 2. The repository secret `APT_GPG_PRIVATE_KEY`: an ASCII-armoured private key
#    without a passphrase, made for this alone, e.g.
#    `gpg --quick-generate-key 'pimu apt <you@example.com>' default default never`
#    and `gpg --armor --export-secret-keys <fingerprint>`. The public half is
#    derived from it on every deploy. Without the secret the page is deployed
#    without the repository.
#
# `workflow_dispatch` is the re-run path; dispatch it on the tag's ref, as for
# `release`. The repository then holds that tag's packages, so dispatching an
# old tag puts the old version back.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'rusty-pi/pimu'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "$(scripts/build-wasm.sh --version)" --locked

      - run: scripts/build-wasm.sh

      - name: Assemble the site
        run: |
          scripts/assemble-site.sh site
          sed -i "s|built from a checkout|release ${GITHUB_REF_NAME}|" site/index.html

      - name: Build the apt repository
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::warning::no APT_GPG_PRIVATE_KEY secret, so the site has no apt repository"
            exit 0
          fi
          mkdir debs
          gh release download "$GITHUB_REF_NAME" --dir debs --pattern '*.deb'
          scripts/build-apt-repo.sh debs site/apt

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

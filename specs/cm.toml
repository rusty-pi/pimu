offset = 0x100
access = "rw"
notes  = "Self-clearing countdown: written password | count, polled until it reads 0. Always reads 0. The bootloader's SD host helper waits 108000000 / card clock on it after every host register write (2160 before a clock is set, 276 at 390625 Hz, 2 at 50 MHz); start4 waits 0x36 in its PLL bring-up, and 8 and 0x21C around the PLLB change after the ARM release."


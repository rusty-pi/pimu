[[register]]
name   = "PLLB_ARM"
offset = 0x13E0
access = "rw"
notes  = "PLLB's ARM channel, the clock the ARM cores run from: start4 sets the divider to 2 (1800 MHz from 3600, or 1500 MHz from 3000) before the ARM starts. After the release it sets 3 once PLLB is down at 1800 MHz (600 MHz out). Its `PROC` sequence then writes `(read & ~0xFF) | NDIV` (`0x21`) and puts the old word back when done. Back at full rate, the divider goes to 2 again: a divider that comes down is written one step at a time, each step followed by a `0x21C` `DELAY`, then written once more. The channel routine writes only the divider byte. Laid out as `PLLC_CORE2`."


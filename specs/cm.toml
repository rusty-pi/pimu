[block]
name    = "cm"
base    = 0x7E101000
size    = 0x2000
summary = "Clock manager, with the A2W PLL control in the same window"
notes   = "The analogue PLLs are not modelled: every PLL reads locked, every *_CTL register reads BUSY clear, and everything else is stored with the password byte masked on read-back. The A2W half (from 0x1000) holds each PLL's analogue words, control word, fraction and output channels. The BCM2711 bootcode programs PLLC and PLLD through a second copy of that half 0x800 higher (the *R registers); start4 reprograms PLLA, PLLC, PLLD and PLLB, and writes PLLH's analogue words, through the base copy."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, General Purpose GPIO Clocks: the CM_*CTL / CM_*DIV layout and the 0x5A password"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "EEPROM bootloader programs a PLL and polls for lock before trusting the SPI clock"
confidence = "high"

[[block.source]]
kind       = "linux"
ref        = "drivers/clk/bcm/clk-bcm2835.c: the CM_* and A2W_* offsets, the generator control bits, the PLL hold and reset bits, the lock bits and the A2W control fields"
confidence = "high"
note       = "written for the BCM2835; every offset below that the BCM2711 firmware was seen to use lines up with it"

[[block.source]]
kind       = "trace"
ref        = "--trace-mmio of the pinned firmware (pieeprom.bin and start4.elf as firmware.sha256 lists them) booted through the ARM release; every PC cited below is in those images"
confidence = "high"


[[register]]
name   = "TIMERCTL"
offset = 0x0E8
access = "rw"
notes  = "The timer's clock generator, off the oscillator. The boot ROM enables it on `SRC` 1 with `TIMERDIV` `0x36000` (1 MHz from the 54 MHz crystal) before it stages the bootcode; the bootcode stops and restarts it later, and start4 writes it again with `GATE` set. It does **not** feed the system timer at `0x7E003000`: stock start4 stops this generator (`0x5A000000`) and restarts it mid-boot while it is timing its own waits off `CLO`, and a board boots through that, so the microsecond counter runs whatever this register says. Gating the modelled counter on it makes stock start4 hang, which is how that was settled."

[[register.source]]
kind       = "linux"
ref        = "`clk-bcm2835.c`: `CM_TIMERCTL`"
confidence = "high"


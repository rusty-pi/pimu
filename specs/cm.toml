[block]
name    = "cm"
base    = 0x7E101000
size    = 0x2000
summary = "Clock manager, with the A2W PLL control in the same window"
notes   = "The analogue PLLs are not modelled: every PLL reads locked, every `*_CTL` register reads `BUSY` clear, and everything else is stored with the password byte masked on read-back. The A2W half (from `0x1000`) holds each PLL's analogue words, control word, fraction and output channels. The BCM2711 bootcode programs PLLC and PLLD through a second copy of that half `0x800` higher (the `*R` registers); start4 reprograms PLLA, PLLC, PLLD and PLLB, and writes PLLH's analogue words, through the base copy."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §5.4.2 (General Purpose GPIO Clocks): the `CM_*CTL` / `CM_*DIV` layout and the `0x5A` password"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "EEPROM bootloader programs a PLL and polls for lock before trusting the SPI clock"
confidence = "high"

[[block.source]]
kind       = "linux"
ref        = "`drivers/clk/bcm/clk-bcm2835.c`: the `CM_*` and `A2W_*` offsets, the generator control bits, the PLL hold and reset bits, the lock bits and the A2W control fields"
confidence = "high"
note       = "written for the BCM2835; every offset below that the BCM2711 firmware was seen to use lines up with it"

[[block.source]]
kind       = "trace"
ref        = "`--trace-mmio` of the pinned firmware (`pieeprom.bin` and `start4.elf` as `firmware.sha256` lists them) booted through the ARM release; every PC cited below is in those images"
confidence = "high"

[[register]]
name   = "VPUCTL"
offset = 0x008
access = "rw"
notes  = "The VPU's own clock generator. start4 writes `0x71` early, and `SRC` 4 (PLLA's core channel) with `ENAB` and `GATE` once PLLA runs. `0x71` is the oscillator: start4 moves the VPU there (`(value & ~0xF) | 1`, divider 1) before it switches PLLC off, parks it there again around PLLA's reprogramming and writes its saved words back once PLLA has locked. The move to `SRC` 4 goes the way its generator code moves a running clock that keeps its source: divider first, no stop, the control word written twice. It sets the same words again the same way once PLLB (the ARM's PLL) has started, just before the ARM does."

[[register.source]]
kind       = "linux"
ref        = "`clk-bcm2835.c`: `CM_VPUCTL`"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "start4: `0x5A000071` at `0x3EC7C434`, later `0x5A000054` at `0x3EC7DE96`"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "start4 PLLA bring-up: `VPUCTL` rewritten `0x5A000071` at `0x3EC7ECEA` and `VPUDIV` `0x5A001000` at `0x3EC7ECF8` before the PLL words, both written back at `0x3EC7EF04` / `0x3EC7EF0C` after the lock"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "start4 after PLLB's channel: `VPUDIV` `0x5A001000` at `0x3EC7DE34`, then `VPUCTL` `0x5A000054` at `0x3EC7DE96` and again at `0x3EC7DEC4`"
confidence = "high"


[block]
name    = "dwc2"
base    = 0x7E980000
size    = 0x10000
summary = "DesignWare USB 2.0 OTG controller (the USB-C port): the reset start4 runs when USB power comes on, and a host port with nothing plugged in"
notes   = "`GRSTCTL`'s reset and flush bits complete as soon as they are written and `AHBIDLE` always reads 1. The id and hardware-configuration words answer the measured values. The core is a host unless `GUSBCFG` forces device mode, a host channel asked to halt halts at once, and the root port reports nothing attached. Everything else is plain storage, and a core soft reset does not return it to its reset values."

[[block.source]]
kind       = "linux"
ref        = "`bcm283x.dtsi` `usb@7e980000` (`brcm,bcm2835-usb`, the dwc2 driver), reg size `0x10000`; `bcm2711.dtsi` keeps the node"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "`SET_POWER_STATE` USB handler `0x3ED89520..0x3ED89802`, BCM2711 branch: core soft reset and FIFO flushes, then `GUSBCFG` with `HCFG` / `HFIR`, or `DCFG` / `DCTL`"
confidence = "high"

[[block.source]]
kind       = "standard"
ref        = "edk2-platforms `Platform/RaspberryPi/Drivers/DwUsbHostDxe` (in the rpi-mkosi image's `RPI_EFI.fd`): `DwCoreInit` / `DwHcInit` / `DwHcGetRootHubPortStatus`"
confidence = "high"


[block]
name    = "vl805"
bus     = "pci"
base    = 0x0
size    = 0x1000
summary = "VIA VL805 xHCI controller (`1106:3483`): its PCI configuration space"
notes   = "Bus 1, device 0, function 0 behind the root complex, reached through `pcie` `EXT_CFG_DATA`. Reset values are the reference board's dump with the fields Linux had written (command, BAR0, MSI address / data, the PCIe control words) put back to power-on. Its xHCI registers are `xhci`."

[[block.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115: `sudo od -Ax -tx1 -v /sys/bus/pci/devices/0000:01:00.0/config`; `lspci -vvv`"
confidence = "high"


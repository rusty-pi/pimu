[[register]]
name   = "VENDOR_ACCESS"
offset = 0x43
width  = 8
access = "rw"
notes  = "Opens the vendor port (`VENDOR_INDEX` / `VENDOR_DATA`) while 1. The bootloader sets it before streaming the hub image and clears it after starting the MCU. start4's `XHCI_RESET` sets it twice, each time right after writing `0` to the command word and followed by a 5 ms wait, and clears it before it restores the command word a byte at a time with `0x146` ORed in."

[[register.source]]
kind       = "trace"
ref        = "pinned bootloader: `0x01` at `0x000A6934` before the first index, `0x00` after the MCU words; pinned start4: `0x01` at `0x3EDC5DC8` and `0x3EDC5E34`, `0x00` at `0x3EDC5F9C`, then command bytes at `0x3EDC5FA2` / `0x3EDC5FAA`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "start4 `0x3EDC5DAC`..`0x3EDC5DD8` (`ldh` command, `sth 0`, `stb 1` to `+0x3F` of the command word, delay 5000); `0x3EDC5F96`..`0x3EDC5FB0` (`stb 0`, command `|= 0x146` written low byte then high byte)"
confidence = "high"

[[register]]
name   = "VENDOR_INDEX"
offset = 0x78
access = "rw"
notes  = "Vendor indirect port, index half. The bootloader and start4 stream the VL805's own firmware through the port and read it back to verify. Indices seen: `0x52000` + n, byte n of the hub image (written as the byte repeated in all four bytes of `VENDOR_DATA`; a verify pass writes each index again and compares the low byte); `0x51000` / `0x51004`, `0x4C` / `0x80` after the image is written and `0x48` / `0` after it is checked (start4 also writes `0x48` / `0` after first clearing the image to zeros); `0x30000`, the MCU image's bus address in 64-byte units, `((phys & 0x3FFFFFFF) | (RC_BAR2_CONFIG_LO & ~0xFFF)) >> 6 | RC_BAR2_CONFIG_HI << 26`; `0x30004`, byte 0 then byte 1 of `VENDOR_DATA` set to `1` and `0`; `0x3000C` `0x500`; `0x30008`, the upper half of `VENDOR_DATA` set to `0x1800`, then its byte 0 to `1`. The bootloader waits 4 ms after the `0x51000` pair each time; start4 waits 5 ms after opening the port, after clearing the image, after each `0x51000` pair but the last."

[[register.source]]
kind       = "decompile"
ref        = "bootloader around `0x000B6CE0` (`HUB2.0 fail` at `0x000B6DF8` on a mismatch); start4 `0x3EDC5EF8` (`MCU FW: %x %x`)"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "bootloader loader `0x000B6C94` (index/data helpers `0x000B6E24`, byte `0x000B6E44`, half `0x000B6E04`, verify read `0x000B6ED0`, waits `bl 0x000AA3AC` with 4000); start4 loader `0x3EDC5D8C` (helpers `0x3EDC61B0`, `0x3EDC61CA`, `0x3EDC6190`; waits `bl 0x3ED6504C` with 5000), which refuses a hub image over 12288 bytes or an MCU image over `0x20000`"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "pinned bootloader: 9446 index/data pairs from `0x52000`, a verify pass at `0x000B6ED4` / `0x000B6ED8`, `0x30000` `0x00FFC800` (window at bus 0); pinned start4 under Linux's `NOTIFY_XHCI_RESET`: a zero pass, the image pass, a verify pass at `0x3EDC5EA6`, `0x30000` `0x10FFC800` (window at `0x4_0000_0000`)"
confidence = "high"


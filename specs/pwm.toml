[block]
name    = "pwm"
base    = 0x7E20C000
size    = 0x28
summary = "PWM0: two pulse-width / serialiser channels and the FIFO they share"
notes   = "Two of these blocks, `0x800` apart. A 4B routes PWM0's two channels to GPIO 40 and 41 (`PWM0_0` / `PWM0_1` on ALT0), where the board's analogue audio sits, and the firmware has to leave those pins alone for the SPI flash on ALT4 (`specs/spi0.toml`). Nothing in a boot programs either block: the firmware plays no sound, and Linux drives its analogue audio through the mailbox rather than here. The model is the register map and the FIFO flags a driver would poll — a write to `FIF1` goes nowhere, no channel ever runs, and no output is generated."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §8.6: \"The PWM0 register base address is `0x7e20c000` and the PWM1 register base address is `0x7e20c800`\""
confidence = "high"

[[block.source]]
kind       = "linux"
ref        = "`bcm2711.dtsi`: `pwm@7e20c000` and `pwm@7e20c800`, both `brcm,bcm2835-pwm`, with the PWM clock from CPRMAN"
confidence = "high"

[[block.copy]]
name  = "PWM1"
base  = 0x7E20C800
notes = "The second block. Its channels reach GPIO 12/13 on ALT0 and 18/19 on ALT5; the DREQs it paces are `PWM1` (1) rather than `PWM0` (5)."

[[block.copy.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §8.6 for the base, §4.2.1.3 for the two DREQ numbers"
confidence = "high"


[block]
name    = "bcm54213pe"
bus     = "mdio"
base    = 0x01
size    = 0x20
summary = "BCM54213PE gigabit Ethernet PHY on GENET's MDIO bus"
notes   = "Clause-22 registers. Without a cable there is no link partner: `BMSR` loses link and AN-complete and the partner registers read 0. With one, the partner is the reference board's switch port. The auxiliary-control, shadow and expansion spaces behind `0x18` / `0x1C` / `0x15`+`0x17` are indirect and not listed. Registers with no behaviour read back what was last written."

[[block.source]]
kind       = "linux"
ref        = "`/scb/ethernet@7d580000/mdio@e14/ethernet-phy@1`; `drivers/net/phy/broadcom.c`, `bcm-phy-lib.c`"
confidence = "high"

[[block.source]]
kind       = "standard"
ref        = "IEEE 802.3 clause 22.2.4 (registers 0..15)"
confidence = "high"

[[block.source]]
kind       = "measured"
ref        = "`SIOCGMIIREG` on `eth0`, Pi 4B rev 1.5 (d03115), Linux up with a 1 Gb/s link"
confidence = "high"


[[register]]
name   = "L2_CTRL"
offset = 0x1000
access = "rw"
notes  = "The L2 cache's maintenance port, as far as the evidence goes. The stub the bootcode relocates to `0x60010000` writes a range to `L2_FLUSH_START` / `L2_FLUSH_END`, then `0x14` here, and polls until it reads back `0x10`, right before it jumps to the next stage; bootmain does the same with `0x44` over single buffers. The low bits read back clear. The model takes `FLUSH` as clean-and-invalidate over the range, which ends the bootcode's cache-as-RAM window (`src/l2.rs`, #70). start4 configures it as it starts, `(value & 0xFFF0FFE5) | 0x430000`, and uses `0x430014`, `0x430044`, `0x430050` and `0x430054` from then on; bit 1 it sets once, as it applies `config.txt` (`0x430042` in the trace)."


[block]
name    = "bootbox"
base    = 0x7EE00000
size    = 0x4000
summary = "Boot-info handoff doorbells, and the VPU interrupt window start4's exception-12 handler reads"
notes   = "Whatever consumes the doorbells (a VPU sub-core or secure processor) is not modelled: their control bits read back clear, so every handshake completes, and parameter words read back what was written."

[[block.source]]
kind       = "decompile"
ref        = "EEPROM bootloader 0x80009594 and the stub it relocates to 0x60010000"
confidence = "medium"

[[block.source]]
kind       = "inferred"
ref        = "size: stops short of the dmalib DMA controller at 0x7EE04100"
confidence = "medium"

[[register]]
name   = "REG_03C"
offset = 0x03C
access = "rw"
notes  = "start4 writes 0x0EC00000 here as it starts, then 0x0EC01FFF to REG_040, then 0x0EC00001 here: a base, a limit and bit 0 set last, over the start of the range start4 is linked at. Meaning unknown."

[[register.source]]
kind       = "trace"
ref        = "pinned start4 entry: 0x0EC00000 at 0xFEC00DF6, 0x0EC00001 at 0xFEC00E0C"
confidence = "high"

[[register]]
name   = "REG_040"
offset = 0x040
access = "rw"
notes  = "start4 writes 0x0EC01FFF here between its two REG_03C writes. Meaning unknown."

[[register.source]]
kind       = "trace"
ref        = "pinned start4 entry: 0x0EC01FFF at 0xFEC00E02"
confidence = "high"

[[register]]
name   = "L2_CTRL"
offset = 0x1000
access = "rw"
notes  = "The L2 cache's maintenance port, as far as the evidence goes. The stub the bootcode relocates to 0x60010000 writes a range to L2_FLUSH_START / L2_FLUSH_END, then 0x14 here, and polls until it reads back 0x10, right before it jumps to the next stage; bootmain does the same with 0x44 over single buffers. The low bits read back clear. The model takes FLUSH as clean-and-invalidate over the range, which ends the bootcode's cache-as-RAM window (src/l2.rs, #70)."

[[register.source]]
kind       = "decompile"
ref        = "stub at 0x60010000 writes a trigger to 0x7EE01000 and polls it"
confidence = "medium"

[[register.source]]
kind       = "trace"
ref        = "2022-04-26 and pinned bootcode: 0x7EE01004 = 0, 0x7EE01008 = 0x0FFFFFE0, then 0x14 to 0x7EE01000; pinned bootmain: 0x00A20000..0x00A20116, then 0x44 (#70)"
confidence = "medium"

[[register.field]]
name  = "FLUSH"
bits  = "2"
notes = "Clean and invalidate L2_FLUSH_START..=L2_FLUSH_END; reads back clear."

[[register.field.source]]
kind       = "trace"
ref        = "set in both commands that follow a range, clear in the 0x50 written between them"
confidence = "low"

[[register]]
name   = "L2_FLUSH_START"
offset = 0x1004
access = "rw"
notes  = "First address of the range L2_CTRL.FLUSH acts on."

[[register.source]]
kind       = "trace"
ref        = "written right before L2_FLUSH_END and the L2_CTRL command (#70)"
confidence = "medium"

[[register.source]]
kind       = "trace"
ref        = "pinned start4 writes ranges here all through the boot (0x3EC715EE; e.g. 0xBEF27640 with L2_FLUSH_END 0xBEF4763F), the same pair to 0x7EE02104 / DOORBELL_C_SIZE just before, and L2_CTRL commands 0x430000 / 0x430014 (0x3EC7119E, 0x3EC71668)"
confidence = "medium"

[[register]]
name   = "L2_FLUSH_END"
offset = 0x1008
access = "rw"
notes  = "Last address of the range L2_CTRL.FLUSH acts on: 0x0FFFFFE0 from the bootcode's stub, so the lines are 32 bytes. It was taken for a size before #70."

[[register.source]]

[[register]]
name   = "DOORBELL_C"
offset = 0x2100
access = "rw"
notes  = "Doorbell rung by the relocated stub, like `DOORBELL_A`. start4 tests bit 0 as it starts (`0x3EC71168`). Its cache-flush routine (`0x3EC714FC`, and a copy at `0x3EC715C4`) takes a first address, a length and flags: it writes the first and last address to `DOORBELL_C_START` / `DOORBELL_C_SIZE` and to `L2_FLUSH_START` / `L2_FLUSH_END`, sets bit 1 of `DOORBELL_B` / `REG_2080` for flag bits 0 / 1, sets bits 1 / 2 here for flag bits 2 / 3 and waits for both to read clear, then for flag bit 4 writes `(L2_CTRL & ~0x18) | 4` and waits for bit 2 to clear. Just before the ARM starts it runs over `0x00000000`..`0x2EFFFFFF`, which holds the kernel and the device tree, with flags `0x1C`: `6` here, `0x430044` to `L2_CTRL`."


[block]
name    = "bootbox"
base    = 0x7EE00000
size    = 0x4000
summary = "Boot-info handoff doorbells, and the VPU interrupt window start4's exception-12 handler reads"
notes   = "Whatever consumes the doorbells (a VPU sub-core or secure processor) is not modelled: their control bits read back clear, so every handshake completes, and parameter words read back what was written."

[[block.source]]
kind       = "decompile"
ref        = "EEPROM bootloader 0x80009594 and the stub it relocates to 0x60010000"
confidence = "medium"

[[block.source]]
kind       = "inferred"
ref        = "size: stops short of the dmalib DMA controller at 0x7EE04100"
confidence = "medium"

[[register]]
name   = "DOORBELL_A"
offset = 0x1000
access = "rw"
notes  = "Doorbell rung by the relocated stub: trigger in bits 2:1, polled until clear."

[[register.source]]
kind       = "decompile"
ref        = "stub at 0x60010000 writes a trigger to 0x7EE01000 and polls it"
confidence = "medium"

[[register.field]]
name  = "CONTROL"
bits  = "3:0"
notes = "Ready / busy / trigger; always reads back clear."

[[register.field.source]]
kind       = "decompile"
ref        = "every caller spins until the bits it set read back clear"
confidence = "medium"

[[register]]
name   = "DOORBELL_A_SIZE"
offset = 0x1008
access = "rw"
notes  = "Size parameter for DOORBELL_A."

[[register.source]]
kind       = "decompile"
ref        = "stub at 0x60010000 pokes +0x08 before the trigger"
confidence = "low"

[[register]]
name   = "IRQ_STATUS"
offset = 0x1080
access = "rw"
notes  = "A VPU interrupt source is pending; the handler acks by writing 0."

[[register.source]]
kind       = "decompile"
ref        = "start4 exception-12 handler 0x3ED1804E reads 0x7EE01080 and writes 0 back"
confidence = "medium"

[[register.field]]
name  = "PENDING"
bits  = "0"
notes = "A source is pending."

[[register.field.source]]
kind       = "decompile"
ref        = "0x3ED1804E tests bit 0"
confidence = "medium"

[[register]]
name   = "IRQ_SOURCE"
offset = 0x1084
access = "rw"
notes  = "Id of the pending source."

[[register.source]]
kind       = "decompile"
ref        = "0x3ED1804E reads +0x04 of the window"
confidence = "medium"

[[register]]
name   = "IRQ_PAYLOAD"
offset = 0x1088
access = "rw"
notes  = "Payload of the pending source."

[[register.source]]
kind       = "decompile"
ref        = "0x3ED1804E reads +0x08 of the window"
confidence = "medium"

[[register]]
name   = "DOORBELL_B"
offset = 0x2000
access = "rw"
notes  = "Boot-info doorbell: the bootloader stages a BSTE / BVER block at 0xC0040000, sets bit 1 and spins until it clears."

[[register.source]]
kind       = "decompile"
ref        = "0x80009594 sets bit 1 of 0x7EE02000 and spins"
confidence = "high"

[[register.field]]
name  = "CONTROL"

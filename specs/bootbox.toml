summary = "Boot-info handoff doorbells, and the VPU interrupt window start4's exception-12 handler reads"
notes   = "Whatever consumes the doorbells (a VPU sub-core or secure processor) is not modelled: their control bits read back clear, so every handshake completes, and parameter words read back what was written."


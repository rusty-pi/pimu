[block]
name    = "pcm"
base    = 0x7E203000
size    = 0x24
summary = "PCM / I²S audio: the one serial-audio interface on the chip"
notes   = "One module, on GPIO 18 to 21 (`PCM_CLK`, `PCM_FS`, `PCM_DIN`, `PCM_DOUT` on ALT0) or GPIO 28 to 31 on ALT2. Nothing on a 4B is wired to it unless a HAT brings its own codec, and no firmware in a boot touches the block. The model is the register map with both FIFOs empty: a transmit write is dropped, a receive read answers 0, and neither the interrupt nor the DREQs ever go up."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §7.9: \"There is only one PCM module in the BCM2711. The PCM base address for the registers is `0x7e203000`\""
confidence = "high"

[[block.source]]
kind       = "linux"
ref        = "`bcm2711.dtsi`: `pcm@7e203000`, `brcm,bcm2835-i2s`, with DMA channels named `tx` and `rx`"
confidence = "high"

[block.irq]
vpu = 119

[[block.irq.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §6.2.4 Table 102: VC peripheral IRQ 55 is `PCM/I2S`, VPU source 119"
confidence = "high"

[[block.irq.source]]
kind       = "trace"
ref        = "`linux-boot`, `PIMU_TRACE_MMIO=0x7e002000-0x7e002060`: the secure service enables source 119 among the eight `IRQ_PRIO` words it writes"
confidence = "medium"
note       = "Which is the firmware enabling the source, not this block raising it: nothing in a boot programs the PCM."

[[register]]
name   = "CS_A"
offset = 0x00
access = "rw"
reset  = 0x0028_0000
notes  = "Control and status. The bottom three bits can be written while the interface runs; the rest cannot. A read here answers the stored control bits with the FIFO flags of an idle, empty interface on top of them — `TXE`, `TXD` and `TXW` set, `RXF`, `RXD` and `RXR` clear — which is what the `reset` records."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §7.9 Table 143 (`CS_A`)"
confidence = "high"


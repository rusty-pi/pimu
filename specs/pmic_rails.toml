[block]
name    = "pmic_rails"
bus     = "i2c"
base    = 0x1B
size    = 0x100
summary = "Board PMIC owning the SDRAM and I/O rails (start4 descriptor type `0x83`)"
notes   = "On the `bsc` PMIC copy. The board revision, not a probe, selects the driver: there is no part-id register to get right. start4's init sweeps `0x00..0x14` once to log it. Registers not listed read 0."

[[block.source]]
kind       = "decompile"
ref        = "`pmic_init` `0x3ED4DAA8` / `pmic_add` `0x3ED4D85C`; descriptor `0x3EDE962C`: type `0x83`, addr `0x1B`, 0.8..1.4 V"
confidence = "high"

[block.parent]
name  = "bsc.PMIC"
notes = "start4's I²C driver picks its base from the bus id, and this part sits on bus 8."

[[block.parent.source]]
kind       = "decompile"
ref        = "`FUN_0ecf0ed0`: bus id 8 -> `0x7E205E00`; `pmic_init` `0x3ED4DAA8` opens that bus before it probes"
confidence = "high"

[[register]]
name   = "STATUS"
offset = 0x00
width  = 8
access = "r"
notes  = "Status. start4 also reads it every 100 ms once the ARM runs. Its status callback takes bits 5 and 6 as a fault: when either is set it writes the value it read back, and the callback reports trouble with the supply, as it does when the read fails. The model's `0x10` has neither."

[[register.source]]
kind       = "decompile"
ref        = "settle callback `0x3EC8C746`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "status callback `0x3EC8C5C8` (descriptor `0x3EDE962C` `+0x24`): read `0x00`; `(value & 0x60) == 0` returns 0, else a 1-byte write of the value to `0x00` and 1"
confidence = "high"

[[register.field]]
name  = "SETTLED"
bits  = "4"
notes = "Voltage change complete; polled after every setpoint write."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x3EC8C746` polls reg `0x00` bit 4"
confidence = "high"

[[register]]
name   = "REG_05"
offset = 0x05
width  = 8
access = "rw"
notes  = "start4 reads it once more after its init sweep and sets bit 0 of what it read, and writes 1 to register 4. The read is not spare: a running d03115 holds `0x1E` here, and writing a bare `1` clears the four set bits and stops the board dead. The bootloader's power-off (`POWER_OFF_ON_HALT=1` with `WAKE_ON_GPIO=0`, after Linux powers the board off) writes `0x3F` here, after its ten LED blinks, and then sleeps for good: this is what switches a 0x1B board off. So the register gates the rails, one bit each; which bit is which is not known."

[[register.source]]
kind       = "decompile"
ref        = "bootloader power-off op `0x80009ED2`: with board feature bit 2 (`[gp+776]`), `session(0x1B)` then write `0x05 = 0x3F`, then `sleep` in a loop"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "4B rev 1.5 over I2C with the register-read path fixed: reg 0x05 reads 0x1E on a running board. `rusty-pi-firmware` wrote a bare 1 here and the machine stopped with no watchdog rescue; read-modify-write of `0x1E | 1` boots and runs (6/6 tryboots)"
confidence = "high"
note       = "the decompile reads as a store of 1; on silicon it has to be the read OR 1, or the other rails go off"

[[register.source]]
kind       = "trace"
ref        = "`boot --bootconf POWER_OFF_ON_HALT=1 --bootconf WAKE_ON_GPIO=0 --send-after '/ # ' 'poweroff -f\\n' --log pmic` on `d03115`: after `Halt: wake: 0 power_off: 1`, `1b W 05 = 3f` at 4.08 s and nothing after"
confidence = "high"


[block]
name    = "pmic_rails"
bus     = "i2c"
base    = 0x1B
size    = 0x100
summary = "Board PMIC owning the SDRAM and I/O rails (start4 descriptor type `0x83`)"
notes   = "On the `bsc` PMIC copy. The board revision, not a probe, selects the driver: there is no part-id register to get right. start4's init sweeps `0x00..0x14` once to log it. Registers not listed read 0."

[[block.source]]
kind       = "decompile"
ref        = "`pmic_init` `0x3ED4DAA8` / `pmic_add` `0x3ED4D85C`; descriptor `0x3EDE962C`: type `0x83`, addr `0x1B`, 0.8..1.4 V"
confidence = "high"

[[register]]
name   = "STATUS"
offset = 0x00
width  = 8
access = "r"
notes  = "Status. start4 also reads it every 100 ms once the ARM runs. Its status callback takes bits 5 and 6 as a fault: when either is set it writes the value it read back, and the callback reports trouble with the supply, as it does when the read fails. The model's `0x10` has neither."

[[register.source]]
kind       = "decompile"
ref        = "settle callback `0x3EC8C746`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "status callback `0x3EC8C5C8` (descriptor `0x3EDE962C` `+0x24`): read `0x00`; `(value & 0x60) == 0` returns 0, else a 1-byte write of the value to `0x00` and 1"
confidence = "high"

[[register.field]]
name  = "SETTLED"
bits  = "4"
notes = "Voltage change complete; polled after every setpoint write."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x3EC8C746` polls reg `0x00` bit 4"
confidence = "high"

[[register]]
name   = "SETPOINT_SDRAM"
offset = 0x09
width  = 8
access = "rw"
reset  = 40
notes  = "Setpoint of rails 2..4 (`sdram_c` / `sdram_p` / `sdram_i`): `raw * 5 mV + 0.9 V`."

[[register.source]]
kind       = "decompile"
ref        = "rail table image `0x3EE135AC`; decode callback `0x3EC8C710`"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "`vcgencmd measure_volts sdram_c|sdram_i|sdram_p` on a d03115: 1.1000 V each, i.e. raw 40"

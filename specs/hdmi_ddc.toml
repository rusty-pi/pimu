[block]
name    = "hdmi_ddc"
base    = 0x7EF04500
size    = 0x100
summary = "HDMI DDC I²C masters (`brcm,bcm2711-hdmi-i2c`), one per connector: the bus a monitor's EDID EEPROM sits on"
notes   = "Not the BSC: a different block with a different layout. With no monitor attached (the reference board's state) every transfer completes `INTRP | NOACK`. The second reg window in the device tree, the auto-i2c block at `0x7EF00B00`, is its own block (`hdmi_auto_i2c`); the same device answers both."

[[block.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115 `/proc/device-tree/soc/i2c@7ef04500`: `compatible brcm,bcm2711-hdmi-i2c`, `reg 0x7ef04500 0x100 0x7ef00b00 0x300`, `clock-frequency 97500`"
confidence = "high"

[[block.source]]
kind       = "linux"
ref        = "`drivers/i2c/busses/i2c-brcmstb.c`: `struct bsc_regs`"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "start4's driver: read `0x3ECE69E2`, write `0x3ECE6DEC`, accessors `0x3ECE6B00` / `0x3ECE6EC8`, completion wait `0x3ECE6D5C`"
confidence = "high"

[[block.copy]]
name  = "HDMI1"
base  = 0x7EF09500
notes = "HDMI1's DDC master; HDMI0's is the block base."

[[block.copy.source]]
kind       = "linux"
ref        = "dtb node `i2c@7ef09500`, `brcm,bcm2711-hdmi-i2c`"
confidence = "high"


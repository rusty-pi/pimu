[block]
name    = "gicd"
bus     = "arm"
base    = 0xFF841000
size    = 0x1000
summary = "GIC-400 distributor"
notes   = "256 interrupt IDs, 4 CPUs, Security Extensions. The bit-per-interrupt arrays are listed at their architectural extent (1020 IDs); IDs past 255 read as zero. IPRIORITYR, ITARGETSR and the SGI source registers are byte-accessible. The armstub moves every interrupt to group 1 before Linux runs non-secure."

[[block.source]]
kind       = "linux"
ref        = "dtb: interrupt-controller@40041000, arm,gic-400, reg <0x40041000 0x1000 ...> -> 0xFF841000"
confidence = "high"

[[block.source]]
kind       = "standard"
ref        = "ARM IHI 0048B (GICv2), section 4.3, and the GIC-400 TRM"
confidence = "high"

[[register]]
name   = "CTLR"
offset = 0x000
access = "rw"
notes  = "Secure view: EnableGrp0 (0), EnableGrp1 (1). Non-secure view: EnableGrp1 in bit 0."

[[register.source]]
kind       = "standard"
ref        = "GICv2 4.3.1 GICD_CTLR"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "armstub writes 3 on the secondary cores"
confidence = "high"

[[register]]
name   = "TYPER"
offset = 0x004
access = "r"
reset  = 0x0000FC67
notes  = "256 IDs, 4 CPUs, Security Extensions, LSPI 31."

[[register.source]]
kind       = "measured"
ref        = "/dev/mem read of 0xFF841004 on the reference board"
confidence = "high"

[[register]]
name   = "IIDR"
offset = 0x008
access = "r"
reset  = 0x0200143B
notes  = "ARM (0x43B), GIC-400 distributor r0p1."

[[register.source]]
kind       = "measured"
ref        = "/dev/mem read of 0xFF841008 on the reference board"
confidence = "high"

[[register]]
name   = "IGROUPR"
offset = 0x080
count  = 32
stride = 4
access = "rw"
notes  = "Group per interrupt: 1 = group 1 (non-secure). Secure access only."

[[register.source]]
kind       = "standard"
ref        = "GICv2 4.3.4 GICD_IGROUPRn"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "armstub writes ~0 to IGROUPR0..7"
confidence = "high"


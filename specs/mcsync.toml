[block]
name    = "mcsync"
base    = 0x7E000000
size    = 0x1000
summary = "Thirty-two hardware semaphores, plus the mailbox words and ack registers around them"

[[block.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115, `/dev/mem`: the block answers its own tag `0x4D554C54` -- `\"MULT\"` big-endian -- at `0xFE00008C` and at every word from `0xFE0000CC` to `0xFE000FFC`, so the registers end at `+0xC8` and the tag names the block the way `corectl` answers `INTE` and the GPIO block `gpio`. Every register from `+0x80` to `+0xC8` is decoded, checked by reading each after three different preceding values."
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "`0x3ED3A114` / `0x3ED3A00C` address the slot array at `0x7E000000`"
confidence = "high"

[[block.source]]
kind       = "inferred"
ref        = "size: the SDC block starts at `0x7E001000`"
confidence = "medium"

[block.irq]
vpu   = { ACK76 = 76, ACK77 = 77 }
notes = "Each line is acked through the word named after it. Neither core enables them on the pinned boot, so the doorbells are polled rather than taken."

[[block.irq.source]]
kind       = "decompile"
ref        = "ISR `0x3ED3A098` (handler table `gp+58004`) does `[ACK76] &= ~[PENDING]`, and `ACK77` for 77"
confidence = "high"

[[block.irq.source]]
kind       = "trace"
ref        = "`--log irqen`: neither core calls `enable_irq_source` for 76 or 77"
confidence = "high"

[[block.irq.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §6.2.4 Table 102: VC peripheral IRQs 12 and 13 are `Multicore Sync 0` and `Multicore Sync 1`, sources 76 and 77"
confidence = "high"
note       = "IRQs 14 and 15 are `Multicore Sync 2` and `Multicore Sync 3`, the sources 78 and 79 start4 posts in software as its reschedule IPI; they are not acked through this block"

[[register]]
name   = "SEMA"
offset = 0x00
count  = 32
stride = 4
access = "rw"
notes  = "Thirty-two hardware test-and-set semaphores, one per word. A read answers 0 if the semaphore was free **and takes it**, or 1 if it was already held; any write releases it, whatever value is written. So a read is not a load: `0x3ED3A00C`'s spin **while** the word is non-zero is an acquire loop that ends the moment the semaphore is free, and `0x3ED3A114`'s write of 1 is a release, not a post. Which ones are held reads out of `STATUS`."

[[register.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115 running a firmware that never touches this block, `/dev/mem` at `0xFE000000`: with every slot released, six reads of slot 5 answer `0 1 1 1 1 1` and `STATUS` then reads `0x00000020`. Reading slots 0, 7 and 31 makes `STATUS` exactly `0x80000081`; writing slot 7 leaves `0x80000001`. A write of 0 and a write of 1 both release, and `0xffffffff` written reads back 0, so the slot is one bit. All 32 slots behave alike."
confidence = "high"

[[register.source]]
kind       = "datasheet"
ref        = "Broadcom `bcm2708_chip/multicore_sync.h`: `MS_SEMA_0`..`MS_SEMA_31` at `0x7E000000`..`0x7E00007C`, RW, one bit each"
confidence = "medium"

[[register.source]]
kind       = "decompile"
ref        = "`0x3ED3A114` (write, i.e. release), `0x3ED3A00C` (spin while non-zero, i.e. acquire)"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "`recon` run: clock-service manager posts slot 6, then suspends"
confidence = "high"

[[register]]
name   = "STATUS"
offset = 0x80
access = "r"
notes  = "Which of the 32 `SEMA` semaphores are currently held, one bit each. The firmware treats a held semaphore as a message waiting, so its ISR clears exactly these bits from its ack word -- but the register is the hardware's held-bitmap, not a separate pending set."

[[register.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115: 0 with every semaphore released; exactly `0x80000081` with slots 0, 7 and 31 taken, and `0x80000001` after slot 7 is released. Under stock start4 `f5e89631` with Linux idle it reads 0."
confidence = "high"

[[register.source]]
kind       = "datasheet"
ref        = "Broadcom `bcm2708_chip/multicore_sync.h`: `MS_STATUS` at `0x7E000080`, RO"
confidence = "medium"

[[register.source]]
kind       = "decompile"
ref        = "ISR `0x3ED3A098`"
confidence = "medium"


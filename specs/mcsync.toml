[block]
name    = "mcsync"
base    = 0x7E000000
size    = 0x1000
summary = "Doorbells / semaphores between the two VPU cores"

[[block.source]]
kind       = "decompile"
ref        = "`0x3ED3A114` / `0x3ED3A00C` address the slot array at `0x7E000000`"
confidence = "high"

[[block.source]]
kind       = "inferred"
ref        = "size: the SDC block starts at `0x7E001000`"
confidence = "medium"

[block.irq]
vpu   = { ACK76 = 76, ACK77 = 77 }
notes = "Each line is acked through the word named after it. Neither core enables them on the pinned boot, so the doorbells are polled rather than taken."

[[block.irq.source]]
kind       = "decompile"
ref        = "ISR `0x3ED3A098` (handler table `gp+58004`) does `[ACK76] &= ~[PENDING]`, and `ACK77` for 77"
confidence = "high"

[[block.irq.source]]
kind       = "trace"
ref        = "`--log irqen`: neither core calls `enable_irq_source` for 76 or 77"
confidence = "high"

[[block.irq.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §6.2.4 Table 102: VC peripheral IRQs 12 and 13 are `Multicore Sync 0` and `Multicore Sync 1`, sources 76 and 77"
confidence = "high"
note       = "IRQs 14 and 15 are `Multicore Sync 2` and `Multicore Sync 3`, the sources 78 and 79 start4 posts in software as its reschedule IPI; they are not acked through this block"

[[register]]
name   = "DOORBELL"
offset = 0x00
count  = 32
stride = 4
access = "rw"
notes  = "Poster writes 1; the receiving core clears it once the work is done."

[[register.source]]
kind       = "decompile"
ref        = "`0x3ED3A114` (post), `0x3ED3A00C` (wait while non-zero)"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "`recon` run: clock-service manager posts slot 6, then suspends"
confidence = "high"

[[register]]
name   = "PENDING"
offset = 0x80
access = "r"
notes  = "Doorbells pending for this core's interrupt; the ISR clears exactly these bits from its ack word."

[[register.source]]
kind       = "decompile"
ref        = "ISR `0x3ED3A098`"
confidence = "medium"

[[register]]
name   = "ACK76"
offset = 0x84
access = "rw"
notes  = "Acknowledge word for VPU interrupt source 76. The ISR does `[+0x84] &= ~[+0x80]`."

[[register.source]]
kind       = "decompile"
ref        = "ISR `0x3ED3A098` (handler table `gp+58004`)"
confidence = "medium"

[[register.source]]
kind       = "trace"
ref        = "`--log irqen`: neither core calls `enable_irq_source` for 76 or 77"
confidence = "medium"
note       = "so the interrupt path itself is not exercised by the boot so far"

[[register]]
name   = "ACK77"
offset = 0x88
access = "rw"
notes  = "Acknowledge word for VPU interrupt source 77. The ISR does `[+0x88] &= ~[+0x80]`."

[[register.source]]
kind       = "decompile"
ref        = "ISR `0x3ED3A098` (handler table `gp+58004`)"
confidence = "medium"

[[register.source]]
kind       = "trace"
ref        = "`--log irqen`: neither core calls `enable_irq_source` for 76 or 77"
confidence = "medium"
note       = "so the interrupt path itself is not exercised by the boot so far"

[[register]]
name   = "SECURE_MARK"
offset = 0xB4
access = "rw"
notes  = "Both bootloader stages write 0 here as they start, OR bit 31 of it into their secure-boot flags each time they work them out, and set bit 31 once any flag is set (`SIGNED_BOOT`, or the OTP secure-boot rows), so a later look within the stage sees secure boot even if the settings no longer say so. Reads 0 in the model, so there every look starts afresh."

[[register.source]]
kind       = "decompile"
ref        = "EEPROM bootmain: `0xA7B88` (clear at start), `0xA92C6` (read into the flags), `0xA934A` / `0xA9352` (set bit 31 when the flags are non-zero)"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "`--trace-mmio`, `--bootconf SIGNED_BOOT=1`: bootsys writes 0 at `0x80007ED0` and reads / sets it at `0x8000902C`, `0x800090A4` / `0x800090A8`; bootmain clears it, then every flags check reads it twice and writes `0x80000000`"
confidence = "high"

[[register]]
name   = "REG_0BC"
offset = 0xBC
access = "r"
notes  = "Both bootloader stages read this as they start, just before clearing `SECURE_MARK`, and keep bits 16-23. Meaning unknown; it reads 0 in the model."

[[register.source]]
kind       = "trace"
ref        = "`--trace-mmio`: bootsys `0x80007EBE`, bootmain `0xA7B70`, each followed by a read of the system timer and the write to `SECURE_MARK`"
confidence = "high"

[[register]]
name   = "LOCK"
offset = 0xC0
access = "rw"
notes  = "start4 reads this word and writes its own address back into it from dozens of places, tens of thousands of times a boot; it reads 0 in the model. By the look of it a lock word the two cores claim."

[[register.source]]
kind       = "trace"
ref        = "pinned start4: reads at `0x3EC3C6F6`, `0x3EC3E1CC` and others, each followed by `0x7E0000C0` <- `0x7E0000C0` (`0x3EC3C756`, `0x3EC3E23A`, ...); the busiest pair of sites is `0x3ED651D8` / `0x3ED65216`"
confidence = "high"

[[register.source]]
kind       = "inferred"
ref        = "read, then write your own address, is a claim protocol; nothing in the boot reads it back as anything but 0"
confidence = "low"

[[register]]
name   = "MBOX5"
offset = 0xB4
access = "rw"
notes  = "Mailbox word 5, which the model used to call `SECURE_MARK`. Both bootloader stages write 0 here as they start, OR bit 31 of it into their secure-boot flags each time they work them out, and set bit 31 once any flag is set (`SIGNED_BOOT`, or the OTP secure-boot rows), so a later look within the stage sees secure boot even if the settings no longer say so. Reads 0 in the model, so there every look starts afresh."

[[register.source]]
kind       = "decompile"
ref        = "EEPROM bootmain: `0xA7B88` (clear at start), `0xA92C6` (read into the flags), `0xA934A` / `0xA9352` (set bit 31 when the flags are non-zero)"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "`--trace-mmio`, `--bootconf SIGNED_BOOT=1`: bootsys writes 0 at `0x80007ED0` and reads / sets it at `0x8000902C`, `0x800090A4` / `0x800090A8`; bootmain clears it, then every flags check reads it twice and writes `0x80000000`"
confidence = "high"

[[register]]
name   = "MBOX7"
offset = 0xBC
access = "r"
notes  = "Mailbox word 7, which the model used to call `REG_0BC`. Both bootloader stages read this as they start, just before clearing `SECURE_MARK`, and keep bits 16-23. Meaning unknown; it reads 0 in the model."

[[register.source]]
kind       = "trace"
ref        = "`--trace-mmio`: bootsys `0x80007EBE`, bootmain `0xA7B70`, each followed by a read of the system timer and the write to `SECURE_MARK`"
confidence = "high"

[[register]]
name   = "VPUSEMA0"
offset = 0xC0
access = "rw"
notes  = "The first of the two semaphores that sit apart from the 32, which the model used to call `LOCK`. start4 reads this word and writes its own address back into it from dozens of places, tens of thousands of times a boot -- read to claim, write to let go, which is what the name says it is. Measured, though, it does not behave as the 32 do: every read answers the same value rather than 0 once and 1 after. It reads 0 in the model."

[[register.source]]
kind       = "trace"
ref        = "pinned start4: reads at `0x3EC3C6F6`, `0x3EC3E1CC` and others, each followed by `0x7E0000C0` <- `0x7E0000C0` (`0x3EC3C756`, `0x3EC3E23A`, ...); the busiest pair of sites is `0x3ED651D8` / `0x3ED65216`"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115: reads 0 on three consecutive reads under stock start4 `f5e89631` and under a from-scratch firmware, so unlike `SEMA` a read neither takes it nor changes it"
confidence = "high"

[[register.source]]
kind       = "datasheet"
ref        = "Broadcom `bcm2708_chip/multicore_sync.h`: `MS_VPUSEMA_0`, 1 bit"
confidence = "medium"

[[register.source]]
kind       = "inferred"
ref        = "read, then write your own address, is a claim protocol -- and the block's own name for the register agrees"
confidence = "medium"


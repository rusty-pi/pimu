[block]
name    = "vce"
base    = 0x7F100000
size    = 0x21000
summary = "VCE vector/codec engine: data memory, program memory and register file"
notes   = "The control block sits apart at `0x7F140000` (`vce_ctrl`); `0x7F130000` is not claimed. The engine's own ISA is not emulated, so a launch leaves the register file zeroed, which is the honest answer for the codec-licence check on a board whose licence rows are blank."

[[block.source]]
kind       = "decompile"
ref        = "start4's `vcfw/drivers/chip/vciv/2708/vce.c` (function names from `start4db.elf`'s assert strings)"
confidence = "high"

[[register]]
name   = "DATA"
offset = 0x00000
count  = 16384
stride = 4
access = "rw"
notes  = "Data memory, 64 KiB: `vce_loaddata` copies the caller's blob in, `vce_launch_complete` copies results out."

[[register.source]]
kind       = "decompile"
ref        = "`vce_loaddata` / `vce_launch_complete` use `0x7F100000`"
confidence = "high"

[[register]]
name   = "PROG"
offset = 0x10000
count  = 16384
stride = 4
access = "rw"
notes  = "Program memory, 64 KiB; the driver asserts a program is under `0x4000` bytes."

[[register.source]]
kind       = "decompile"
ref        = "`vce_loadprogram`'s destination `0x7F110000`"
confidence = "high"

[[register]]
name   = "REG"
offset = 0x20000
count  = 1024
stride = 4
access = "rw"
notes  = "Register file. The highest register the firmware touches is 62, the run's result word."

[[register.source]]
kind       = "decompile"
ref        = "`vce_getreg` / `vce_setreg`: `(n * 4 + 0x120000) | 0x7F000000`; `vce_run` reads `0x7F1200F8`"
confidence = "high"

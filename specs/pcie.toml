[block]
name    = "pcie"
base    = 0x7D500000
size    = 0x9310
summary = "PCIe root complex (`pcie-brcmstb`), with the VL805 xHCI controller behind it"
notes   = "`+0x0000..+0x0FFF` is the root port's own configuration space (seeded from a Raspberry Pi 4B d03115; its layout is PCI's, not listed here beyond the two words with behaviour). The VPU reaches the endpoint's BAR0 only by 40-bit DMA through the outbound window; the endpoint's DMA comes back through inbound window 2."

[[block.source]]
kind       = "trace"
ref        = "pinned bootloader, after the link trains: the root port's capability words `+0xB4 |= 0xF` (`0x000A6E30`), `+0xC8 |= 0x18` (`0x000A6E44`), `+0x188 &= ~0xC` (`0x000A6E60`), and before it `+0xDC` target speed `2` (`0x000A6DBC`); after the outbound window, its type-1 header, each write read back: memory base / limit `0x8000` / `0xBFF0`, prefetchable base / limit `0xFFF0` / `0`, their upper halves `0`, I/O upper halves `0`, bridge control `1`, interrupt line `0x35`, cache line `0x10`, command `0x146` (`0x000A68FA` 16-bit, `0x000A6918` 32-bit, `0x000A6934` 8-bit writes)"
confidence = "high"

[[block.source]]
kind       = "measured"
ref        = "`/proc/device-tree/scb/pcie@7d500000/reg` on a real board: `<0x0 0x7d500000 0x0 0x9310>`"
confidence = "high"

[[block.source]]
kind       = "linux"
ref        = "`drivers/pci/controller/pcie-brcmstb.c`"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "bootcode `0x8000AB4A`; second-stage bootloader `pcie_reset` `0x000A7034`, `pcie_init` `0x000A6CA2` / `0x000A6DCC`, link poll `0x000A6F7E`, bus scan `0x000A712C`"
confidence = "high"

[block.irq]
gic_spi = { INTA = 143, MSI = 148 }
notes   = "`INTA` is the endpoint's legacy line as the root port reports it; `MSI` is the root complex's own MSI block."

[[block.irq.source]]
kind       = "linux"
ref        = "`pcie@7d500000`: the `interrupt-map` routes INTA to `GIC_SPI 143`, and `interrupt-names = \"pcie\", \"msi\"` puts the MSI controller on `GIC_SPI 148`"
confidence = "high"

[[block.irq.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115: `/proc/interrupts` shows id 175 as `GICv2 175 Level PCIe PME, aerdrv`"
confidence = "high"


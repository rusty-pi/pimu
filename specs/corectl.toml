[block]
name            = "corectl"
base            = 0x7E002000
size            = 0x1000
summary         = "VPU core control: per-core boot handshake and interrupt controller"
instances       = 2
instance_stride = 0x800
notes           = "One register bank per VPU core: core 0 at +0x000, core 1 at +0x800. start4 reaches its bank through a per-core pointer, so both cores run the same code."

[[block.source]]
kind       = "decompile"
ref        = "per-core init 0x3EC3E938 sets [blk+12] = 0x7E002000 + core * 0x800"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "RVF_DBG_IRQEN and the peripheral stub show core 1 writing 0x7E002810..0x7E002844"
confidence = "high"
note       = "the window was mapped 0x100 wide until commit 7bd21a3, which hid core 1's bank"

[[block.source]]
kind       = "inferred"
ref        = "size: the system timer starts at 0x7E003000"
confidence = "medium"

[[register]]
name   = "IRQ_PENDING"
offset = 0x04
access = "r"
notes  = "Which interrupt the dispatcher should service next."

[[register.source]]
kind       = "decompile"
ref        = "dispatcher 0x3EC3E9BC: r0 = [blk+4], btest r0, 8, or 64, mask to 7 bits, index the handler table at gp+58004"
confidence = "medium"

[[register.field]]
name  = "VALID"
bits  = "8"
notes = "Set while an interrupt is pending."

[[register.field.source]]
kind       = "decompile"
ref        = "dispatcher 0x3EC3E9BC: btest r0, 8"
confidence = "high"

[[register.field]]
name  = "SOURCE"
bits  = "5:0"
notes = "Source number minus 64; the dispatcher ORs 64 back in."

[[register.field.source]]
kind       = "decompile"
ref        = "dispatcher 0x3EC3E9BC: or r0, 64, then a 7-bit mask"
confidence = "medium"
note       = "the dispatcher keeps 7 bits after the OR, so bit 6 may belong to the field too"

[[register]]
name   = "IRQ_PRIO"
offset = 0x10
count  = 4
stride = 4
access = "rw"
notes  = "One 4-bit enable/priority field per interrupt source, eight per word: source `src` lives in word `(src >> 3) & 3` at bit `(src & 7) * 4`. Zero disables the source; a non-zero value is the vector-table slot it dispatches through."

[[register.source]]
kind       = "decompile"
ref        = "enable_irq_source(src, prio) at 0x3ED72374"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "start4 calls enable_irq_source(64, 1) for its ThreadX tick"
confidence = "high"

[[register.source]]
kind       = "inferred"
ref        = "core 1 release: the model treats a code-address write (>= 0x1000) to the first two words of bank 0 as core 1's start vector"
confidence = "low"
note       = "these words otherwise only ever hold small priority bitfields; the real release mechanism is not decoded"

[[register]]
name   = "VBASE"
offset = 0x30
access = "rw"
notes  = "Exception-vector base for this core."

[[register.source]]
kind       = "decompile"
ref        = "start4 entry trampoline: mov r1, #0x7E002030, then stores the vector base through it"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "core-control write trace: +0x30 and +0x830 both take 0xFEC01E00, nothing writes +0x38"
confidence = "high"
note       = "replaced an earlier +0x38 guess for core 1 (commit 06a8447)"

[[register]]
name   = "IRQ_PENDING_BITS"
offset = 0x40
count  = 2
stride = 4
access = "rw"
notes  = "Pending bitmask, one bit per source: word 0 covers sources 64..95, word 1 sources 96..127. Setting a bit raises that interrupt on this core in software; each ISR clears its bit on entry."

[[register.source]]
kind       = "decompile"
ref        = "0x3ED01896 raises (|= 1 << bit), 0x3ED01792 acknowledges (&= ~(1 << bit)), 0x3ED01980 reads one bit"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "the clock service re-posts its own source 66 this way; sources 78 / 79 are the inter-core reschedule IPI"
confidence = "high"

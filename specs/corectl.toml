[block]
name            = "corectl"
base            = 0x7E002000
size            = 0x1000
summary         = "VPU core control: per-core boot handshake and interrupt controller"
instances       = 2
instance_stride = 0x800
notes           = "One register bank per VPU core: core 0 at `+0x000`, core 1 at `+0x800`. start4 reaches its bank through a per-core pointer, so both cores run the same code. Each bank holds registers up to `+0x44`; `+0x3C` and everything from `+0x48` to the end of the measured window answers the block's own tag, `0x494E5445` — `\"INTE\"` big-endian — the way the GPIO block answers `0x6770696F` (`specs/gpio.toml`)."

[[block.source]]
kind       = "decompile"
ref        = "per-core init `0x3EC3E938` sets `[blk+12] = 0x7E002000 + core * 0x800`"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "`--log irqen` and the peripheral stub show core 1 writing `0x7E002810..0x7E002844`"
confidence = "high"
note       = "the window was mapped `0x100` wide until commit 7bd21a3, which hid core 1's bank"

[[block.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115 (`rpi-unboxed` start4 `2431cea8`, Linux idle), `/dev/mem`: `0xFE00203C` and every word from `0xFE002048` to `0xFE0020FF` read `0x494E5445`, and so do the same offsets in core 1's bank from `0xFE002800`. Reads one word at a time — back-to-back 32-bit reads of this window through one `mmap` alias, and the second read answers the first offset's value."
confidence = "high"

[[block.source]]
kind       = "inferred"
ref        = "size: the system timer starts at `0x7E003000`"
confidence = "medium"

[[register]]
name   = "IRQ_GATE"
offset = 0x00
access = "rw"
notes  = "Core-wide delivery gate, four bits wide. Zero delivers; a value at or above a source's priority holds it pending until the gate drops again. Zero on a running board, so nothing the model boots ever raises it."

[[register.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115 (`rpi-unboxed` start4 `2431cea8`, Linux idle), `/dev/mem` at `0xFE002000`: reads `0x0`, takes `0xf`, reads it back. With `0xf` written, a source forced through `IRQ_PENDING_BITS_SET` and enabled at priority 1 in `IRQ_PRIO` stayed undelivered for as long as the gate was up — the firmware's own handler for it did not run — and was delivered the moment the gate went back to `0x0`. Priority 7 was held the same way."
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115, `/dev/mem`: core 1's copy at `0xFE002800` takes `0xf` and reads it back while `0xFE002000` stays `0x0`, so the gate is per core."
confidence = "high"

[[register.source]]
kind       = "datasheet"
ref        = "Broadcom `bcm2708_chip/intctrl0.h`: `IC0_C`, RW, mask `0x0000000f`"
confidence = "medium"
note       = "the header gives no fields, so whether the four bits are a priority threshold or a plain block is ours, from the two priorities measured"


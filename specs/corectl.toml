[[register]]
name   = "VBASE"
offset = 0x30
access = "w"
notes  = "Exception-vector base for this core. The core takes its vector from the base as it stands when the exception comes, so every write moves the table: the bootloader's halt points it at its own table and clears it again once woken, and start4, which runs after a wake without a reset in between, writes its own. Only bits 31:9 are kept, so the table has to be 512-byte aligned -- 128 entries of four bytes, the whole table -- and a misaligned one is fetched from the address below it with no indication that anything is wrong. Write-only: a real board reads 0 here whatever the live vector base is."

[[register.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115 (`rpi-unboxed` start4 `2431cea8`, Linux idle), `/dev/mem`: `0xFE002030` reads `0x0` on both banks, yet a source forced through `IRQ_PENDING_BITS_SET` and enabled in `IRQ_PRIO` vectored into the live firmware's handler, which rewrote `IRQ_PRIO` word 0 back to its own enables. So the zero is the register not reading back, not a cleared vector base. Core 1's copy at `0xFE002830` behaves the same: written `0x3EC2A000`, reads `0x0`."
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "start4 entry trampoline: `mov r1, #0x7E002030`, then stores the vector base through it"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "core-control write trace: `+0x30` and `+0x830` both take `0xFEC01E00`, nothing writes `+0x38`"
confidence = "high"
note       = "replaced an earlier `+0x38` guess for core 1 (commit 06a8447)"


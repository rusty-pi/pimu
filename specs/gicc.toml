[block]
name    = "gicc"
bus     = "arm"
base    = 0xFF842000
size    = 0x2000
summary = "GIC-400 CPU interface, banked per CPU and per security state"
notes   = "Word access only. Linux enters at EL2 and, because this window is 8 KiB, runs split EOI: priority drop on EOIR, deactivation on DIR. The virtualisation interface (GICH / GICV at 0xFF844000..) is not modelled and faults."

[[block.source]]
kind       = "linux"
ref        = "dtb: interrupt-controller@40041000 reg <... 0x40042000 0x2000 ...> -> 0xFF842000, 8 KiB"
confidence = "high"

[[block.source]]
kind       = "standard"
ref        = "ARM IHI 0048B (GICv2), section 4.4"
confidence = "high"

[[block.source]]
kind       = "measured"
ref        = "reference board dmesg: 'GIC: Using split EOI/Deactivate mode'"
confidence = "high"


[block]
name    = "pm"
base    = 0x7E100000
size    = 0x1000
summary = "Power management: reset control, reset status, watchdog, power-domain registers"
notes   = "Writes carry the 0x5A password in the top byte, which reads back masked. The watchdog counts down at 65536 Hz from the last WDOG value once RSTC arms a full reset."

[[block.source]]
kind       = "linux"
ref        = "drivers/watchdog/bcm2835_wdt.c and drivers/pmdomain/bcm/bcm2835-power.c map this block"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "bootloader self-update reset (WDOG = PASSWORD | 10, RSTC = PASSWORD | full reset); start4 arms the dog at 0x3ED62334 / 0x3ED62342 with dtparam=watchdog=on"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "--trace-mmio of the pinned firmware (pieeprom.bin and start4.elf as firmware.sha256 lists them) booted through the ARM release; every PC cited below is in those images"
confidence = "high"

[[register]]
name   = "RSTC"
offset = 0x1C
access = "rw"
notes  = "Reset control. Arming a full reset starts the watchdog; clearing WRCFG stops it. As it starts, start4 ORs 0x3000 into it (bits 13:12, meaning unknown) just before the PLL power words, then does the same watchdog set-up as the bootcode: WRCFG cleared, bits 9:8 set to 2, bits 1:0 set to 2 (0x3202 in the trace), and RSTS cleared if HADWRF is set. It skips the set-up when the bootloader's `PWRB` tag says so."

[[register.source]]
kind       = "linux"
ref        = "bcm2835_wdt_start writes PM_PASSWORD | 0x3222 style values, bcm2835_wdt_stop writes 0x102"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "start4: `_DAT_7e10001c |= 0x5a003000` in 0x3ED55D20; watchdog set-up 0x3ED6226E: `(v & ~0x30)`, `(v & ~0x300) | 0x200`, `(v & ~3) | 2`, unless the `PWRB` tag's word at +140 is non-zero"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "start4: reads 0x202 and writes 0x5A003202 at 0x3ED55D38, then 0x5A003202 at 0x3ED6229E, 0x3ED622AC and 0x3ED622BC"
confidence = "high"

[[register.field]]
name  = "WRCFG"
bits  = "5:4"
notes = "2 = full reset when the watchdog expires."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2835_wdt.c: PM_RSTC_WRCFG_FULL_RESET = 0x20"
confidence = "high"

[[register.field]]
name  = "PASSWD"
bits  = "31:24"
notes = "Must be 0x5A for the write to count."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2835_wdt.c: PM_PASSWORD = 0x5a000000"
confidence = "high"

[[register]]
name   = "RSTS"
offset = 0x20
access = "rw"
reset  = 0x00000020
notes  = "Which reset source fired last. The bootloader also packs the partition to boot into the even bits 0..10, which the odd HADWRF bit does not disturb. start4's watchdog set-up writes the password alone (0) here when HADWRF is set."

[[register.source]]
kind       = "measured"
ref        = "the reference board's bootloader prints 'PM_RSTS 00000020' after power-on"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "start4: reads 0x20 twice at 0x3ED622BE / 0x3ED622C0, writes 0x5A000000 at 0x3ED622CC"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "partition field in the even bits (mask 0x555): FUN_00000578 / FUN_00000666 in firmware/source/pieeprom.bin.c"
confidence = "high"

[[register.field]]
name  = "HADWRF"
bits  = "5"
notes = "Last reset was a full watchdog reset: what power-on sequencing leaves."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2835_wdt.c: PM_RSTS_HADWRF_SET"
confidence = "high"

[[register]]
name   = "WDOG"
offset = 0x24
access = "rw"
notes  = "Watchdog timeout on write, ticks left on read (1 tick = 1/65536 s)."

[[register.source]]
kind       = "linux"
ref        = "bcm2835_wdt.c: PM_WDOG_TIME_SET = 0x000fffff, get_timeleft reads it back"
confidence = "high"

[[register.field]]
name  = "TIME"
bits  = "19:0"
notes = "Timeout in watchdog ticks; 0xFFFFF is 16 s."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2835_wdt.c: PM_WDOG_TIME_SET"
confidence = "high"

[[register.field]]
name  = "PASSWD"
bits  = "31:24"
notes = "Must be 0x5A."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2835_wdt.c: PM_PASSWORD"
confidence = "high"

[[register]]
name   = "PADS0"
offset = 0x28
access = "rw"
notes  = "Linux's first pad register. start4's pad writer can address it (index 2), with the same doubled drive code as PADS2 and PADS3; the pinned firmware does not write it on the Pi 4B."

[[register.source]]
kind       = "linux"

confidence = "high"

[[register.field]]
name  = "DRIVE"
bits  = "2:0"
notes = "Drive strength: 0 is 2 mA up to 7 for 16 mA, with the current halved on 4-series boards. start4's pad writer writes min(2n + 1, 7) to PADS0, PADS2 and PADS3 when the flag at gp+5476 is set, and n unchanged to PADS4 and PADS5. With n = mA / 2 - 1 of dt-blob.bin's drive_strength_mA, the Pi 4B's numbers all fit: 8 mA and 16 mA give 7 in PADS2 / PADS3, 14 mA gives 6 in PADS4, and a bank no pin names a strength for gets 1."

[[register.field.source]]
kind       = "datasheet"
ref        = "raspberrypi/documentation b01a5c1, documentation/asciidoc/computers/raspberry-pi/gpio-pad-controls.adoc: drive strength list, and 'On 4-series devices, the current level is half the value shown'"
confidence = "high"

[[register.field.source]]
kind       = "decompile"
ref        = "0x3ED55F2E..0x3ED55F44: for index 2..4, r4 = min(2 * r4 + 1, 7)"
confidence = "high"

[[register.field.source]]
kind       = "inferred"
ref        = "n = mA / 2 - 1: fitted to the trace against pins_4b (GPIO 15 at 8 mA, 40/41 at 16 mA, 46 at 14 mA)"
confidence = "medium"


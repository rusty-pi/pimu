[block]
name    = "pm"
base    = 0x7E100000
size    = 0x1000
summary = "Power management: reset control, reset status, watchdog, power-domain registers"
notes   = "Writes carry the 0x5A password in the top byte, which reads back masked. The watchdog counts down at 65536 Hz from the last WDOG value once RSTC arms a full reset."

[[block.source]]
kind       = "linux"
ref        = "drivers/watchdog/bcm2835_wdt.c and drivers/pmdomain/bcm/bcm2835-power.c map this block"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "bootloader self-update reset (WDOG = PASSWORD | 10, RSTC = PASSWORD | full reset); start4 arms the dog at 0x3ED62334 / 0x3ED62342 with dtparam=watchdog=on"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "--trace-mmio of the pinned firmware (pieeprom.bin and start4.elf as firmware.sha256 lists them) booted through the ARM release; every PC cited below is in those images"
confidence = "high"

[[register]]
name   = "RSTC"
offset = 0x1C
access = "rw"
notes  = "Reset control. Arming a full reset starts the watchdog; clearing WRCFG stops it."

[[register.source]]
kind       = "linux"
ref        = "bcm2835_wdt_start writes PM_PASSWORD | 0x3222 style values, bcm2835_wdt_stop writes 0x102"
confidence = "high"

[[register.field]]
name  = "WRCFG"
bits  = "5:4"
notes = "2 = full reset when the watchdog expires."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2835_wdt.c: PM_RSTC_WRCFG_FULL_RESET = 0x20"
confidence = "high"

[[register.field]]
name  = "PASSWD"
bits  = "31:24"
notes = "Must be 0x5A for the write to count."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2835_wdt.c: PM_PASSWORD = 0x5a000000"
confidence = "high"

[[register]]
name   = "RSTS"
offset = 0x20
access = "rw"
reset  = 0x00000020
notes  = "Which reset source fired last. The bootloader also packs the partition to boot into the even bits 0..10, which the odd HADWRF bit does not disturb."

[[register.source]]
kind       = "measured"
ref        = "the reference board's bootloader prints 'PM_RSTS 00000020' after power-on"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "partition field in the even bits (mask 0x555): FUN_00000578 / FUN_00000666 in firmware/source/pieeprom.bin.c"
confidence = "high"

[[register.field]]
name  = "HADWRF"
bits  = "5"
notes = "Last reset was a full watchdog reset: what power-on sequencing leaves."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2835_wdt.c: PM_RSTS_HADWRF_SET"
confidence = "high"

[[register]]
name   = "WDOG"
offset = 0x24
access = "rw"
notes  = "Watchdog timeout on write, ticks left on read (1 tick = 1/65536 s)."

[[register.source]]
kind       = "linux"
ref        = "bcm2835_wdt.c: PM_WDOG_TIME_SET = 0x000fffff, get_timeleft reads it back"
confidence = "high"

[[register.field]]
name  = "TIME"
bits  = "19:0"
notes = "Timeout in watchdog ticks; 0xFFFFF is 16 s."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2835_wdt.c: PM_WDOG_TIME_SET"
confidence = "high"

[[register.field]]
name  = "PASSWD"
bits  = "31:24"
notes = "Must be 0x5A."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2835_wdt.c: PM_PASSWORD"
confidence = "high"

[[register]]
name   = "PADS2"
offset = 0x2C
access = "rw"
notes  = "Pad control for GPIO bank 0 (GPIO 0-27). start4 writes 0x19 with each pin it sets up from dt-blob.bin, and ends on 0x1F. Bits 3 and 4 are set in every value it writes."

[[register.source]]
kind       = "linux"
ref        = "drivers/pmdomain/bcm/bcm2835-power.c: PM_PADS2"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "start4 0x3ED55F88, interleaved with the GPIO function and pull writes of its pin configuration"
confidence = "high"

[[register.source]]
kind       = "inferred"
ref        = "bank: PADS3 and PADS4 end on the drive dt-blob.bin gives GPIO 40/41 and GPIO 46, which leaves bank 0 here"
confidence = "medium"

[[register.field]]
name  = "DRIVE"
bits  = "2:0"
notes = "Drive strength, in 2 mA steps from 2 mA."

[[register.field.source]]
kind       = "inferred"
ref        = "the Pi 4B pin_config asks 16 mA of GPIO 40/41 (PADS3 ends on 7) and 14 mA of GPIO 46 (PADS4 ends on 6)"
confidence = "medium"

[[register.field]]
name  = "PASSWD"
bits  = "31:24"
notes = "Must be 0x5A."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2835-power.c: PM_PASSWORD"
confidence = "high"

[[register]]
name   = "PADS3"
offset = 0x30
access = "rw"
notes  = "Pad control for GPIO bank 1 (GPIO 28-45), laid out as PADS2. start4 writes 0x19 with each pin it sets up and ends on 0x1F, the 16 mA dt-blob.bin gives the audio PWM pins."

[[register.source]]
kind       = "linux"
ref        = "bcm2835-power.c: PM_PADS3"
confidence = "high"

[[register.source]]

[[register]]
name   = "PADS2"
offset = 0x2C
access = "rw"
reset  = 0x0000001B
notes  = "Pad control for GPIO 0-27. start4 applies dt-blob.bin's pin_config last pin first; for each pin it sets the function if it differs, drives an output to its startup level, writes the pull, then rewrites PADS2, PADS3 and PADS4 from the drive strengths the pins so far have named. On the Pi 4B this register stays 0x19 until GPIO 15 (8 mA) and ends on 0x1F."

[[register.source]]
kind       = "linux"
ref        = "drivers/pmdomain/bcm/bcm2835-power.c: PM_PADS2"
confidence = "high"

[[register.source]]
kind       = "datasheet"
ref        = "raspberrypi/documentation b01a5c1, documentation/asciidoc/computers/raspberry-pi/gpio-pad-controls.adoc: 0x7E10002C is the pads of GPIO 0-27; PASSWRD, SLEW, HYST, DRIVE and their reset values"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "start4 0x3ED55F88, after each pin's function (0x3ECC9548 / 0x3ECC9562), level (0x3ECC8018) and pull (0x3ECC8414) writes: GPIO 46, 45 .. 40, 39 .. 34, 15, 14; again for GPIO 30 and 31 just before the board clock set-up"

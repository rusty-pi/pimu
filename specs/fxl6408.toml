[[register]]
name   = "INPUT_STATUS"
offset = 0x0F
width  = 8
access = "r"
notes  = "Pin levels. On a 4B the bootloader watches `SD_OC_N` (pin 7) once it powers the card: 20 ms after `SD_PWR_ON`, ten reads 2 ms apart, each reading `IO_DIR`, `INPUT_STATUS` and `OUTPUT`; eight or more lows count as an over-current, and it logs `SD_OC: <lows>` before switching the card off again. In the model every other read takes 200 ms longer, so the watch spans a second."

[[register.source]]

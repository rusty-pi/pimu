[[register]]
name   = "IO_DIR"
offset = 0x03
width  = 8
access = "rw"
reset  = 0x00
notes  = "1 = output. start4 writes `0x7F`: the seven pins `pins_4b` configures as outputs, GPIO 128-134."

[[register.source]]
kind       = "datasheet"
ref        = "FXL6408: I/O Direction"
confidence = "high"

[[register]]
name   = "OUTPUT"
offset = 0x05
width  = 8
access = "rw"
reset  = 0x00
notes  = "1 = drive high. start4 writes the whole register each time, each write in a bus session of its own: `0x40` (`SD_PWR_ON`) in its set-up, then twice more, the two `pins_4b` nodes that name a startup state being GPIO 134 and 130; after ~200 ms `WL_ON` (bit 1) and after another ~200 ms `BT_ON` (bit 0); with `camera_auto_detect`, bit 5 (the camera's power) cleared, set ~5 ms later, and cleared twice after the sensor probes. Once it has the command line it clears `BT_ON` if the device tree's `bt` node is disabled, then `WL_ON` if `mmcnr` is."

[[register.source]]
kind       = "datasheet"

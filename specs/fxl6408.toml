[block]
name    = "fxl6408"
bus     = "i2c"
base    = 0x43
size    = 0x100
summary = "FXL6408 GPIO expander: the board's 'external' GPIOs 128..135"
notes   = "On the `bsc` PMIC copy. Nothing outside drives the pins, so a pin reads its own output where driven, else its pull, else 0."

[[block.source]]
kind       = "datasheet"
ref        = "onsemi FXL6408 datasheet (register map, reset values)"
confidence = "high"

[[block.source]]
kind       = "linux"
ref        = "drivers/gpio/gpio-fxl6408.c (names, FXL6408_MF_FAIRCHILD)"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "start4db gpio_expander_FXL6408.c: probe 0x0ED18984, FXL6408_readreg 0x0EC335A0; a d03115 with start_debug=1 logged no probe assert"
confidence = "high"

[[register]]
name   = "DEVICE_ID"
offset = 0x01
width  = 8
access = "rw"
reset  = 0xA0
notes  = "Device id / control. start4's probe reads it and accepts any value, then writes 1 (software reset)."

[[register.source]]
kind       = "datasheet"
ref        = "FXL6408: Device ID and Control"
confidence = "high"

[[register.field]]
name   = "SW_RESET"
bits   = "0"
access = "w"
notes  = "Software reset."

[[register.field.source]]
kind       = "datasheet"
ref        = "FXL6408: Device ID and Control, bit 0"
confidence = "high"

[[register.field]]
name   = "MF"
bits   = "7:5"
access = "r"
notes  = "Manufacturer: 0b101."

[[register.field.source]]
kind       = "linux"
ref        = "gpio-fxl6408.c: FXL6408_MF_FAIRCHILD"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "pinned start4, once its board clock set-up is done: DEVICE_ID read, then DEVICE_ID <- 1 in one session; INT_MASK 0xFF, PULL_ENABLE 0, PULL_UP 0, INPUT_DEFAULT 0x84, OUTPUT 0x40, IO_DIR 0x7F, OUTPUT_HIGH_Z 0 in the next (write helper 0x3ECF141E); the same with dtoverlay=disable-bt or disable-wifi removed, except for the OUTPUT write at the end"
confidence = "high"

[[register]]
name   = "IO_DIR"
offset = 0x03
width  = 8
access = "rw"
reset  = 0x00
notes  = "1 = output. start4 writes 0x7F: the seven pins pins_4b configures as outputs, GPIO 128-134."

[[register.source]]
kind       = "datasheet"
ref        = "FXL6408: I/O Direction"
confidence = "high"

[[register]]
name   = "OUTPUT"
offset = 0x05
width  = 8
access = "rw"
reset  = 0x00
notes  = "1 = drive high. start4 writes the whole register each time, each write in a bus session of its own: 0x40 (SD_PWR_ON) in its set-up, then twice more, the two pins_4b nodes that name a startup state being GPIO 134 and 130; after ~200 ms WL_ON (bit 1) and after another ~200 ms BT_ON (bit 0); bit 5 (the camera's power) around its camera detection. Once it has the command line it clears BT_ON if the device tree's bt node is disabled, then WL_ON if mmcnr is."

[[register.source]]
kind       = "datasheet"
ref        = "FXL6408: Output State"
confidence = "high"

[[register]]
name   = "OUTPUT_HIGH_Z"
offset = 0x07
width  = 8
access = "rw"
reset  = 0xFF
notes  = "1 = output high-Z."

[[register.source]]
kind       = "datasheet"
ref        = "FXL6408: Output High-Z"
confidence = "high"

[[register]]
name   = "INPUT_DEFAULT"
offset = 0x09
width  = 8
access = "rw"
reset  = 0x00
notes  = "Default input state for interrupts. start4 writes 0x84: bit 2 is PWR_LED_OFF, the one active-low pin in pins_4b, and bit 7 is SD_OC_N, which pin_config does not list."

[[register.source]]
kind       = "datasheet"
ref        = "FXL6408: Input Default State"
confidence = "high"

[[register]]
name   = "PULL_ENABLE"
offset = 0x0B
width  = 8
access = "rw"
reset  = 0xFF
notes  = "1 = pull resistor on. start4 writes 0, since every expander pin in pins_4b is no_pulling; the bootloader had enabled one on SD_OC_N (0x80)."

[[register.source]]
kind       = "datasheet"
ref        = "FXL6408: Pull Enable"
confidence = "high"

[[register]]
name   = "PULL_UP"
offset = 0x0D
width  = 8
access = "rw"
reset  = 0x00
notes  = "1 = pull-up, 0 = pull-down. start4 writes 0."

[[register.source]]
kind       = "datasheet"
ref        = "FXL6408: Pull-Down / Pull-Up"
confidence = "high"

[[register]]
name   = "INPUT_STATUS"
offset = 0x0F
width  = 8
access = "r"
notes  = "Pin levels."

[[register.source]]
kind       = "datasheet"
ref        = "FXL6408: Input Status"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "gpio_expander_FXL6408_get_level_internal reads 0x0F"
confidence = "high"

[[register]]
name   = "INT_MASK"
offset = 0x11
width  = 8
access = "rw"
reset  = 0x00
notes  = "Interrupt mask. start4 writes 0xFF first in its set-up."

[[register.source]]
kind       = "datasheet"
ref        = "FXL6408: Interrupt Mask"
confidence = "high"

[[register]]
name   = "INT_STATUS"
offset = 0x13
width  = 8
access = "r"
notes  = "Interrupt status; no pin changes by itself, so always 0."

[[register.source]]
kind       = "datasheet"
ref        = "FXL6408: Interrupt Status"
confidence = "high"

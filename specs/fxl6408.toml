[block]
name    = "fxl6408"
bus     = "i2c"
base    = 0x43
size    = 0x100
summary = "FXL6408 GPIO expander: the board's 'external' GPIOs 128..135"
notes   = "On the `bsc` PMIC copy. Nothing outside drives the pins, so a pin reads its own output where driven, else its pull, else 0. On a Raspberry Pi 4B d03115 the board pulls `SD_PWR_ON` (pin 6) up harder than the part's own pull-down: after a software reset, with every pin an input and every pull a pull-down, `INPUT_STATUS` reads `0x40`, so the card is powered while the pin is not driven. The part is off the SoC, so a watchdog reset of the SoC does not reset it. The pinned start4 does not touch it when Linux sends `NOTIFY_REBOOT`, so a card Linux powered off on its way down (`SET_GPIO_STATE` 134 <- 0, `OUTPUT` written without bit 6) stays off through the reset. The bootloader stage after the bootcode starts by resetting the part the way the bootcode does (`DEVICE_ID` <- 1, `OUTPUT` `0x40`, `IO_DIR` `0x7F`, `PULL_ENABLE` and `PULL_UP` `0x80`, `OUTPUT_HIGH_Z` 0). It then takes the card's power away (`OUTPUT` 0) and sets `IO_DIR` to `0x7B`, each as a read of `IO_DIR`, `OUTPUT` and `OUTPUT_HIGH_Z` written back changed. The power comes back once its PCIe bring-up is done. It then reads `IO_DIR`, `INPUT_STATUS` and `OUTPUT` every 200 ms for about 1.2 s before it prints `SD_OC: 0`. After that it takes the power away and gives it back 1 ms later, and writes `OUTPUT` `0x40` once more just before its SD host comes up."

[[block.source]]

[block]
name    = "genet"
base    = 0x7D580000
size    = 0x10000
summary = "GENET v5 Ethernet MAC with its UniMAC MDIO controller (the PHY is `bcm54213pe`)"
notes   = "GENET v4/v5 layout. Each DMA direction has 256 three-word descriptors and 17 ring register blocks `0x40` apart; ring 16 is the default ring. Reset values below are the measured values of registers no client writes on the reference board's boot path."

[[block.source]]
kind       = "linux"
ref        = "`/scb/ethernet@7d580000`, `reg = <0x7d580000 0x10000>`; `drivers/net/ethernet/broadcom/genet/bcmgenet.h`, `drivers/net/mdio/mdio-bcm-unimac.c`"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "EEPROM bootloader network boot (disassembled LZ4 BOOTLOADER stage); start4 MDIO `FUN_0ecc3198` / `FUN_0ecc3280`, UMAC start `FUN_0ecc3b6c`, ring 16 setup `FUN_0ecc2d54` / `FUN_0ecc2e4c`"
confidence = "high"

[[block.source]]
kind       = "measured"

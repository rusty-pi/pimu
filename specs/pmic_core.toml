[block]
name    = "pmic_core"
bus     = "i2c"
base    = 0x1E
size    = 0x100
summary = "Board PMIC owning the SoC core rail (start4 descriptor type `0x82`)"
notes   = "On the `bsc` PMIC copy. The AVS monitor's channel 3 follows this part's setpoint. start4's init sweeps `0x01..0x15`, `0x20..0x27` and `0x48..0x4B` once to log it. Registers not listed read 0. start4's driver keeps the last voltage asked for and the last setpoint written, writes `SETPOINT_CORE` only when the setpoint changes, and then polls `STATUS` until `SETTLED`."

[[block.source]]
kind       = "decompile"
ref        = "`pmic_add` `0x3ED4D85C`; descriptor `0x3EDE9658`: type `0x82`, addr `0x1E`, 0.3..1.9 V"
confidence = "high"

[[register]]
name   = "STATUS"
offset = 0x02
width  = 8
access = "r"
notes  = "Status."

[[register.source]]
kind       = "decompile"
ref        = "settle callback `0x3EC8C9FC`"
confidence = "high"

[[register.field]]
name  = "SETTLED"
bits  = "3"
notes = "Voltage change complete."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x3EC8C9FC` polls reg `0x02` bit 3"
confidence = "high"

[[register]]
name   = "MODE"
offset = 0x24
width  = 8
access = "rw"
notes  = "Written 5 while the ARM is set to run faster than start4's PMIC turbo threshold (600 MHz), 15 otherwise, and only when that changes. On a Pi 4 at 1800 MHz start4 writes 5 once, right before it raises `SETPOINT_CORE` for the ARM clock. What the part does with it is not known."

[[register.source]]
kind       = "decompile"
ref        = "descriptor `0x3EDE9658` callback `+0x1C` (`0x3EC8C97C`): `r3 = arg ? 5 : 15`, written to reg 36 if it differs from the byte cached at `gp+6916`; called from the DVFS clock change `FUN_0ed71e8c` when clock 3's new rate exceeds `[gp+0xccd84]` MHz"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "`0x1E` W `0x24 = 0x05`, then W `0x25 = 0x68` and a `STATUS` read, before PLLB goes to 3600 MHz"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "the pinned firmware on `--board-rev d03115` without `arm_boost`: `0x1E` W `0x24 = 0x05` and no `0x25` write before PLLB goes to 3000 MHz"
confidence = "high"

[[register]]
name   = "SETPOINT_CORE"
offset = 0x25
width  = 8
access = "rw"
reset  = 85
notes  = "Core-rail setpoint, 10 mV per step. start4 encodes a voltage as `ceil(uV / 10000)`, after holding it to 0.835..1.1 V on a Pi 4. The boot writes `0x58` (880 mV) right after the log sweep, then its AVS calibration moves it (`0x67`, `0x62`, `0x67`, `0x62` in the model, ending at `0x61`), and before the ARM clock goes to 1800 MHz it writes 880 mV + the calibration's gain + 3.3 mV per percent above 1500 MHz: `0x68` in the model. For a 1500 MHz ARM that sum is the setpoint already written, so nothing is written; `MODE` still gets 5."

[[register.source]]
kind       = "decompile"
ref        = "rail table image `0x3EE1360C`; decode callback `0x3EC8C9F6`: `raw * 10000 uV`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "encode callback `0x3ED20B96`: `(uV + 9999) / 10000`; `pmic_set_voltage` `0x3ED4DC3C` skips the write when the uV or the encoded byte is unchanged; the rail-1 wrapper `0x3ED56116` clamps to `FUN_0ed49ab0() * 1000` (835 mV) .. `FUN_0ed49946() * 1000` (1100 mV)"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "`FUN_0ed49b80` for clock 3: `FUN_0ed493a6(over_voltage) + [gp+0xccd30] + FUN_0ed4ac14`, the last `(rate / 1500 MHz - 1) * 330000 uV` with `dvfs` 3 or 4; `[gp+0xccd30]` is the setpoint read back after the calibration, minus 880000, plus 10000 per bit set in OTP row 44"
confidence = "high"

[[register.source]]
kind       = "inferred"
ref        = "reset 85 (0.85 V): no power-on ground truth; the reference board's 0.926 V is a live DVFS point, not a multiple of the step. 85 is inside the descriptor range and the band the boot writes"
confidence = "low"

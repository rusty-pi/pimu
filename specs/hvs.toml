[block]
name    = "hvs"
base    = 0x7E400000
size    = 0x1000
summary = "HVS (Hardware Video Scaler): identification, the per-channel frame-swap words, and end of frame"
notes   = "No display is modelled. Scanout catches up with a queued frame immediately, and a running channel raises its `DISPSTAT` frame flags once per 640x480@60 frame time (16683 µs) and, with their interrupts enabled, VPU interrupt source 97. Everything else is stored and read back."

[[block.source]]
kind       = "decompile"
ref        = "bootloader diagnostic-display channel-swap wait `0x0008adc0`; start4 display bring-up `0x3EC945CC`"
confidence = "high"

[[block.source]]
kind       = "linux"
ref        = "`arch/arm/boot/dts/broadcom/bcm2711.dtsi`: `hvs@7e400000` `interrupts = <GIC_SPI 97>`; start4 registers its HVS handler `0x3ECEED5C` on VPU source 97 (`--log irqtbl`)"
confidence = "high"

[block.irq]
vpu     = 97
gic_spi = 97
notes   = "A channel with `DISPEIRQx` and the flag enabled drives the line once per frame. The two controllers carry the same number because both are `64 + VC peripheral IRQ`: for every VC peripheral IRQ `n` the VPU source and the device tree's `GIC_SPI` number are both `64 + n` (the GIC id is 32 above that again), and the HVS is IRQ 33."

[[block.irq.source]]
kind       = "linux"
ref        = "`arch/arm/boot/dts/broadcom/bcm2711.dtsi`: `hvs@7e400000`, `interrupts = <GIC_SPI 97 IRQ_TYPE_LEVEL_HIGH>`"
confidence = "high"

[[block.irq.source]]
kind       = "trace"
ref        = "start4 registers its HVS handler `0x3ECEED5C` on VPU source 97 (`--log irqtbl`)"
confidence = "high"

[[block.irq.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §6.2.4 Table 102: VC peripheral IRQ 33 is `HVS`, source 97; §6.3 Figure 7 lands the same 64 IRQs on GIC SPI ids 96 to 159"
confidence = "high"


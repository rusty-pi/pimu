[[register]]
name   = "DISPSTAT"
offset = 0x04
access = "w1c"
notes  = "Only the frame flags are modelled: a running channel raises `EOLN` half-way through each frame, `EOF` after its last active line and `VSTART` as the next frame starts. `IRQDISPx` reads as set while one of channel x's flags is set with its enable; start4's handler writes back what it read less those bits. On this HVS (start4's flag `gp+0x1564 = 1`) the handler posts a channel's display events on `VSTART`."

[[register.source]]
kind       = "linux"
ref        = "`drivers/gpu/drm/vc4/vc4_regs.h`: `SCALER_DISPSTAT`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "the source-97 handler `0x3ECEED5C` reads `[0x7E400004]` and writes the value back `& ~0xE`; with `gp+0x1564` set it posts channel x's display event on bit `14 + 8x` (`0x3ECEEFCE`), without it it does the channel's display-list work on bit `12 + 8x` when bit `8 + 8x` is clear (`0x3ECEF014`)"
confidence = "high"


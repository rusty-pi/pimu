[block]
name    = "bsc"
base    = 0x7E205000
size    = 0x20
summary = "BSC (I²C master): instance 0 with nothing attached, and the instance the board PMICs and GPIO expander sit on"
notes   = "A transfer takes its time on the wire at `core_clock / DIV`, 500 MHz core clock: `TA` stays set until the bytes have gone, then `DONE` (and `ERR` on an unacknowledged address) latch. Instance 0 is on GPIO 0/1, 28/29 or 44/45 (`specs/gpio.toml`), and only the first pair is the 40-pin header: a HAT's ID EEPROM answers while the pins are there and not otherwise. The `0x7E205E00` instance has pins of its own and is not muxed."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, BSC chapter"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "start4's I²C driver `FUN_0ecf0ed0` picks the base from the bus id: 0 -> `0x7E205000`, 8 -> `0x7E205E00`, else `0x7E803000 + id * 0x1000`"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "late in the boot start4 probes `0x52` on instance 0 for a HAT EEPROM; unmapped, `S` read 0 and the poll never ended"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "pinned start4 on instance 0, each probe in a session of its own at `DIV` `0x1388` with I2C0 muxed to GPIO 44/45 (ALT1) and released after: `camera_auto_detect` reads `0x10` reg `0x0000`, `0x36` reg `0x300A`, `0x1A` reg `0x0016`, 32 bytes from `0x40`, `0x1A` reg `0x303E`, `0x1A` reg `0x0016` and `0x1A` reg `0x3254` (twice each); after each `DISPLAY_DSI_PORT not defined` it reads `0x45` reg `0x80`, then reg `0x01`, whether or not `display_auto_detect` is set; later, unless `force_eeprom_read=0`, `0x50-0x53` in a session each on GPIO 0/1 (ALT0), up to ten queued reads of 4 bytes from reg `0x0000` per address"
confidence = "high"
note       = "checked by booting with `camera_auto_detect` and `display_auto_detect` removed from `config.txt` in turn, and with `force_eeprom_read=0` added"


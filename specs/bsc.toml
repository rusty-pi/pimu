[block]
name    = "bsc"
base    = 0x7E205000
size    = 0x20
summary = "BSC (I²C master): instance 0 with nothing attached, and the instance the board PMICs and GPIO expander sit on"
notes   = "A transfer takes its time on the wire at core_clock / DIV, 500 MHz core clock: TA stays set until the bytes have gone, then DONE (and ERR on an unacknowledged address) latch."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, BSC chapter"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "start4's I²C driver FUN_0ecf0ed0 picks the base from the bus id: 0 -> 0x7E205000, 8 -> 0x7E205E00, else 0x7E803000 + id * 0x1000"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "late in the boot start4 probes 0x52 on instance 0 for a HAT EEPROM; unmapped, S read 0 and the poll never ended"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "pinned start4 on instance 0, each probe in a session of its own at DIV 0x1388 with I2C0 muxed to GPIO 44/45 (ALT1) and released after: camera_auto_detect reads 0x10 reg 0x0000, 0x36 reg 0x300A, 0x1A reg 0x0016, 32 bytes from 0x40, 0x1A reg 0x303E, 0x1A reg 0x0016 and 0x1A reg 0x3254 (twice each); after each 'DISPLAY_DSI_PORT not defined' it reads 0x45 reg 0x80, then reg 0x01, whether or not display_auto_detect is set; later 0x50-0x53 ten times each on GPIO 0/1 (ALT0)"
confidence = "high"
note       = "checked by booting with camera_auto_detect and display_auto_detect removed from config.txt in turn"

[[block.copy]]
name  = "PMIC"
base  = 0x7E205E00
notes = "Bus 8: the PMICs at 0x1B / 0x1E and the FXL6408 at 0x43."

[[block.copy.source]]
kind       = "decompile"
ref        = "FUN_0ecf0ed0: bus id 8; pmic_init 0x3ED4DAA8 uses it"
confidence = "high"

[[register]]
name   = "C"
offset = 0x00
access = "rw"
notes  = "Control. start4 reads a register in one of two ways. Either it sets ST for the write, then sets DLEN and ST | READ for the read before it puts the register bytes in the FIFO, so the read follows as a repeated start (sensor probes, the expander's id). Or it writes the register, waits for DONE, then starts the read (the display probe). Every read ends with C written back as read, S cleared, the FIFO cleared twice and C <- 0."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, BSC: C"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "pinned start4: queued read at 0x3ECF0FD8 / 0x3ECF1150 with the FIFO writes at 0x3ECF115A after it; write-then-read at 0x3ECF0FD8, FIFO at 0x3ECF1046, then 0x3ECF1100; the common end at 0x3ECF2F92, 0x3ECF2FFC, 0x3ECF1826 / 0x3ECF185A, 0x3ECF3028"
confidence = "high"


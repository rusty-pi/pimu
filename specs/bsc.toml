[block.irq]
vpu     = 117
gic_spi = 117
notes   = "One line for every I²C master on the chip; `PACTL_CS` bits 8 to 15 say which of them is pending. A master holds its share of it up while `DONE` is set under `C.INTD`, `TXW` under `C.INTT` or `RXR` under `C.INTR`, so a handler lowers it by clearing the status or the enable; masking source 117 in the VPU's `IRQ_PRIO` stops the delivery and leaves the line up (`specs/corectl.toml` `IRQ_RAW`). The pinned start4 never sets an enable and polls `S.DONE`; Linux's `i2c-bcm2835` takes the line on the ARM side, so a VPU that enables the source also sees the ARM's masters' transfers."

[[block.irq.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §6.2.4 Table 102: VC peripheral IRQ 53 is the OR of all I²C masters, VPU source 117; §6.2.4 Figure 6 puts I2C0 on `PACTL_CS` bit 8"
confidence = "high"

[[block.irq.source]]
kind       = "linux"
ref        = "`firmware/bcm2711-rpi-4-b.dtb`: `/soc/i2c@7e205000`, the masters at `0x7e205600`..`0x7e205c00` and `/soc/i2c@7e804000` all carry `interrupts = <0x0 0x75 0x4>`"
confidence = "high"

[[block.irq.source]]
kind       = "linux"
ref        = "`drivers/i2c/busses/i2c-bcm2835.c` (`e308a27c`): `bcm2835_i2c_start_transfer` sets `C_INTR` for a read, `C_INTT` for a write and `C_INTD` on the last message; `bcm2835_i2c_isr` completes on `S_ERR` / `S_CLKT` or `S_DONE`, fills the FIFO on `S_TXW` and drains it on `S_RXR`, and ends a transfer by writing `C <- C_CLEAR` and clearing `S`"
confidence = "high"

[[block.irq.source]]
kind       = "inferred"
ref        = "VPU source `64 + n` for VC peripheral IRQ `n` holds for the system timer's compares (64, 66) and the ARM's mailbox (94) on a Raspberry Pi 4B d03115 (`specs/corectl.toml` `IRQ_PRIO`, `IRQ_RAW`); nothing has yet read `IRQ_RAW` bit 21 of word 1 with a BSC's `DONE` set under `INTD`"
confidence = "medium"
note       = "the `0x7E205E00` master is in no device tree, so that it shares line 53 with the others rests on the datasheet's \"all I²C masters\" alone"

[[register]]
name   = "C"
offset = 0x00
access = "rw"
notes  = "Control. start4 reads a register in one of two ways. Either it sets `ST` for the write, then sets `DLEN` and `ST | READ` for the read before it puts the register bytes in the FIFO, so the read follows as a repeated start (sensor probes, the expander's id). Or it writes the register, waits for `DONE`, then starts the read (the display probe). Every read ends with `C` written back as read, `S` cleared, the FIFO cleared twice and `C` <- 0."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §3.2 (BSC): `C`"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "4B rev 1.5: with pi4-firmware's own queued-read order every PMIC register answered with its own number, and only writing the register out and waiting for `DONE` before arming the read read it (0x1B reg 0x09 -> 40, which `vcgencmd measure_volts sdram_c` confirms as 1.1 V). What stock does and pi4-firmware did not is poll `S.STATE` between the two — see that field."
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "pinned start4: queued read at `0x3ECF0FD8` / `0x3ECF1150` with the FIFO writes at `0x3ECF115A` after it; write-then-read at `0x3ECF0FD8`, FIFO at `0x3ECF1046`, then `0x3ECF1100`; the common end at `0x3ECF2F92`, `0x3ECF2FFC`, `0x3ECF1826` / `0x3ECF185A`, `0x3ECF3028`"
confidence = "high"


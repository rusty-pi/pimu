[block]
name    = "bsc"
base    = 0x7E205000
size    = 0x20
summary = "BSC (I²C master): instance 0 with nothing attached, and the instance the board PMICs and GPIO expander sit on"
notes   = "A transfer takes its time on the wire at core_clock / DIV, 500 MHz core clock: TA stays set until the bytes have gone, then DONE (and ERR on an unacknowledged address) latch."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, BSC chapter"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "start4's I²C driver FUN_0ecf0ed0 picks the base from the bus id: 0 -> 0x7E205000, 8 -> 0x7E205E00, else 0x7E803000 + id * 0x1000"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "late in the boot start4 probes 0x52 on instance 0 for a HAT EEPROM; unmapped, S read 0 and the poll never ended"
confidence = "high"

[[block.copy]]
name  = "PMIC"
base  = 0x7E205E00
notes = "Bus 8: the PMICs at 0x1B / 0x1E and the FXL6408 at 0x43."

[[block.copy.source]]
kind       = "decompile"
ref        = "FUN_0ecf0ed0: bus id 8; pmic_init 0x3ED4DAA8 uses it"
confidence = "high"


[[register.source]]
kind       = "decompile"
ref        = "`0x3ED85E9C` polls `TXFF` before each byte; the clock-change callback `0x3EC799BC` drains `BUSY`"
confidence = "high"

[[register.field]]
name  = "BUSY"
bits  = "3"
notes = """Transmitting. Set for one read after a write to `DR`, so code that \
drains `BUSY` before it clears `UARTCR` sees it go by. On a 4B rev 1.5, taking \
`UARTEN` away with a character still on the wire wedges the transmitter for the \
rest of the boot -- `FR` reads `0x39` (`CTS|BUSY|RXFE|TXFF`, `TXFE` clear) and \
re-initialising the port does not recover it. Modelled behind \
`PIMU_UART_STRICT_DISABLE=1`, because the stock `start4.elf` clears `UARTCR` \
that way during its baud-rate change and still boots a board, so the silicon \
rule has a further condition that is not pinned down yet."""

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §11.5 (UART): `FR`"
confidence = "high"

[[register.field.source]]
kind       = "measured"
ref        = "rpi-dev 4B rev 1.5: `FR 0x39` read out over DHCP option 97 before a byte was written; fixed in rpi-unboxed `f7b58e5` by draining `BUSY` first"
confidence = "high"


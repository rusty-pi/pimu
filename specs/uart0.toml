[block]
name    = "uart0"
base    = 0x7E201000
size    = 0x1000
summary = "PL011 UART0: the firmware's debug console and Linux's ttyAMA0"
notes   = "Transmit completes instantly in the model; receive is paced at the programmed baud rate against the modelled clock."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, UART chapter (ARM PL011)"
confidence = "high"

[[block.source]]
kind       = "linux"
ref        = "dtb start4 hands to Linux: serial@7e201000, arm,pl011, GIC SPI 121"
confidence = "high"

[[block.source]]
kind       = "inferred"
ref        = "size: one 4 KiB page, the granularity of this window"
confidence = "medium"


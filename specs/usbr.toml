[block]
name    = "usbr"
base    = 0x7E808000
size    = 0x100
summary = "USB reset block at `0x7E80_8000`: the power request and acknowledge start4 waits on before it resets the DWC2 USB controller"
notes   = "The block names itself `USBR` in every reserved word of its window, so the name is an identification and not a label. BCM2835 has its HDMI `HD` block at this address, but the BCM2711 does not: its HDMI `hd` range is `0x7EF20000`, which this board's device tree confirms and which answers a different tag. Registers run `+0x00` to `+0x20`; `+0x24` upwards is the tag. Only the USB power handshake is modelled. start4's HDMI driver also owns words of this window -- it writes `+0x2C` and read-modify-writes bit 30 of `+0x38`, both past the last readable register. A tag on read means the word is not readable, not that it is unimplemented: `GPSET` answers the GPIO block's tag and its writes drive pins all the same. So both are write-only registers of this block as far as anything here can tell, and the model answers the tag on a read of either. Nothing start4 does with them runs in any boot: both sit behind an HDMI mode set, which needs a display bring-up no scenario reaches (#142)."

[[block.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115, `/dev/mem` at `0xFE808000`, one 32-bit word at a time with each offset read after two different preceding offsets so a stale read would show: every word from `+0x24` to `+0xFC` answers `0x55534252` -- `\"USBR\"` big-endian -- the way `corectl` answers `INTE` and `mcsync` answers `MULT`. No offset in the window is undecoded."
confidence = "high"

[[block.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115: the same sweep of `0xFEF20000`, which this board's device tree gives as the HDMI `hd` range (`hdmi@7ef00700`, `reg-names` `hdmi dvp phy rm packet metadata csc cec hd intr2`), answers the tag `0x64767064` (`\"dvpd\"`) and holds `0x01010101` at two offsets -- the reset value the BCM2835 database gives for `HD_MAI_THR`. So the HDMI block is there, not here. Nothing in `/proc/iomem` claims `fe808000`."
confidence = "high"

[[block.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115, the nine registers `+0x00`..`+0x20` with Linux idle: `0x404A1023 0x0000090A 0x00000003 0 0 0 0x0008E38E 0 0`. After `vcmailbox 0x00028001 8 8 3 3` (USB on) only two move -- `+0x08` to `0x00000007` and `+0x20` to `0x00000003` -- and `vcmailbox ... 3 2` (USB off) moves nothing back, so both stick for the rest of the boot."
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "`SET_POWER_STATE` USB handler `0x3ED89520` (BCM2711 branch at `0x3ED8955E`); the same request at `0x3EC607B0` and `0x3ECACB0C`"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "start4's HDMI driver reaches into this window at six offsets, all with the base `0x7E808000` or `0x7E808040` built into the instruction: `+0x0C` (`0x3ECE7952`, read-modify-write), `+0x14` (`0x3ECEAFA2`, `0x3ECEC260`, `0x3ED4BB30`), `+0x2C` (`0x3ECE9886`), `+0x38` (`0x3ECE36D8`, `0x3ECE7716`, `0x3ECE8B46`, `0x3ECE9A02`, `0x3ECE9C84`, `0x3ECE9DEC`), `+0x40` (`0x3ECE9B62`, `0x3ECE9B8C`) and `+0x68` (`0x3ECE5CC0`). The functions holding them are entries of the HDMI driver's operation table at `0xEDF842C`, which `.drivers` lists at `0xEE01890`, so they are this chip's driver and not a retained BCM2835 variant -- the pointer-indirect twin of each (`+0x108`, `+0x10C`) lives in a second table that nothing references."
confidence = "medium"
note       = "Which of these words is a register of this block and which is an address the shared HDMI code carries from an older chip is not settled; none of the accesses runs in a boot."

[[register]]
name   = "CTRL"
offset = 0x08
access = "rw"
reset  = 0x3
notes  = "start4 sets `POWER` before it resets the DWC2 core. Nothing clears it again, not even the USB power-off path."

[[register.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115 (start4 f5e89631, Linux idle), 32-bit `/dev/mem` read of `0xFE808008`: `0x3` before any USB power request, `0x7` after `vcmailbox` `SET_POWER_STATE(USB, on|wait)`, still `0x7` after `SET_POWER_STATE(USB, off|wait)`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "`0x3ED89564`, `0x3EC607B6` and `0x3ECACB14` set bit 2; `0x3ECACB1A..0x3ECACB28` then clear bits 0 and 1"
confidence = "high"

[[register.field]]
name  = "POWER"
bits  = "2"
notes = "Power request for the USB controller. `STATUS.ACK` follows it."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x3ED89564..0x3ED8956E`: `[+0x08] |= 4`, spin until `[+0x20] & 3 == 3`, then reset the DWC2 core at `0x7E980000`"
confidence = "medium"
note       = "The name is ours, from what the firmware does next."

[[register]]
name   = "STATUS"
offset = 0x20
access = "r"
notes  = "Both `ACK` bits read 1 while `CTRL.POWER` is set and 0 while it is clear. The model sets them as soon as `POWER` is written."

[[register.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115, 32-bit `/dev/mem` read of `0xFE808020`: `0x0` while `CTRL` read `0x3`, `0x3` while `CTRL` read `0x7` (the same three points as `CTRL`)"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "`0x3ED8956A` and `0x3EC607BC` spin until `[+0x20] & 3 == 3` after setting `CTRL.POWER`, with no timeout; `0x3ECACB2A` spins until bit 0 is set"
confidence = "high"

[[register.field]]
name   = "ACK"
bits   = "1:0"
notes  = "Power acknowledge."

[[register.field.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115: 0 without `CTRL.POWER`, 3 with it"
confidence = "high"

[[register]]
name   = "HDMI_SM_DIV"
offset = 0x2C
access = "w"
reset  = 0x55534252
notes  = "start4's HDMI driver writes a divider derived from the HDMI state-machine clock: `<divider> << 8 | <mask>`, where the divider is the clock ratio rounded to a shift of at least 24 and the mask is the low bits that shift leaves. A read answers `0x55534252` -- `\"USBR\"`, the block's own tag -- which is what the `reset` here records. Plain storage in the model: the write has no read side and no observed effect, and no boot reaches it."

[[register.source]]
kind       = "decompile"
ref        = "`0x3ECE9886` (`st r0,(r3+0x2c)` with `r3 = 0x7E808000`) in the state-machine-clock writer, and its pointer-indirect twin `FUN_0ECE98CC`, which stores through `*(param_1 + 0x108)`. The only caller is `FUN_0ECEAE00`, which logs `HDMI: Setting state machine clock to %d Hz`, and its two callers are `0x3ECE7908` (the default bring-up, 100 MHz, with a 25.2 MHz pixel clock beside it) and `0x3ECE9918` `set_mode_request` (`max(config, 163682864)` Hz) -- both entries of the HDMI operation table at `0xEDF842C`, reached only through a mode set."
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115, in the `/dev/mem` sweep of the window: `0xFE80802C` answers `0x55534252` like every other word from `+0x24` up, with Linux up and a boot that never set a mode"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "`RVF_TRACE_ON_PC=0x3ECEAE00 RVF_TRACE_CF=1` on a `boot --display` run with the full framebuffer request never arms, and no golden transcript under `testdata/boot/golden/` holds the `HDMI: Setting state machine clock` line; neither does the firmware message ring of a Raspberry Pi 4B d03115 booted headless on stock start4 `f5e89631`"
confidence = "high"

[[register]]
name   = "HDMI_CTL"
offset = 0x38
access = "w"
reset  = 0x55534252
notes  = "start4's HDMI driver read-modify-writes bit 30 here around a mode set -- set on the way in, cleared on the way out -- and `set_mode_request` clears the whole word first. What bit 30 does is unknown. A read answers the block's tag, so a real board's read-modify-write puts the tag's bits back with it, the way the EEPROM bootloader's `GPSET` read does. Plain storage in the model, and no boot reaches it."

[[register.source]]
kind       = "decompile"
ref        = "`0x3ECE7716` sets bit 30 (`ld r0,(r2+0x38); bitset r0,0x1e; st r0,(r2+0x38)` with `r2 = 0x7E808000`) and `0x3ECE36D8` clears it; `0x3ECE8B46`, `0x3ECE9C84` and `0x3ECE9DEC` do the same from other operations, and `0x3ECE9A02` in `set_mode_request` stores 0 over the word. Each has a pointer-indirect twin that goes through `*(param_1 + 0x10C)`."
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115, in the same `/dev/mem` sweep: `0xFE808038` answers `0x55534252`"
confidence = "high"

[[register]]
name   = "PRESENT_STATE"
offset = 0x24
access = "r"
reset  = 0x1FFF0000
notes  = "`STATUS`. Idle: card inserted and stable, CMD and DAT[7:0] high, with or without a card in the slot. After a command times out the real host keeps `CMD_INHIBIT` (bit 0) set until a command-line reset, so the bootcode's failure message says `status 1fff0001`; the model lets it go at once and says `1fff0000`."

[[register.source]]
kind       = "standard"
ref        = "SDHCI 3.00, 2.2.9"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "raspberrypi/rpi-eeprom#227, bootloader 2020-09-03, no card: `status: 0x1fff0000` on every `SD HOST:` line, then `Failed to open device: 'sdcard' (cmd 371a0010 status 1fff0001)`"
confidence = "high"

[[register]]
name   = "HOST_CONTROL"
offset = 0x28
access = "rw"
notes  = "`CONTROL0`: host control 1, power, block-gap and wakeup control. Reads back what was written: unlike EMMC2's, no bit reads 1 regardless."

[[register.source]]
kind       = "standard"
ref        = "SDHCI 3.00, 2.2.10..2.2.13"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "raspberrypi/rpi-eeprom#139, #227, #282: the 2020 bootloaders print `CTL0: 0x00000000` after the reset and `CTL0: 0x00000f00` once bus power and voltage are set, where EMMC2 reads `0x00800f00`"
confidence = "high"

[[register]]
name   = "CLOCK_CONTROL"
offset = 0x2C
access = "rw"
notes  = "`CONTROL1`: clock control (15:0), data timeout (19:16) and the self-clearing software resets (26:24). 2020-era bootcode waits here twice: for its software reset to clear, and for the internal clock to report stable once enabled. On the catch-all stub neither happened, and that boot hung before its first line of output (#64)."

[[register.source]]
kind       = "standard"
ref        = "SDHCI 3.00, 2.2.14..2.2.16"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "pieeprom-2020-09-03 bootcode: `0x80000ed6` `ld r0, [r3+0x2c]; and r0, r8; beq done`, polled for 100 ms of the system timer after writing `SRST` `0x07000000`; `0x80000a40` `ld r0, [r5+0x2c]; btest r0, #1; beq back` after writing `0x000ee201`, with no timeout"
confidence = "high"


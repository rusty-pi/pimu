[block]
name    = "gich"
bus     = "arm"
base    = 0xFF844000
size    = 0x2000
summary = "GIC-400 virtual interface control, banked per CPU"
notes   = "Word access only. `+0x0000` is the accessing CPU's own block; `+0x1000 + 0x200 × n` is CPU n's, for a hypervisor that manages another core's list registers (address bits [11:9] pick the CPU, and the four past this GIC's CPUs read as zero). Four list registers per CPU. Only KVM uses it: with no guest running, the host kernel reads `VTR` when it probes the vgic and clears the list registers on every core."

[[block.source]]
kind       = "linux"
ref        = "dtb: `interrupt-controller@40041000` `reg <... 0x40044000 0x2000 ...>` -> `0xFF844000`, 8 KiB"
confidence = "high"

[[block.source]]
kind       = "standard"
ref        = "ARM IHI 0048B (GICv2), the GICH registers; GIC-400 TRM (ARM DDI 0471) for the memory map and the per-processor aliases"
confidence = "high"

[[block.source]]
kind       = "measured"
ref        = "reference board `dmesg`: `kvm [1]: vgic interrupt IRQ9`, `kvm [1]: Hyp nVHE mode initialized successfully`"
confidence = "high"


[block]
name    = "aux"
base    = 0x7E215000
size    = 0x100
summary = "AUX: mini-UART (UART1) and the SPI1 / SPI2 masters"
notes   = "Only the mini-UART is modelled, transmit-only with a line that is always ready. The SPI masters at +0x80 / +0xC0 read 0."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, Auxiliaries chapter"
confidence = "high"

[[register]]
name   = "IRQ"
offset = 0x00
access = "r"
notes  = "Which auxiliary has an interrupt pending. Always 0 here."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, Auxiliaries: AUX_IRQ"
confidence = "high"

[[register]]
name   = "ENABLES"
offset = 0x04
access = "rw"
notes  = "Per-auxiliary enables."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, Auxiliaries: AUX_ENABLES"
confidence = "high"

[[register.field]]
name  = "UART"

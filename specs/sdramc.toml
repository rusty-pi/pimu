[block]
name    = "sdramc"
base    = 0x7DC00000
size    = 0x40000
summary = "LPDDR4 controller and PHY, below the 0x7E window"
notes   = "DRAM is not simulated electrically: every training step reports success with the values the firmware's self-consistency checks expect. The PHY preset arrays copied in from memsysNN.bin read straight back. The per-byte-lane PHY blocks around +0x400..+0xC00 and +0x30000 are plain storage and not listed."

[[block.source]]
kind       = "decompile"
ref        = "EEPROM bootcode init_sdram_* path, driven by the memsysNN.bin PHY presets from pieeprom.bin"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "--trace-mmio over the SDRAM bring-up"
confidence = "high"

[[register]]
name   = "CTRL_STATUS"
offset = 0x20010
access = "r"
notes  = "Controller status."

[[register.source]]
kind       = "decompile"
ref        = "0x80003898 polls btest [+0x10], #0"
confidence = "high"

[[register.field]]
name  = "DONE"
bits  = "0"
notes = "Last command complete."

[[register.field.source]]
kind       = "decompile"
ref        = "0x80003898"
confidence = "high"

[[register]]
name   = "CTRL_CMD"
offset = 0x20014
access = "rw"
notes  = "Controller command port (0x55010000 style words); retires at once."

[[register.source]]
kind       = "trace"
ref        = "the bootcode writes 0x5501_0000 and then polls CTRL_STATUS"
confidence = "high"

[[register]]
name   = "PHY_CAL_TRIGGER"
offset = 0x32010
access = "rw"
notes  = "PHY calibration handshake: write 1, wait for PHY_CAL_BUSY, write 0."

[[register.source]]
kind       = "decompile"
ref        = "0x8000685e"
confidence = "high"

[[register]]
name   = "PHY_CAL_BUSY"
offset = 0x32014
access = "r"
notes  = "Non-zero while a calibration runs; the firmware wants it stable 10 times."

[[register.source]]
kind       = "decompile"
ref        = "0x8000685e"
confidence = "high"

[[register]]
name   = "PHY_RES_VALID"
offset = 0x32100
access = "rw"
notes  = "Calibration request / result block, word 0: seeded 1 (valid)."

[[register.source]]
kind       = "decompile"
ref        = "the firmware seeds [+0x00] = 1 before pulsing the trigger"
confidence = "high"

[[register]]
name   = "PHY_RES_CMD"
offset = 0x32104
access = "rw"
notes  = "Calibration command; 0x101 asks the PHY to report its signature."

[[register.source]]
kind       = "decompile"
ref        = "signature check 0x800068ce"
confidence = "high"

[[register]]
name   = "PHY_RES_PARAM"
offset = 0x32108
access = "rw"
notes  = "Sub-parameter."

[[register.source]]
kind       = "decompile"
ref        = "the firmware seeds [+0x08]"
confidence = "medium"

[[register]]
name   = "PHY_RES_SIGNATURE"
offset = 0x3210C
access = "rw"
reset  = 0x02230000
notes  = "Seed on the way in; on the way out the PHY signature for command 0x101, else 0 for 'no error'. The signature is a memsys version tag, not a constant: the bootloader loads it from the memsys config record it selected and compares the PHY's echo (Cmp r7, [+0x0C] at pc 0x800067de). The model reconstructs it from the PHY microcode the firmware wrote to PHY_B (marker 0x1860_02vv at +0x388, optional companion 0xA863_llll at +0x38C -> 0x02vv_llll); see src/periph/sdramc.rs report_signature. The reset value is the pinned board's 0x0223 memsys signature, used as the fall-back."

[[register.source]]
kind       = "decompile"
ref        = "0x800067de compares [+0x0C] with r7 (the MCB signature); 0x800065f6 / 0x800066a6 want 0"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "write of the version marker to 0x7DC3_8388 (pc 0x800066ba/0x8000675e) vs the expected r7 across the 0x0220/0x0222/0x0223 memsys versions"
confidence = "high"

[[register]]
name   = "PHY_RES_STATUS"
offset = 0x32110
access = "rw"
notes  = "Result: rank << 8 for command 0x101, else 0."

[[register.source]]
kind       = "decompile"
ref        = "0x800068ce checks ([+0x10] >> 8) & 0xFF against the rank it verifies"
confidence = "high"


[block]
name    = "otp"
base    = 0x7E20F000
size    = 0x1000
summary = "Always-on config / OTP engine: the fuse array, one row at a time – reads and programming"
notes   = "The fuse contents live in `src/periph/configotp.rs` and must never be a real board's (`CLAUDE.md`). Offsets without a known register keep the old 'always ready' status bits (17, 18, 7) so unrelated pollers progress. Programming follows start4's OTP driver (#92)."

[[block.source]]
kind       = "decompile"
ref        = "EEPROM bootloader `getconfig(key)`: key -> `+0x1C`, 0 -> `+0x0C` / `+0x08`, `+0x08 |= 1`, poll `+0x10`, value <- `+0x18`"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "start4's OTP driver (table `0x3EDFB5F8`): command `0x3ED3F24C`, read `0x3ED3FAA2`, enable programming `0x3ED3F9BE`, program `0x3ED3FC52` (#92)"
confidence = "high"

[[register]]
name   = "BOOTMODE"
offset = 0x00
access = "r"
notes  = "`OTP_BOOTMODE_REG`: the bootmode row (17) as the fuse block presents it at power-on. The boot ROM picks its boot source from it (bit 14, bits 5:4, and a `bits[30:28] == ~bits[10:8]` check) before it reads anything else; with the old 'always ready' placeholder here it skipped SPI and waited in USB device mode forever (#68). No later stage reads it."

[[register.source]]
kind       = "standard"
ref        = "Broadcom OTP register map: `OTP_BOOTMODE_REG` at `0x7E20F000`, `OTP_CONFIG_REG` `+0x04`, `OTP_CTRL_LO`/`HI` `+0x08`/`+0x0C`, `OTP_STATUS` `+0x10`, `OTP_DATA` `+0x18`, `OTP_ADDR` `+0x1C`"
confidence = "medium"

[[register.source]]
kind       = "decompile"
ref        = "C0 boot ROM `0x600009a6` reads it once; `0x6000038a` / `0x60000394` take bit 14 and bits 5:4"
confidence = "medium"

[[register]]
name   = "CLKMUX"
offset = 0x04
access = "rw"
notes  = "Clock-mux pokes (3 / 0 / 2), absorbed."

[[register.source]]
kind       = "decompile"
ref        = "the bootloader writes 3, 0, 2 here"
confidence = "medium"

[[register]]
name   = "PARAM_A"
offset = 0x08
access = "rw"
notes  = "The command, then bit 0 to start it. start4 reads it back once started and gives up when it differs."

[[register.source]]
kind       = "decompile"
ref        = "`getconfig`: writes 0, then `|= 1`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "start4 `0x3ED3F24C`: writes `cmd << 1`, then `cmd << 1 | 1`, and reads both parameters back"
confidence = "high"

[[register.field]]
name  = "GO"
bits  = "0"
notes = "Start the command."

[[register.field.source]]
kind       = "decompile"
ref        = "`getconfig` sets bit 0 to trigger"
confidence = "high"

[[register.field]]
name  = "CMD"
bits  = "5:1"
notes = "0: read row `KEY` into `DATA`. 2: one word of the programming key, from `DATA`. 3: disable programming. 10: program the bits of `DATA` into row `KEY`. The width is a guess; the highest command seen is 10."

[[register.field.source]]
kind       = "decompile"
ref        = "start4: read `0x3ED3FAA2` (0), enable programming `0x3ED3F9BE` (2), program `0x3ED3FC52` (10, then 3)"
confidence = "high"

[[register]]
name   = "PARAM_B"
offset = 0x0C
access = "rw"
notes  = "Second transaction parameter, written 0."

[[register.source]]
kind       = "decompile"
ref        = "`getconfig` writes 0"
confidence = "medium"

[[register]]
name   = "STATUS"
offset = 0x10
access = "rw"
notes  = "Transaction status."

[[register.source]]
kind       = "decompile"
ref        = "poll at `0x8000760e`: `btest [+0x10], #1`"
confidence = "high"

[[register.field]]
name   = "DONE"
bits   = "1"
access = "w1c"
notes  = "The command finished; after a read the row is in `DATA`."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x8000760e`"
confidence = "high"

[[register.field.source]]
kind       = "decompile"
ref        = "start4 `0x3ED3F24C` polls bit 1 after every command"
confidence = "high"

[[register.field]]
name   = "PROG_ENABLED"
bits   = "2"
access = "r"
notes  = "Programming is enabled: the four key words went in, in order. Command 3 clears it."

[[register.field.source]]
kind       = "decompile"
ref        = "start4 `0x3ED3F9BE` polls bit 2 after the fourth key word"
confidence = "high"

[[register]]
name   = "DATA"
offset = 0x18
access = "rw"
notes  = "What a read found in the row. Written with a key word before each enable command, and with the bits to fuse before a program command."

[[register.source]]
kind       = "decompile"
ref        = "`getconfig` reads the value from `+0x18`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "start4 `0x3ED3F9BE` writes the key words `0xf`, `0x4`, `0x8`, `0xd` (`.rdata` `0x3EDDE6E4`); `0x3ED3FC52` writes `old | new` before command 10"
confidence = "high"

[[register]]
name   = "KEY"
offset = 0x1C
access = "rw"
notes  = "OTP row number the next read or program command works on."

[[register.source]]
kind       = "decompile"
ref        = "`getconfig` writes the key to `+0x1C`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "start4 `0x3ED3FC52` writes the row before command 10"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "`--log otp`: the keys are row numbers (19..26 for the board-identity check, 28 serial, 30 revision)"
confidence = "high"

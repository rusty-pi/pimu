[block]
name    = "armlocal"
bus     = "arm"
base    = 0xFF800000
size    = 0x100
summary = "ARM local block: only the two registers the armstub writes"
notes   = "On BCM2836/7 this was the interrupt controller; BCM2711 has a GIC-400 instead and Linux never probes this node (no interrupt-controller property). Every other offset faults rather than read 0, so an unexpected client is loud."

[[block.source]]
kind       = "linux"
ref        = "dtb start4 hands to Linux: interrupt-controller@40000000, brcm,bcm2836-l1-intc, reg = <0x40000000 0x100> (0xFF800000 through the soc ranges), no interrupt-controller property"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "the armstub start4 places at ARM address 0 (start4.elf file offset 0x1E40EC, armstub8 shape)"
confidence = "high"

[[register]]
name   = "ARM_CONTROL"
offset = 0x00
access = "rw"
notes  = "Written 0 by the armstub."

[[register.source]]
kind       = "decompile"
ref        = "armstub: ldr x0, =0xff800000; str wzr, [x0]"
confidence = "high"

[[register]]
name   = "CORE_TIMER_PRESCALER"
offset = 0x08
access = "rw"
notes  = "Written 0x80000000 by the armstub; with ARM_CONTROL 0 the generic-timer counter runs at the 54 MHz crystal."

[[register.source]]
kind       = "decompile"
ref        = "armstub: mov w1, #0x80000000; str w1, [x0, #8]; cntfrq_el0 = 54000000"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "reference board dmesg: 'arch_timer: cp15 timer(s) running at 54.00MHz (phys)'"
confidence = "high"

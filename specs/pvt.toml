confidence = "high"

[[register]]
name   = "THRESHOLD_A"
offset = 0x14
access = "rw"
notes  = "The target window for the upper half of READING; can be read before anything writes it, so the model seeds it from hardware. start4 writes it at the end of its core-voltage characterisation: LO = count(13756), HI = count(13756 + slope / 100), where count(s) = (s / 54) * 0x7FFF / 10000 and slope is 59975 on channels 0..2 and 47784 on the rest. That gives 0x03640340 and 0x035D0340, the values hardware holds. With start4's parameters the window does not depend on anything it measured. Its monitoring pass raises the core voltage while the upper half is below LO, and keeps it while the half is at or below HI."

[[register.source]]
kind       = "decompile"
ref        = "FUN_0ec30276 reads and splits it; FUN_0ec3030e writes (lo & 0xffff) | (hi << 16)"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "FUN_0ec30828 computes it through FUN_0ec313c0 from DAT_0edfe0c8 (targets) and DAT_0ede6a80 (slopes, index 1 for channels 0..2, else 3); FUN_0ec311d2 compares against it"
confidence = "high"

[[register.source]]

notes  = "Measurement pair. start4 reads it at both of its measuring points and works out, for each half, the core voltage at which the channel would run at its target speed; the highest such voltage over all monitors is what it sets. Held constant in the model: counts that barely move leave that voltage at the lower measuring point."


[block]
name            = "pvt"
base            = 0x7D5D8000
size            = 0x480
summary         = "Per-channel PVT (process / voltage / temperature) monitors"
instances       = 18
instance_stride = 0x40
notes           = "Eighteen channels, one bank each. Carved out of the `clkmon` window and decoded ahead of it. The measured per-channel thresholds and readings live in src/periph/pvt.rs; a register can only carry one reset value, and these differ per channel. start4 leaves channels 2 and 3 out of its core-voltage characterisation (mask 0xC, FUN_0ec3503e), which is why their thresholds read 0 on hardware."

[[block.source]]
kind       = "decompile"
ref        = "FUN_0ec300fa(ch, ...) reads ch * 0x40 + 0x7d5d8010 / +0x1c; start4 initialises k = 0..17"
confidence = "high"

[[block.source]]
kind       = "measured"
ref        = "/dev/mem at 0xFD5D8000 on a Raspberry Pi 4B d03115: all eighteen channels carry the magic"
confidence = "high"

[[register]]
name   = "INDEX"
offset = 0x00
access = "r"
notes  = "The channel's own index."

[[register.source]]
kind       = "measured"
ref        = "reads 0..17 across the channels on a Raspberry Pi 4B d03115"
confidence = "high"

[[register]]
name   = "MAGIC"
offset = 0x10
access = "rw"
reset  = 0x7FFF50CF
notes  = "Present marker. Reading 0 would say the channel is absent. start4 writes 0x7FFF50CF here itself before it reads a channel, 2 us per channel: all eighteen as the characterisation starts, then again for every channel but 2 and 3. Whether hardware holds the value without that write is not known; the model returns it either way."

[[register.source]]
kind       = "decompile"
ref        = "FUN_0ec300fa only reads +0x1C when *(ch * 0x40 + 0x7d5d8010) == 0x7fff50cf"
confidence = "high"


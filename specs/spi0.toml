[[register]]
name   = "DC"
offset = 0x14
access = "rw"
notes  = "The four DMA thresholds: `TDREQ` (7:0) and `TPANIC` (15:8) for writes, `RDREQ` (23:16) and `RPANIC` (31:24) for reads, resetting to `0x20`, `0x10`, `0x20` and `0x30`. They say how full a FIFO has to be before the master raises its DREQ, and then its panic, to the DMA channel `TI.PERMAP` 6 and 7 select. The model transfers a byte at a time inside the `FIFO` write and never raises a DREQ, so the word is storage."


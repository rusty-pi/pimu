[block]
name    = "spi0"
base    = 0x7E204000
size    = 0x18
summary = "SPI0 master, with the serial-NOR flash the EEPROM bootloader was loaded from"
notes   = "Driven in polled single-byte mode. Every shift is instantaneous; the flash answers READ, FAST_READ, RDID, RDSR, WREN / WRDI, SE and PP."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, SPI chapter"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "EEPROM bootloader: wait TXD, write FIFO, wait RXD, read FIFO per byte; start4's EEPROM scanner 0x3ED77E00"
confidence = "high"


[block]
name    = "sdc"
base    = 0x7E001000
size    = 0x1000
summary = "Legacy SDRAM-controller interface: DRAM timing table, sub-controller ready bits, LPDDR4 mode-register port"
notes   = "The DRAM clock tree is not modelled: timing words read back, every sub-controller reports ready, and the mode registers are a table seeded with the reference board's MR4 and a 2 GB board's MR8 (one rank of 16 Gb x16 dies; the second rank is not fitted)."

[[block.source]]
kind       = "decompile"
ref        = "bootloader timing setup (`0x80006380` prints one word as `SD_SB`) and ready poll `0x8000a3e0`; start4's SDRAM driver in the `.drivers` entry at `0x3EDFDF68`"
confidence = "high"

[[register]]
name   = "TIMING0"
offset = 0x00
access = "rw"
notes  = "First word of the DRAM timing table the bootloader programs."

[[register.source]]
kind       = "decompile"
ref        = "bootloader writes `+0x00..+0x30` after PHY training"
confidence = "medium"

[[register]]
name   = "REFRESH"
offset = 0x04
access = "rw"
notes  = "Timing word carrying the refresh interval, which start4 rescales from MR4 once the ARM runs."

[[register.source]]
kind       = "decompile"
ref        = "`0x3ED6BBA0` rescales `[0x7E001004] >> 16` by `1 << (3 - MR4 code)`"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "`examples-on-real-hardware/vc4-boot.log`: `sdram: sdram refresh 1562->3124 (2)`"
confidence = "high"

[[register.field]]
name  = "INTERVAL"
bits  = "31:16"
notes = "Refresh interval."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x3ED6BBA0` reads and writes bits 31:16"
confidence = "high"

[[register]]
name   = "TIMING"
offset = 0x08
count  = 11
stride = 4
access = "rw"
notes  = "The rest of the timing table (`+0x08..+0x30`): packed tRAS / tRC / tRCD / tRFC-style fields."

[[register.source]]
kind       = "decompile"
ref        = "bootloader writes `+0x00..+0x30` after PHY training"
confidence = "medium"

[[register]]
name   = "STATUS"
offset = 0x9C
count  = 31
stride = 0x80
access = "rw"
notes  = "Per-sub-controller status, at `+0x1C` of each `0x80` block from `+0x80`; bit 31 is ready. Element 0 is also the LPDDR4 mode-register access port: write a command, poll `DONE`, take the byte from `RDATA`."

[[register.source]]
kind       = "decompile"
ref        = "`0x8000a3e0` polls `[0x7E00109C] & 0x80000000` ten times with 1 ms sleeps ('block device timeout')"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "start4 mode-register read `0x3ED6BA90` and write `0x3ED6C084`"
confidence = "high"

[[register.field]]
name  = "ADDR"
bits  = "7:0"
notes = "Mode register number."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x3ED6BA90`: `addr | chan << 24 | dev << 25`"
confidence = "high"

[[register.field]]
name  = "WDATA"
bits  = "15:8"
notes = "Byte to write."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x3ED6C084` puts the data in bits 15:8"
confidence = "high"

[[register.field]]
name  = "RDATA"
bits  = "23:16"
notes = "Byte read back."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x3ED6BA90` takes the result from bits 23:16"
confidence = "high"

[[register.field]]
name  = "DEVICE"
bits  = "24"
notes = "Device (rank, i.e. chip select). A rank that is not fitted answers nothing, so every mode register reads 0 there."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x3ED6BA90` logs `RD: MR addr: %d device: %d channel: %d` with the argument it shifts to bit 24 as the device"
confidence = "high"

[[register.field.source]]
kind       = "decompile"
ref        = "2023-05-11 bootcode rank detection (`0x800056a4`): x2 only when MR8 reads the same with bit 24 clear and set"
confidence = "high"

[[register.field]]
name  = "CHANNEL"
bits  = "25"
notes = "LPDDR4 channel."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x3ED6BA90` logs the argument it shifts to bit 25 as the channel"
confidence = "high"

[[register.field]]
name  = "WRITE"
bits  = "28"
notes = "Set for a write, clear for a read."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x3ED6C084` sets bit 28"
confidence = "high"

[[register.field]]
name   = "ERROR"
bits   = "30"
access = "r"
notes  = "Transfer failed (`SD MR %08x R timeout`). Never set here."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x3ED6BA90` checks bit 30 and logs the timeout"
confidence = "high"

[[register.field]]
name   = "DONE"
bits   = "31"
access = "r"
notes  = "Ready / transfer complete."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x8000a3e0` and `0x3ED6BA90` both poll bit 31"
confidence = "high"

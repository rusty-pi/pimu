[block]
name    = "dma_vpu"
base    = 0x7EE04100
size    = 0x1000
summary = "The DMA controller start4's dmalib drives: 16 channel slots, channel 15 at `0x7EE05000`"
notes   = "Same channel layout as the legacy controller (`dma`), but all 16 slots are channels, so there is no room for its controller-wide words. Before it was mapped, channel 15 landed in the catch-all stub."

[[block.source]]
kind       = "decompile"
ref        = "`dma_set_cs` `0x3EC98E7C` / `dma_chain_start` `0x3EC97544`: `base = ch < 15 ? 0x7E007000 : 0x7EE04100`, registers at `base + ch * 0x100`; the transfer queue runs on channel 15"
confidence = "high"

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §4.2: \"DMA Channel 15 however, is physically removed from the other DMA Channels and so has a different address base of `0x7ee05000`\", and is the VPU's exclusively"
confidence = "high"

[[register]]
name   = "CS"
offset = 0x00
count  = 16
stride = 0x100
access = "rw"
notes  = "Channel control and status, laid out as `dma` `CS`."

[[register.source]]
kind       = "decompile"
ref        = "`dma_set_cs` `0x3EC98E7C` writes `flags | 1`"
confidence = "high"


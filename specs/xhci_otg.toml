[block]
name    = "xhci_otg"
base    = 0x7E9C0000
size    = 0x100000
summary = "The BCM2711's own xHCI controller: the USB-C port as a USB 2.0 host, which the bootloader boots from as `BCM-USB-MSD` and Linux uses with `otg_mode=1`"
notes   = "One USB2 root port, and the same ring engine as the xHCI behind the VL805 (`src/periph/xhci.rs`), so the register layout is the standard one and only the capability values differ: one port, one interrupter, no streams and no scratchpad buffers. Its DMA reaches memory by CPU-physical address — `/scb dma-ranges` is the identity over 16 GB — and those addresses are 64 bits wide: the firmware builds its rings in the low gigabyte, Linux wherever it allocated them, above 4 GB on a board with that much DRAM. `--otg <img>` plugs a mass-storage device into the port; with nothing plugged in the port reads empty and powered, as the other root ports do. The DWC2 core at `0x7E980000` (`specs/dwc2.toml`) is the *other* controller on the same socket: the two are alternatives, and `otg_mode` picks between them."

[[block.source]]
kind       = "linux"
ref        = "`bcm2711-rpi-4-b.dtb` (raspberrypi/firmware): `/scb/xhci@7e9c0000`, compatible `generic-xhci`, `reg <0x0 0x7e9c0000 0x0 0x00100000>`, `interrupts <0x0 0xb0 0x4>`, `status = \"disabled\"` — the firmware enables the node when `config.txt` says `otg_mode=1`, and leaves `usb@7e980000` (the DWC2 core) disabled instead"
confidence = "high"

[[block.source]]
kind       = "standard"
ref        = "eXtensible Host Controller Interface 1.1, section 5: the register layout at the base"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "`boot --eeprom firmware/pieeprom.bin --boot-order 0x5 -v`: after `Boot mode: BCM-USB-MSD (05) order 0` the bootloader reads `0x7E9C0000` `+0x00`..`+0x1C` — the capability registers — and nothing else; with the block on the catch-all stub it read zeroes and printed `xHC0 ver: 0 HCS: 00000000 00000000 00000000 HCC: 00000000`, `xHC0 ports 0 slots 0 intrs 0` and `USB xHC init failed`. The `dwc2` log channel is empty for that whole run: this boot mode never touches the DWC2 core"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "`start4.elf` has `bfs_xhci_init` beside `bfs_xhci_init_pcie`, the `otg_mode` config key and the `CLK_USBXHCI` clock name: a second, non-PCIe xHCI to bring up"
confidence = "medium"

[block.irq]
gic_spi = 176
notes   = "Level-triggered, so the line follows interrupter 0's `IMAN.IP` (GIC id 208 — Linux reports 32 higher than the device tree's number). The VPU has no source of its own for this block: the bootloader polls `USBSTS` and the event ring, as it does behind the VL805."

[[block.irq.source]]
kind       = "linux"
ref        = "`bcm2711-rpi-4-b.dtb` `/scb/xhci@7e9c0000`: `interrupts <0x0 0xb0 0x4>`"
confidence = "high"


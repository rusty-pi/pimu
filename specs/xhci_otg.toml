notes  = "Where the operational registers start."

[[register.source]]
kind       = "inferred"
ref        = "the standard layout, the same one the VL805's controller uses (`specs/xhci.toml`); the model shares one ring engine between the two, and a driver finds the operational registers through this value whatever it is"
confidence = "medium"


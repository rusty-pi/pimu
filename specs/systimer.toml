[block]
name    = "systimer"
base    = 0x7E003000
size    = 0x1000
summary = "System timer: 64-bit free-running 1 MHz counter with four compare channels"
notes   = "Compare channel n raises VPU interrupt source 64 + n when it matches."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, System Timer chapter"
confidence = "high"

[[block.source]]
kind       = "linux"
ref        = "`bcm283x.dtsi`: `brcm,bcm2835-system-timer`, `reg = <0x7e003000 0x1000>`"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "start4 arms `C0` as its ThreadX tick (source 64) and `C2` as the clock service's timeout (source 66)"
confidence = "high"

[block.irq]
vpu   = { C0 = 64, C1 = 65, C2 = 66, C3 = 67 }
notes = "Compare channel `n` raises `64 + n`. start4 arms `C0` as its ThreadX tick and `C2` as the clock service's timeout."

[[block.irq.source]]
kind       = "decompile"
ref        = "start4 `enable_irq_source(64, 1)` before it arms `C0`; the clock service waits on `C2` with source 66"
confidence = "high"

[[block.irq.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §6.2.4 Table 102: VC peripheral IRQs 0 to 3 are `Timer 0` to `Timer 3`, which the VPU takes as sources 64 to 67"
confidence = "high"

[[register]]
name   = "CS"
offset = 0x00
access = "w1c"
notes  = "Match flags, one per compare channel. Write 1 to clear."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, System Timer: `CS`"
confidence = "high"

[[register.source]]
kind       = "linux"
ref        = "`drivers/clocksource/bcm2835_timer.c` acks its channel by writing its bit to `+0x00`"
confidence = "high"

[[register.field]]
name  = "M0"
bits  = "0"
notes = "Channel 0 matched."

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, System Timer: `CS`"
confidence = "high"

[[register.field]]
name  = "M1"
bits  = "1"
notes = "Channel 1 matched."

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, System Timer: `CS`"
confidence = "high"

[[register.field]]
name  = "M2"
bits  = "2"
notes = "Channel 2 matched."

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, System Timer: `CS`"
confidence = "high"

[[register.field]]
name  = "M3"
bits  = "3"
notes = "Channel 3 matched."

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, System Timer: `CS`"
confidence = "high"

[[register]]
name   = "CLO"
offset = 0x04
access = "r"
notes  = "Counter, low 32 bits."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, System Timer: `CLO`"
confidence = "high"

[[register.source]]
kind       = "linux"
ref        = "`drivers/clocksource/bcm2835_timer.c` reads the counter at `+0x04`"
confidence = "high"

[[register]]
name   = "CHI"
offset = 0x08
access = "r"
notes  = "Counter, high 32 bits."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, System Timer: `CHI`"
confidence = "high"

[[register]]
name   = "C"
offset = 0x0C
count  = 4
stride = 4
access = "rw"
notes  = "Compare values. Channel n matches once when `CLO` reaches `C[n]`; it does not reload."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, System Timer: `C0..C3`"
confidence = "high"

[[register.source]]
kind       = "linux"
ref        = "`drivers/clocksource/bcm2835_timer.c` programs channel n at `+0x0C + 4 * n`"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "start4 re-arms `C0` from its tick ISR `0x3EC40B7C` on every tick"
confidence = "high"

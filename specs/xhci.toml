[[register]]
name   = "USBSTS"
offset = 0x24
access = "rw"
notes  = "Status; the event and change bits are write-1-to-clear. The bootloader's controller set-up writes all-ones here after the event ring and before `RS`. Its stop routine prints `USBSTS` first, and only a controller that reads neither `HCH` nor `CNR` gets `RS` cleared. It then reads `USBSTS` until `HCH` shows: read, wait 1 ms, test, up to 5000 times, then `xHC stop USBSTS: %x`. Its reset routine waits for `CNR` to clear the same way (`xHC reset USBSTS: %x`)."

[[register.source]]
kind       = "standard"
ref        = "xHCI 1.1, 5.4.2 `USBSTS`"
confidence = "high"

[[register.source]]
kind       = "measured"

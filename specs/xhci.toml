offset = 0x20
access = "rw"
notes  = "Run / stop and resets. The bootloader's controller set-up, right after it prints the port, slot and interrupter counts, sets `HCRST` (read-modify-write) and reads `USBCMD` until it clears: read, wait 1 ms, test, up to 5000 times, then `xHC HCRST timeout %x`. After the rings and `USBSTS` it sets `HSEE` (bit 3), `INTE` and `RS`, one read-modify-write each, in that order."

[[register.source]]
kind       = "standard"
ref        = "xHCI 1.1, 5.4.1 `USBCMD`"
confidence = "high"

[[register.source]]
kind       = "decompile"

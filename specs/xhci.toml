[block]
name    = "xhci"
bus     = "pci"
base    = 0x0
size    = 0x1000
summary = "xHCI register block behind the VL805's BAR0: capability, operational, runtime and doorbell registers"
notes   = "Offsets are into BAR0 (4 KiB). The VPU reaches it only by 40-bit DMA through the PCIe outbound window, the ARM through that window at `0x6_0000_0000`. Five root ports: port 1 USB2, ports 2..5 USB3; a VIA hub sits on port 1 on every board."

[[block.source]]
kind       = "standard"
ref        = "eXtensible Host Controller Interface 1.1, section 5"
confidence = "high"

[[block.source]]
kind       = "measured"
ref        = "capability registers and `PORTSC` read on a Raspberry Pi 4B d03115 through `/dev/mem`, `sudo od -Ax -tx4 -v /dev/mem` at the BAR0 address `lspci -vvv` reports for `01:00.0`; `dmesg` `hcc params 0x002841eb hci version 0x100`"
confidence = "high"

[[block.source]]
kind       = "measured"
ref        = "the bootloader log on a Raspberry Pi 4B d03115: `xHC0 ver: 256 HCS: 05000420 fc000031 00e70004 HCC: 002841eb`"
confidence = "high"

[block.parent]
name  = "vl805"
notes = "The registers behind the endpoint's BAR0, so they move with whatever address is programmed into it."

[[block.parent.source]]
kind       = "standard"
ref        = "PCI Local Bus 3.0: a type-0 BAR maps the function's register block; xHCI 1.1 section 5 is what lives there"
confidence = "high"


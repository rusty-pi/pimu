[[register]]
name   = "LOWER"
offset = 0xD00
count  = 24
stride = 4
access = "rw"
notes  = "Per-channel lower bounds `FUN_0ec302c2` writes and `FUN_0ec311d2` compares against. start4's own output, not calibration data: `count(target)` with `count(s) = (s / 54) * 0x7FFF / 10000` and the channel's target speed. start4's parameter block (all offsets 0) makes the bounds independent of anything it measured, which is why a model with made-up counts writes the same 44 words as hardware. Channels 22 and 23 are never written. start4 also sets slot `0x34` (`+0xDD0`) to all-ones each time it arms the monitors."

[[register.source]]
kind       = "decompile"
ref        = "`FUN_0ec302c2` writes them, `FUN_0ec300a4` reads them back"
confidence = "high"


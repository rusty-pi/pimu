[[register]]
name   = "RESULT"
offset = 0x200
count  = 6
stride = 4
access = "r"
notes  = "Per-channel sample. Channel 0 is the temperature sensor (`410040 - 487 * count` mdegC), 2 / 3 / 5 are rail voltages, 1 and 4 read ~0 on real silicon. start4 converts a channel as `(count * scale) >> shift`: channel 0 scale -498739, shift 10, plus 410040 (mdegC); channels 1..4 scale 100571 and channel 5 scale 176000, shift 13 (tenths of a mV). Channel 3 is the SoC core rail its voltage calibration reads, as the average of up to 150 samples with every other channel masked. The thermal driver instead waits for `VALID` on channel 0 and reads the word once more."

[[register.source]]
kind       = "linux"
ref        = "`bcm2711_thermal` reads `+0x200`: `temp_mC = 410040 - 487 * count`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "`FUN_0ed603e2` indexes the `DAT_0edfbe9c` table of these six words; `FUN_0ecc6488` converts with the scales at `DAT_0edfbe84`"
confidence = "high"

[[register.source]]

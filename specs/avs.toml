[block]
name    = "avs"
base    = 0x7D5D2000
size    = 0xF00
summary = "AVS monitor: on-die temperature sensor and the ring-oscillator / rail voltage monitors"
notes   = "Carved out of the `clkmon` window and decoded ahead of it. The per-channel counts are measured and live in src/periph/avs.rs; channel 3 follows the core-rail PMIC setpoint so start4's DVFS calibration converges."

[[block.source]]
kind       = "linux"
ref        = "avs-monitor@7d5d2000, brcm,bcm2711-avs-monitor, reg = <0x7d5d2000 0xf00>"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "start4 DVFS code: FUN_0ed603e2, FUN_0ed6040e, FUN_0ec3007a, FUN_0ec303e8, FUN_0ec302c2"
confidence = "high"

[[register]]
name   = "DISABLE_MASK"
offset = 0x03C
access = "rw"
notes  = "Channel disable mask: a set bit masks a channel off. Written ~(1 << ch) & 0x7F around a reading, 0 at rest."

[[register.source]]
kind       = "decompile"
ref        = "FUN_0ed6040e writes ~(1 << ch) & 0x7F, then 0"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "reads 0 on the idle reference board while all six channels report valid samples, so a clear bit cannot mean 'not selected'"
confidence = "high"

[[register.field]]
name  = "CHANNELS"
bits  = "6:0"
notes = "One bit per channel."

[[register.field.source]]
kind       = "decompile"
ref        = "FUN_0ed6040e masks with 0x7F"
confidence = "high"

[[register]]
name   = "REG_040"
offset = 0x040
access = "rw"
notes  = "Enable mask written all-ones during a measurement. Reads 0 at rest on hardware, while channels read fine, so it is not a read enable."

[[register.source]]
kind       = "decompile"
ref        = "FUN_0ed6040e"
confidence = "medium"

[[register.source]]
kind       = "measured"
ref        = "reads 0 on the idle reference board"
confidence = "high"

[[register]]
name   = "REG_044"
offset = 0x044
access = "rw"
notes  = "Second enable mask, same behaviour as REG_040."

[[register.source]]
kind       = "decompile"
ref        = "FUN_0ed6040e"
confidence = "medium"

[[register.source]]
kind       = "measured"
ref        = "reads 0 on the idle reference board"
confidence = "high"

[[register]]
name   = "REG_06C"
offset = 0x06C
access = "rw"
notes  = "Written, never read back."

[[register.source]]
kind       = "trace"
ref        = "RVF_TRACE_MMIO=0x7d5d0000-0x7d5e0000 over a boot to arm_loader"
confidence = "high"

[[register]]
name   = "REG_074"
offset = 0x074
access = "rw"
notes  = "Written, never read back."

[[register.source]]
kind       = "trace"
ref        = "RVF_TRACE_MMIO=0x7d5d0000-0x7d5e0000 over a boot to arm_loader"
confidence = "high"

[[register]]

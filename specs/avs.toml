offset = 0xE00
count  = 24
stride = 4
access = "rw"
notes  = "Per-channel upper bounds, as `LOWER`: `count(target + slope / 100)`, the speed 10 mV above the target, with the per-channel slopes at `DAT_0ede6a80`. The monitoring pass lowers the core voltage only if every channel reads above its upper bound, and raises it if any reads below its lower one. Slot `0x34` (`+0xED0`) is set to all-ones with `LOWER`'s."


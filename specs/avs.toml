[[register.source]]
kind       = "trace"
ref        = "RVF_TRACE_MMIO=0x7d5d0000-0x7d5e0000 over a boot to arm_loader"
confidence = "high"

[[register]]
name   = "RESULT"
offset = 0x200
count  = 6
stride = 4
access = "r"
notes  = "Per-channel sample. Channel 0 is the temperature sensor (410040 - 487 * count mdegC), 2 / 3 / 5 are rail voltages, 1 and 4 read ~0 on real silicon."

[[register.source]]
kind       = "linux"
ref        = "bcm2711_thermal reads +0x200: temp_mC = 410040 - 487 * count"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "FUN_0ed603e2 indexes the DAT_0edfbe9c table of these six words; FUN_0ecc6488 converts"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "/dev/mem reads of 0x7d5d2200..0x7d5d2214 on rpi-dev, freshly booted and idle"
confidence = "high"

[[register.field]]
name  = "COUNT"
bits  = "9:0"
notes = "Sample."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2711_thermal: BCM2711_TS_DATA_MASK"
confidence = "high"

[[register.field]]
name  = "VALID"
bits  = "10"
notes = "Sample valid."

[[register.field.source]]
kind       = "linux"
ref        = "bcm2711_thermal: BCM2711_TS_VALID_MASK"
confidence = "high"

[[register.field]]
name  = "SETTLED"
bits  = "16"
notes = "Sample settled. Linux ignores it; start4 will not take a sample without it."

[[register.field.source]]
kind       = "decompile"
ref        = "FUN_0ed603e2 spins until bits 10 and 16 are both set"
confidence = "high"

[[register]]

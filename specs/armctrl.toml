[block]
name    = "armctrl"
base    = 0x7E00B000
size    = 0x880
summary = "ARM control block as the VPU sees it, below the mailboxes: where `arm_loader` releases the ARM"
notes   = "The whole pinned boot touches this block a handful of times. Only the release bit has a known meaning; everything else is stored and read back."

[[block.source]]
kind       = "trace"
ref        = "`RVF_TRACE_MMIO=7e00b000-7e101000 recon`: the writes right after `arm_loader: Starting ARM`, all from start4's MMIO write helper `0xFEC0043A`"
confidence = "high"

[[block.source]]
kind       = "inferred"
ref        = "size: up to the mailboxes at `0x7E00B880`"
confidence = "high"

[[register]]
name   = "CONTROL"
offset = 0x000
access = "rw"
notes  = "Written `0x200` shortly before the ARM starts, and `0x1000` as the last access before it does, which clears `0x200` again."

[[register.source]]
kind       = "trace"
ref        = "`0x7E00B000` <- `0x00000200` (early), <- `0x00001000` (after `arm_loader`)"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "`--trace-mmio` through the ARM release: the `0x200` write comes after the UART handover and the PLLB bring-up, some 1300 accesses before the release"
confidence = "high"
note       = "the `recon` above calls the `0x200` write early; a trace that runs past the release puts it close to the release"

[[register.field]]
name  = "RELEASE"
bits  = "12"
notes = "Let the ARM out of reset. The ARM starts at PC 0 in EL3."

[[register.field.source]]
kind       = "inferred"
ref        = "it is the last write before the ARM runs, and nothing but PM housekeeping follows"
confidence = "medium"

[[register]]
name   = "REG_008"
offset = 0x008
access = "rw"
notes  = "Written `0x3030` at the ARM release. Meaning unknown."

[[register.source]]
kind       = "trace"
ref        = "`0x7E00B008` <- `0x00003030` after `arm_loader`"
confidence = "high"

[[register]]
name   = "TIMER_LOAD"
offset = 0x400
access = "rw"
notes  = "What the countdown reloads with, and what a write here puts straight into `TIMER_VALUE`."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register]]
name   = "TIMER_VALUE"
offset = 0x404
access = "r"
notes  = "The countdown as it stands. Reads 0 here: the model does not run this timer."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register]]
name   = "TIMER_CONTROL"
offset = 0x408
access = "rw"
notes  = "Which parts of the timer run, and how the two clocks are divided. Wider than a real SP804’s, which stops at bit 7."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register.field]]
name  = "DIV"
bits  = "3:2"
notes = "The SP804 pre-scale: 0 divides the pre-divided clock by 1, 1 by 16, 2 by 256."

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register.field]]
name  = "IE"
bits  = "5"
notes = "Timer interrupt enabled. Set out of reset."

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register.field]]
name  = "ENABLE"
bits  = "7"
notes = "Run the countdown."

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register.field]]
name  = "DBGHALT"
bits  = "8"
notes = "Stop the timers while the ARM is halted in debug."

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register.field]]
name  = "ENAFREE"
bits  = "9"
notes = "Run the free-running counter."

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register.field]]
name  = "FREEDIV"
bits  = "23:16"
notes = "Free-running counter pre-scaler: it counts at `sys_clock / (FREEDIV + 1)`. Reset `0x3E`."

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register]]
name   = "TIMER_IRQCNTL"
offset = 0x40C
access = "w"
notes  = "Write 1 to bit 0 to acknowledge the timer interrupt."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register]]
name   = "TIMER_RAWIRQ"
offset = 0x410
access = "r"
notes  = "Bit 0: the countdown has expired, whether or not the interrupt is enabled."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register]]
name   = "TIMER_MSKIRQ"
offset = 0x414
access = "r"
notes  = "Bit 0: the interrupt line is up — `TIMER_RAWIRQ` and `TIMER_CONTROL.IE` together."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register]]
name   = "TIMER_RELOAD"
offset = 0x418
access = "rw"
notes  = "Like `TIMER_LOAD`, but it does not restart the countdown."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register]]
name   = "TIMER_PREDIV"
offset = 0x41C
access = "rw"
notes  = "The ARM timer’s pre-divider, 10 bits, reset `0x7D`: the timer counts at `apb_clock / (TIMER_PREDIV + 1)`. Not a register a real SP804 has. start4 writes `0x1F3` (a divisor of 500) before the release and `0xA` (11) at it, which is it setting the ARM timer’s rate for whatever runs next. The model does not run the timer, so the word is storage."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`, and §12.2 Table 200 (`PREDIV`, bits 9:0, reset `0x7D`)"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "`0x7E00B41C` <- `0x0000000A` after `arm_loader`"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "`0x7E00B41C` <- `0x000001F3` at `0x3EC53594`, before the release"
confidence = "high"

[[register]]
name   = "TIMER_FREECNT"
offset = 0x420
access = "r"
notes  = "The free-running counter `TIMER_CONTROL.ENAFREE` starts. Reads 0 here."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §12.2 Table 192 (Timer Registers): the ARM-side SP804-like timer, based at `0x7E00B000` with its registers from `+0x400`"
confidence = "high"

[[register]]
name   = "REG_440"
offset = 0x440
access = "rw"
notes  = "start4 clears bit 9 (read-modify-write) just after the ARM release; the value read then is 0. Another routine sets bit 9 and waits for bit 31 of `+0x444`. Meaning unknown."

[[register.source]]
kind       = "trace"
ref        = "`0x7E00B440` <- `0x00000000` at `0x3EC81F8A`, after the release"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "start4 `0x3EC81F80`..`0x3EC81F8A` (`bitclear 9`); `0x3EC81F8E`..`0x3EC81F9E` (`bitset 9`, then spin until `+0x444` bit 31)"
confidence = "high"

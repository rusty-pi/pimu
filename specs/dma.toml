[block]
name    = "dma"
base    = 0x7E007000
size    = 0x1000
summary = "Legacy DMA controller: 15 channels `0x100` apart plus the controller-wide interrupt status and enable words"
notes   = "start4 copies anything of 1 KiB or more through here (`dma_memcpy`). Channel 11's slot at `+0xB00` is the DMA4 channel (`dma4`), decoded ahead of this block. The `0x7EE04100` controller (`dma_vpu`) has the same channel layout."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, DMA Controller chapter: channel register blocks `0x100` apart, `INT_STATUS` / `ENABLE` at `0xFE0` / `0xFF0`"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "`dma_memcpy` `0x3EC981CC`; `dma_set_cs` `0x3EC98E7C`: `base = ch < 15 ? 0x7E007000 : 0x7EE04100`, `start = *(base + ch * 0x100) = flags | 1`"
confidence = "high"

[[register]]
name   = "CS"
offset = 0x00
count  = 15
stride = 0x100
access = "rw"
notes  = "Channel control and status."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, DMA: `CS`"
confidence = "high"

[[register.field]]
name  = "ACTIVE"
bits  = "0"
notes = "Channel running."

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, DMA: `CS`"
confidence = "high"

[[register.field]]
name  = "END"
bits  = "1"
notes = "Chain finished."

[[register.field.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, DMA: `CS`"
confidence = "high"

[[register.field]]
name  = "INT"
bits  = "2"
notes = "Interrupt pending."

[[register.field.source]]
kind       = "decompile"
ref        = "`dma_interrupt` `0x3EC980E8` only enters `dma_chan_interrupt` for a channel with `CS & 4`"
confidence = "high"

[[register]]
name   = "CONBLK_AD"
offset = 0x04
count  = 15
stride = 0x100
access = "rw"
notes  = "Control-block address. Writing a non-null chain while `ACTIVE` starts it, which is how dmalib starts every transfer."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, DMA: `CONBLK_AD`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "`dma_chain_start` `0x3EC97544` writes only `*(base + ch * 0x100 + 4) = cb`"
confidence = "high"

[[register]]
name   = "TI"
offset = 0x08
count  = 15
stride = 0x100
access = "r"
notes  = "Transfer information, loaded from the control block. Control blocks use the same bit layout."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, DMA: `TI`"
confidence = "high"


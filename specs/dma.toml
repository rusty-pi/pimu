[block]
name    = "dma"
base    = 0x7E007000
size    = 0x1000
summary = "Legacy DMA controller: 15 channels `0x100` apart plus the controller-wide interrupt status and enable words"
notes   = "start4 copies anything of 1 KiB or more through here (`dma_memcpy`). The sixteen channels are three kinds of engine: 0 to 6 the full ones, 7 to 10 DMA Lite (a 16-bit `TXFR_LEN`, no 2D mode, no `SRC_IGNORE` / `DEST_IGNORE`, half the bandwidth), and 11 to 14 DMA4, which are 40-bit and have a register map of their own. Channel 11's slot at `+0xB00` is the DMA4 channel (`dma4`), decoded ahead of this block. The `0x7EE04100` controller (`dma_vpu`) has the same channel layout. A control block's addresses are VC4 bus addresses, alias bits and all, and the engine sits behind the L2: only `0xC000_0000` goes past the caches."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §4.5 (DMA LITE Engines) and §4.6 (DMA4 Engines): what each kind of engine can and cannot do"
confidence = "high"

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §4.2 (DMA Controller): channel register blocks `0x100` apart, `INT_STATUS` / `ENABLE` at `0xFE0` / `0xFF0`"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "`dma_memcpy` `0x3EC981CC`; `dma_set_cs` `0x3EC98E7C`: `base = ch < 15 ? 0x7E007000 : 0x7EE04100`, `start = *(base + ch * 0x100) = flags | 1`"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "stock bootloader and start4 `dma_memcpy` transfers with `--log dma`: every control block this boot uses has both ends in the `0x0` alias, and the destination is read straight back through a cached alias with no flush in between"
confidence = "high"
note       = "So a transfer at a cached alias is coherent with the VPU, and `--check-coherency` only counts one at `0xC000_0000` as going behind the caches. Marking every legacy-DMA write as uncached reports ~11k stale reads in a stock boot that works on silicon."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §4.2: 16 channels, channel 0 at `0x7E007000` and each next one `0x100` above it, four of them DMA Lite (7 to 10) and four DMA4 (11 to 14); channel 15 sits apart at `0x7EE05000` and is the VPU's alone"
confidence = "high"

[block.irq]
vpu     = { CH0 = 80, CH1 = 81, CH2 = 82, CH3 = 83, CH4 = 84, CH5 = 85, CH6 = 86, CH7_8 = 87, CH9_10 = 88, CH15 = 95 }
gic_spi = { CH0 = 80, CH1 = 81, CH2 = 82, CH3 = 83, CH4 = 84, CH5 = 85, CH6 = 86, CH7_8 = 87, CH9_10 = 88 }
notes   = "A channel's line is up while its `CS.INT` is, and the driver acknowledges by writing that bit back. Channels 0 to 6 have a line each; the four 'DMA lite' channels 7 to 10 share two. The VPU's own controller takes all sixteen, as sources 80 to 95 (`src/machine.rs`, `dma_irq_source`) — channel 15 out of order at 95, with `AUX` and `ARM` on 93 and 94 in between. Channels 11 to 14 are the DMA4 engines and their lines, 89 to 92, belong to that spec (`specs/dma4.toml`); channel 15 reaches the ARM on neither controller."

[[block.irq.source]]
kind       = "linux"
ref        = "`bcm2711.dtsi`: `dma-controller@7e007000` `interrupts = <GIC_SPI 80 ...>` through `<GIC_SPI 86 ...>`, then `87`, `87`, `88`, `88` for the `/* DMA lite 7 - 10 */` channels, named `dma0`..`dma10`"
confidence = "high"

[[block.irq.source]]
kind       = "linux"
ref        = "`bcm2835_dma_callback` (`drivers/dma/bcm2835-dma.c`) acknowledges with `writel(BCM2835_DMA_INT, c->chan_base + BCM2835_DMA_CS)`"
confidence = "high"

[[block.irq.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §6.2.4 Table 102: VC peripheral IRQs 16 to 22 are `DMA 0` to `DMA 6`, 23 `DMA 7 & 8`, 24 `DMA 9 & 10` and 31 `DMA 15` — VPU sources 80 to 88 and 95. IRQs 25 to 28 (sources 89 to 92) are the DMA4 channels 11 to 14"
confidence = "high"


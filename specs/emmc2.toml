access = "rw"
notes  = "Past the SDHCI registers. start4 clears bit 30 and sets bit 31 in the board clock set-up it runs once `config.txt` is read, right after `REG_154`, and goes on reading the card afterwards. Those writes depend on board feature bits (the helper at `0x3EC64902` tests one bit of a feature word). Meaning unknown."

[[register.source]]
kind       = "trace"
ref        = "pinned start4 reads it at `0x3ED4A1DE` and writes `0x80000000` at `0x3ED4A1E6`; just before: GPIO `+0xD0` <- 1, `REG_154` <- 1, and CM `EMMC2DIV` <- `0x7800`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "start4 `0x3ED4A1DE..0x3ED4A1E6`: `bitclear 30`, `bitset 31`; the path runs when feature bits `0x19` and `0x1C` are clear"
confidence = "high"

[[register]]
name   = "REG_154"
offset = 0x154
access = "rw"
notes  = "Past the SDHCI registers. start4 writes 1 here in its board clock set-up, between setting GPIO `+0xD0` bit 0 and `REG_100`. Meaning unknown."

[[register.source]]

[[register]]
name   = "CLOCK_CONTROL"
offset = 0x2C
access = "rw"
notes  = "Clock control (15:0), data timeout (19:16) and the self-clearing software resets (26:24). Before it releases the ARM, start4 leaves the host reset twice over: after its last read it sets `SRST_ALL` and then writes 0 (clock off); after clearing `INT_SIGNAL_EN` and `INT_STATUS_EN` and writing all ones to `INT_STATUS`, it sets `SRST_ALL`, then `SRST_CMD` and `SRST_DATA` together, polling each until it clears."

[[register.source]]
kind       = "standard"
ref        = "SDHCI 3.00, 2.2.14..2.2.16"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "pinned start4, host write helper `0x3EC52C2E` and read helper `0x3EC51F5E`: `0x010E0207`, 0 after the console handover; then `INT_SIGNAL_EN`, `INT_STATUS_EN` <- 0, `INT_STATUS` <- `0xFFFFFFFF`, `0x01000000`, `0x06000000` once the SD power pin lookup has failed"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "the real board prints `arasan_emmc_set_clock ... C1: 0x000e0047` (`sd-card-boot.log`)"
confidence = "high"


[block]
name    = "emmc2"
base    = 0x7E340000
size    = 0x1000
summary = "EMMC2: the SD host controller (Arasan SDHCI 3.00) the bootloader, start4 and Linux boot from"
notes   = "Command engine wired to a modelled card, with PIO, SDMA and ADMA2 (32-bit) data paths. Every register is a 32-bit word here; narrow accesses pick their lane."

[[block.source]]
kind       = "standard"
ref        = "SD Host Controller Simplified Specification 3.00, section 2 (register map)"
confidence = "high"

[[block.source]]
kind       = "datasheet"
ref        = "BCM2835 ARM Peripherals, EMMC chapter: the same Arasan layout at the older block"
confidence = "high"

[[block.source]]
kind       = "linux"
ref        = "`mmc@7e340000` driven by `sdhci-iproc`; `mmc0: SDHCI controller on fe340000.mmc using ADMA` on the reference board"
confidence = "high"


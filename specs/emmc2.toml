[[register]]
name   = "CMD_XFER"
offset = 0x0C
access = "rw"
notes  = "Transfer mode (low half) and command (high half). Writing the high half issues the command. The bootloader reads every run of sectors, one or many, with an open-ended `CMD18` (`0x123A0030`) and ends it with CMD12 as R1b (`0x0C1B0030`, the multi-block read mode kept). start4 reads a single sector with `CMD17` (`0x113A0010`) and a longer run with `CMD18`, ended by CMD12 with mode `0x10` (`0x0C1B0010`) and followed by CMD13. Neither sets `BLOCK_COUNT_EN` or `AUTO_CMD`."


[[register]]
name   = "INT_STATUS_EN"
offset = 0x34
access = "rw"
notes  = "Which interrupt conditions latch into `INT_STATUS`. The EEPROM bootloader writes `0x007E0037`, which leaves `ERR_CMD_TIMEOUT` out: with no card nothing latches, and it gives each command 100 ms before it gives up. Its probe is CMD0, CMD8 (`0x1AA`); on no answer it logs `EMMC` and tries CMD1 (`0x40100000`), resets the host (`SRST_ALL`, about 200 ms before the clock is set again, one `SD HOST` line) and tries CMD0 and CMD1 again, then once more CMD0 and CMD8, logs `SDV1` and sends CMD55, whose timeout ends the open (`SD CMD: 0x371a0010 (55) 0x0 0x1fff0000`, `Failed to open device`). Each reset is logged `SD retry N oc M`, 10 ms before it. After a failed open it resets `SRST_CMD` and `SRST_DAT`, then `SRST_ALL`, and with `SD_BOOT_MAX_RETRIES=1` opens once more about 300 ms later."

[[register.source]]
kind       = "standard"
ref        = "SDHCI 3.00, 2.2.19 / 2.2.20"
confidence = "high"

[[register.source]]

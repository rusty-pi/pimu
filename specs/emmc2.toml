[block]
name    = "emmc2"
base    = 0x7E340000
size    = 0x1000
summary = "EMMC2: the SD host controller (Arasan SDHCI 3.00) the bootloader, start4 and Linux boot from"
notes   = "Command engine wired to a modelled card, with PIO, SDMA and ADMA2 (32-bit) data paths. Every register is a 32-bit word here; narrow accesses pick their lane."


[[register]]
name   = "ARGUMENT"
offset = 0x08
access = "rw"
notes  = "Command argument. The two stock stages identify a card differently. The bootloader sends ACMD41 with `0x00100000` (3.2-3.3 V), plus bit 30 once CMD8 has been answered, then after CMD2, CMD3, CMD9 and CMD7 reads the SCR (ACMD51, with the card's RCA as argument) and asks SWITCH_FUNC in check mode for high speed only (`0x00000001`); it goes to 50 MHz and sends ACMD6 (`2`) without switching the card. start4 sends CMD8 with `0x155`, ACMD41 with `0x40200000`, then CMD2, CMD3, CMD9, CMD7, CMD13, ACMD42 (`0`), ACMD6 (`2`), ACMD51 (`0`), CMD6 `0x00FFFFF1` (check), CMD6 `0x80FFFFF1` (switch) and CMD16 (`0x200`)."


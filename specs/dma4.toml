[block]
name    = "dma4"
base    = 0x7E007B00
size    = 0x100
summary = "DMA4 (`dma40`) channel: the 40-bit DMA engine the bootloader and start4 use"
notes   = "Sits in channel 11's slot of the legacy controller (`dma`) and is decoded ahead of it. Its control blocks carry address bits 39:32 in `SRCI` / `DESTI`, which is how a 32-bit VPU reaches the PCIe window at `0x6_0000_0000`. Those addresses are CPU-physical, with no alias bits to say where an access lands, but the engine is behind the L2 like the legacy one."

[[block.source]]
kind       = "decompile"
ref        = "bootloader submit `0x0008b0xx` and status check `0x0008b3f4`"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "start4 dmalib: `dma_set_cs` `0x3EC98E7C`, `dma_chain_start` `0x3EC97544`, channel 11 for the xHCI takeover"
confidence = "high"

[block.parent]
name  = "dma"
notes = "Sits in channel 11's slot of the legacy controller and is decoded ahead of it."

[[block.parent.source]]
kind       = "decompile"
ref        = "start4 dmalib `dma_set_cs` `0x3EC98E7C` computes `0x7E007000 + ch * 0x100`; channel 11 is this 40-bit engine"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "stock bootloader USB boot: the control block it starts the channel with lives at `0xBEF6D4A0` — the `0x8000_0000` (L2) alias — and is rewritten before every transfer with no flush in between"
confidence = "high"
note       = "The firmware's own USB boot depends on the engine reading what the VPU left in the L2, so `--check-coherency` treats this channel as coherent. The word it DMAs a register into is still read back through `0xC000_0000` by both stock and ours, which is what makes that safe either way."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §4.6: the DMA4 engines have an uncoupled read/write design, reach the full 35-bit address bus and so bypass the `PAGE` / `PAGELITE` windows the other engines page through, and \"DMA channel 11 is additionally able to access the PCIe interface\""
confidence = "high"

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §4.2.1.2 Table 37: channel 11's registers are `CS` `0xB00`, `CB` `0xB04`, `DEBUG` `0xB0C`, then CB words `TI` `0xB10`, `SRC` `0xB14`, `SRCI` `0xB18`, `DEST` `0xB1C`, `DESTI` `0xB20`, `LEN` `0xB24`, `NEXT_CB` `0xB28` and `DEBUG2` `0xB2C`"
confidence = "high"

[block.irq]
vpu     = 89
gic_spi = 89
notes   = "Channel 11's completion. The four DMA4 channels 11 to 14 take their lines in order, 89 to 92, and the same number on both controllers."

[[block.irq.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §6.2.4 Table 102: VC peripheral IRQs 25 to 28 are `DMA 11` to `DMA 14`, VPU sources 89 to 92 and, 64 above the IRQ number again, `GIC_SPI 89` to `GIC_SPI 92`"
confidence = "high"

[[block.irq.source]]
kind       = "linux"
ref        = "`firmware/bcm2711-rpi-4-b.dtb` `/scb/dma@7e007b00`: `interrupts = <0x0 0x59 0x4>, <0x0 0x5a 0x4>, <0x0 0x5b 0x4>, <0x0 0x5c 0x4>`"
confidence = "high"

[[register]]
name   = "CS"
offset = 0x00
access = "rw"
notes  = "Control and status. A transfer starts when `ACTIVE` is set with a chain in `CB`, or `CB` is written while `ACTIVE`."

[[register.source]]
kind       = "decompile"
ref        = "bootloader sets bit 0 to start and polls `END` / `ACTIVE` / `ERROR` (`0x0008b3f4`)"
confidence = "high"

[[register.field]]
name  = "ACTIVE"
bits  = "0"
notes = "Channel running."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x0008b3f4`: success is `END` set, `ACTIVE` clear, `ERROR` clear"
confidence = "high"

[[register.field]]
name  = "END"
bits  = "1"
notes = "Chain finished."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x0008b3f4`"
confidence = "high"

[[register.field]]
name  = "INT"
bits  = "2"
notes = "Completion interrupt pending; set when a control block had `INTEN`."

[[register.field.source]]
kind       = "decompile"
ref        = "dmalib's `dma_interrupt` only services a channel with `CS & 4`"
confidence = "high"

[[register.field]]
name  = "ERROR"
bits  = "10"
notes = "Transfer failed."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x0008b3f4` returns -1 on bit 10"
confidence = "high"

[[register.field]]
name  = "BUSY"
bits  = "24"
notes = "Treated as 'still busy' alongside `ACTIVE`."

[[register.field.source]]
kind       = "decompile"
ref        = "`0x0008b3f4` tests bit 24 with `ACTIVE`"
confidence = "medium"

[[register]]
name   = "CB"
offset = 0x04
access = "rw"
notes  = "Control-block `address >> 5`. Null once the chain has run."

[[register.source]]
kind       = "decompile"
ref        = "bootloader writes the control-block `address >> 5`; `dma_chain_start` `0x3EC97544` writes only this"
confidence = "high"

[[register]]
name   = "DEBUG"
offset = 0x0C
access = "w1c"
notes  = "Error latch; the bootloader writes `0x400` to clear it before each transfer."

[[register.source]]
kind       = "decompile"
ref        = "bootloader submit path writes `DEBUG = 0x400` first"
confidence = "high"

[[register]]
name   = "NEXT_CB"
offset = 0x28
access = "rw"
notes  = "Word 6 of the control block the channel loaded: the address of the next one, or 0 to end the chain. The bootloader writes 0 here once, as it puts the channel away after its last transfer, and never reads it."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §4.2.1.2 Table 37: `11_NEXT_CB` at `0x7E007B28`, \"DMA4 Channel 11 CB Word 6\""
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "bootmain `0x0008B668`: `0x00000000` to `0x7E007B28`, the only access to the word in a boot"
confidence = "high"
note       = "recorded as `REG_28`, meaning unknown, until the datasheet named it"

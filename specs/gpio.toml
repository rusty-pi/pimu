[[register]]
name   = "GPEDS"
offset = 0x40
count  = 2
stride = 4
access = "w1c"
reset  = 0
notes  = "Edge / level detect status, one bit a pin, cleared by writing 1, and the two interrupt lines follow it. A level detect re-latches its bit for as long as the pin sits at that level, so clearing it there only holds until the next access. A detector watches the pad, so a pin the firmware drives itself is detected like any other — that part is the model's reading of the block, not something a boot has shown."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §5.2 (GPIO): `GPEDS0` / `GPEDS1`"
confidence = "high"


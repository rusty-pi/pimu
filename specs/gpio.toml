[block]
name    = "gpio"
base    = 0x7E200000
size    = 0x1000
summary = "The 58 GPIO pins: function select, output latch, pin levels, edge detect and the BCM2711 pull control"
notes   = "Pins 0..57, in two banks of 32. Every register but `GPFSEL` is a pair (`0` for pins 0..31, `1` for 32..57), and the model keeps a function, an output latch and a termination per pin. A `GPLEV` bit is the output latch for a pin whose function is `output`, and the termination otherwise — pull-up reads 1, pull-down and no pulling read 0 — because nothing outside the model drives a pin. A pin the firmware drives itself does move, though, so the detect enables work: an edge or a level latches `GPEDS` and raises the bank's interrupt line. What each pin is wired to is the board's, not the chip's: `src/periph/gpio.rs` carries that map for the 4B, the CM4 and the Pi 400, and the `gpio` log channel names the pin it reports. Which pins are muxed also decides what two masters reach: SPI0 the boot flash (GPIO 40..43 on ALT4, `specs/spi0.toml`) and I²C 0 the 40-pin header (GPIO 0/1 on ALT0, `specs/bsc.toml`)."

[[block.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, chapter 5 (General Purpose I/O)"
confidence = "high"

[[block.source]]
kind       = "linux"
ref        = "`gpio@7e200000`, `brcm,bcm2711-gpio`, `reg = <0x7e200000 0xb4>`, 58 `gpio-line-names` (`firmware/bcm2711-rpi-4-b.dtb`); driven by `pinctrl-bcm2835`"
confidence = "high"

[[block.source]]
kind       = "measured"
ref        = "the whole window read through `/dev/gpiomem` on a Raspberry Pi 4B d03115 running Linux: `GPFSEL2` `0x12000000` (GPIO 28/29 on ALT5, the RGMII MDIO bus), `GPFSEL3` `0x3fffffff` (30..39 on ALT3, Bluetooth and the WiFi SDIO), `GPFSEL4` `0x64` (40/41 on ALT0, 42 an output), `GPLEV0` `0x1000c1ff`, `GPLEV1` `0x38fb`, every edge-detect register 0"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "start4's GPIO driver: function select `FUN_0ecc94f8` (`&DAT_7e200000 + reg * 4`, three bits a pin), level `FUN_0ecc7fca` / `FUN_0ecc9478` (`GPSET`/`GPCLR`, pins up to `0x39`), pull `FUN_0ecc95ec` (the 2835 `GPPUD` path, `vcfw/drivers/chip/vciv/2708/gpio.c`) or `FUN_0ecc9762` -> `FUN_0ecc83e4(&DAT_7e2000e4, pin, pull)` (the BCM2711 one, which is what a Pi 4 takes)"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "a `firmware-boot` run touches `GPFSEL0`..`GPFSEL4`, `GPSET1`, `GPCLR1`, `PIN_MUX`, `PAD_CFG` and all four `PUP_PDN` registers, and nothing else in the window: no `GPLEV`, no edge detect and no legacy pull register"
confidence = "high"

[block.irq]
vpu     = { BANK0 = 113, BANK1 = 114, BANK1_MIRROR = 115, ANY = 116 }
gic_spi = { BANK0 = 113, BANK1 = 114, BANK1_MIRROR = 115, ANY = 116 }
notes   = "Four lines, up while a pin they cover has its `GPEDS` bit latched: one a bank, and an 'any bank' line. The block is built for three banks and this SoC fills two, so bank 1's output is mirrored onto the third bank's line as well — a bank 0 edge raises `BANK0` and `ANY`, a bank 1 edge raises `BANK1`, `BANK1_MIRROR` and `ANY`. The VPU's own controller takes the same four as sources 113 to 116 (`64 + GPU IRQ`, as for `systimer` and `uart0`), and a firmware that wants an edge while the ARM is down enables `ANY` there. Nothing outside the model drives a pin, so the only edges are the ones the firmware makes itself — driving an output, or moving the termination of an input — and no firmware in a boot enables a detector, so the lines have yet to go up in a run."

[[block.irq.source]]
kind       = "linux"
ref        = "`bcm2711.dtsi`: `&gpio { interrupts = <GIC_SPI 113 ...>, <GIC_SPI 114 ...>, <GIC_SPI 115 ...>, <GIC_SPI 116 ...> }`, and the `bcm283x.dtsi` comment above the node for which bank reaches which line"
confidence = "high"

[[block.irq.source]]
kind       = "linux"
ref        = "`gpio@7e200000`, `interrupts = <GIC_SPI 0x71 IRQ_TYPE_LEVEL_HIGH>, <GIC_SPI 0x72 IRQ_TYPE_LEVEL_HIGH>` (`firmware/bcm2711-rpi-4-b.dtb`)"
note       = "The device tree the pinned firmware carries names only the two bank lines; the kernel tree it came from names all four."
confidence = "high"

[[block.irq.source]]
kind       = "inferred"
ref        = "VPU sources 113 to 116: the legacy blocks' VPU source and `GIC_SPI` number are both `64 + GPU IRQ` (`systimer` 64 to 67, `uart0` 121, `emmc` 126), and the GPIO lines are GPU IRQs 49 to 52"
note       = "Not seen in a trace: no boot enables a detector, so no line has been observed on either controller."
confidence = "medium"

[[block.irq.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §6.2.4 Table 102: VC peripheral IRQs 49 to 52 are `GPIO 0` to `GPIO 3`, VPU sources 113 to 116"
confidence = "high"
note       = "Confirms the inference above; which bank reaches which line is still the Linux binding’s, not the table’s."

[[register]]
name   = "GPFSEL"
offset = 0x00
count  = 6
stride = 4
access = "rw"
reset  = 0
notes  = "Function select, three bits a pin, ten pins a register: 0 input, 1 output, 4 ALT0, 5 ALT1, 6 ALT2, 7 ALT3, 3 ALT4, 2 ALT5. `GPFSEL5` holds pins 50..57; the eighteen bits above them read 0. The firmware rewrites `GPFSEL4` constantly, because GPIO 40..43 carry both the SPI NOR flash on ALT4 (`specs/spi0.toml`) and, on a 4B, PWM audio on 40/41 and the activity LED as an output on 42."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §5.2 (GPIO): `GPFSEL0`..`GPFSEL5`"
confidence = "high"

[[register.source]]
kind       = "trace"
ref        = "start4 puts GPIO 0/1 on ALT0 for the HAT EEPROM (`GPFSEL0` <- `0x4`, then `0x24`, at `0x3ECC9562`) and 14/15 on ALT0 for the console (`GPFSEL1` `0x24000`)"
confidence = "high"

[[register]]
name   = "GPSET"
offset = 0x1C
count  = 2
stride = 4
access = "w"
reset  = 0x6770696F
notes   = "Write 1 to drive a pin high; a 0 bit does nothing. A read answers `0x6770696f` — `\"gpio\"`, the block's own tag — which is what the `reset` here records. The EEPROM bootloader reads the register before it writes it (`ld r3, [r1+32]; bitset r3, #10; st r3, [r1+32]` at `0x8000A706`, the activity LED on GPIO 42), so on a real board it writes `0x67706d6f` and the stray bits do nothing because those pins are not outputs."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §5.2 (GPIO): `GPSET0` / `GPSET1`"
confidence = "high"


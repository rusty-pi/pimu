[[register]]
name   = "PUP_PDN"
offset = 0xE4
count  = 4
stride = 4
access = "rw"
notes  = "The BCM2711 pull control: two bits a pin, sixteen pins a register — 0 no pulling, 1 pull-up, 2 pull-down, 3 reserved. `PUP_PDN3` holds pins 48..57. This is the register the firmware actually uses, and the one a `GPLEV` bit falls back on for a pin that is not an output. The four words come out of reset with a pull on nearly every pin rather than at 0, which is why there is no `reset` here: they are `0xAAA95555`, `0xA0AAAAAA`, `0x50AAA95A` and `0x00055555` in `PUP_PDN_RESET` (`src/periph/gpio.rs`)."

[[register.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §5.2 Tables 90 to 93 (`GPIO_PUP_PDN_CNTRL_REG0`..`REG3`), each pin’s field with its own reset value; §5.3 Table 94 gives the same as a `Pull` column — pins 0 to 8 up, 9 to 27 down, 28 and 29 none, 30 to 33 down, 34 to 36 up, 37 to 43 down, 44 and 45 none, 46 to 57 up"
confidence = "high"
note       = "release 4 of the datasheet corrected these reset values; earlier releases are not to be trusted for them. They are the power-on state, not what a running board holds — the measured words below were read after the firmware and Linux had set their pulls."

[[register.source]]
kind       = "measured"
ref        = "`/dev/gpiomem` on a Raspberry Pi 4B d03115: `REG0` `0x4aa95555` — GPIO 0..7 at `0b01`, the pull-ups the ID EEPROM and I²C 1 lines need — `REG1` `0x19aaaaaa`, `REG2` `0x55505544`, `REG3` `0xaaaaa`"
confidence = "high"

[[register.source]]

[[register]]
name   = "PIN_MUX"
offset = 0xD0
access = "rw"
reset  = 0
notes  = "Undocumented, and the firmware writes it on every boot. Bit 1 routes the SD card slot: set for the legacy EMMC controller at `0x7E300000`, clear for EMMC2 — which is what the model acts on. Bit 0 is the first thing start4's Ethernet pin setup does, before it puts GPIO 28/29 on ALT5 (the RGMII MDIO bus) and terminates 46..57, and a running board reads `1`: it looks like the RGMII pad bank, but nothing proves that, and the model only stores the bit."

[[register.source]]
kind       = "decompile"
ref        = "start4db `FUN_0ed0fd54`, whose neighbours assert out of `tools/bootrom/rpiboot/genet.c`: `_DAT_7e2000d0 | 1` first, then GPIO 28/29 to function 2 (ALT5), 28 pulled up and 29 down (the driver's pull enum is the BCM2835 one, 1 down / 2 up), then 46..57 pulled down. Elsewhere `_DAT_7e2000d0 & 0xfffffffd | 1`, and `& 0xfffffffd` before EMMC2 is used"
confidence = "medium"

[[register.source]]
kind       = "trace"
ref        = "pieeprom-2020-09-03 writes `0x2` right before it drives the legacy EMMC and never touches EMMC2 (#66); the 2026 bootloader never writes the register; start4 sets bit 0 at `0x3ED4A1CE` and boots from EMMC2"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "`/dev/gpiomem` on a Raspberry Pi 4B d03115 booted from an SD card: `0xd0` reads `0x00000001`"

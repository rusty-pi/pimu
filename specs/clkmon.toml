[block]
name    = "clkmon"
base    = 0x7D5D0000
size    = 0x10000
summary = "VPU clock block (PLLs and frequency monitors) below the 0x7E window"
notes   = "The AVS monitor (`avs`, +0x2000) and the PVT monitors (`pvt`, +0x8000) sit inside this window and are decoded ahead of it. A full traced boot touches no PLL divider or lock register here; the registers below are the complete list outside the two sub-blocks, and all are plain storage with the password byte masked."

[[block.source]]
kind       = "decompile"
ref        = "start4's clock manager uses this block when the SoC-type switch at 0x3EC635F0 sets [gp+5476] = 1 (BCM2711)"
confidence = "high"

[[block.source]]
kind       = "trace"
ref        = "RVF_TRACE_MMIO=0x7d5d0000-0x7d5e0000 over a boot to arm_loader"
confidence = "high"

[[register]]
name   = "REG_1800"
offset = 0x1800
access = "rw"
notes  = "FUN_0ec2ffb4 sets bit 2 from the measured core voltage."

[[register.source]]
kind       = "decompile"
ref        = "FUN_0ec2ffb4"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "0x00000004 on rpi-dev (post-start4 state)"
confidence = "high"

[[register]]
name   = "REG_1814"
offset = 0x1814
access = "rw"
notes  = "FUN_0ec2ffdc tests (reg & 0x14) != 0 as the condition of a voltage-ramp loop. Hardware reads 0x16; the model keeps 0 ('settled'), because nothing in that loop writes the register and a constant 'true' would never exit."

[[register.source]]
kind       = "decompile"
ref        = "FUN_0ec2ffdc, loop in FUN_0ec303e8 behind a FUN_0ec30196() != 0 guard"
confidence = "high"

[[register.source]]
kind       = "measured"
ref        = "0x00000016 on rpi-dev"
confidence = "high"
note       = "deliberately not reproduced; see notes"

[[register]]
name   = "REG_1820"
offset = 0x1820
access = "rw"
notes  = "FUN_0ec30196 takes bit 10 as a predicate and FUN_0ec301a6 decodes bits 23:11. Reads 0 on hardware too: not a blanked status register."

[[register.source]]
kind       = "decompile"

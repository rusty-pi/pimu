[block]
name    = "mbox"
base    = 0x7E00B880
size    = 0x140
summary = "ARM <-> VideoCore mailboxes: two views of the same pair of FIFOs, and the interrupt block between them"
notes   = "Every mailbox register is a two-element array `0x100` apart: element 0 is the ARM's view (what Linux's device tree names), element 1 the VPU's (what start4 drives). The two views are mirror images: the ARM posts requests into MAIL1 and reads replies from MAIL0, the VPU the other way round. The pending words sit in a block at `+0xC0` between the views."

[[block.source]]
kind       = "linux"
ref        = "`mailbox@7e00b880`, `brcm,bcm2835-mbox`, `reg = <0x7e00b880 0x40>`; confirmed in the reference board's `/proc/device-tree`"
confidence = "high"

[[block.source]]
kind       = "decompile"
ref        = "start4's receive op `0x3EC5AC0C` loads `0x7E00B980` as a literal; its ISR `0x3EC58302` reads `0x7E00B940`"
confidence = "high"

[block.irq]
vpu     = 94
gic_spi = 33
notes   = "The VPU takes the line the ARM's requests arrive on; the ARM takes the one the replies arrive on."

[[block.irq.source]]
kind       = "decompile"
ref        = "start4's handler table: `src 94 handler=0x3ec58302`"
confidence = "high"

[[block.irq.source]]
kind       = "measured"
ref        = "Raspberry Pi 4B d03115: Linux binds id 65 for the firmware mailbox (`/proc/interrupts`, and the dtb node's `interrupts`)"
confidence = "medium"
note       = "Recorded as `ID_MAILBOX` in `src/periph/gic.rs` before this key existed."

[[block.irq.source]]
kind       = "datasheet"
ref        = "BCM2711 ARM Peripherals, §6.2.4 Table 102: VC peripheral IRQ 30 is `ARM`, the VPU's source 94. §6.3 Figure 7 puts the ARMC peripheral IRQs on GIC SPI ids 64 to 79, so the ARM side's `GIC_SPI 33` is id 65"
confidence = "high"

[[register]]
name   = "DATA0"
offset = 0x00
count  = 2
stride = 0x100
access = "rw"
notes  = "MAIL0 data: the VPU writes replies, the ARM reads them."

[[register.source]]
kind       = "linux"
ref        = "`bcm2835-mailbox.c` reads replies at `+0x00`"
confidence = "high"

[[register]]
name   = "PEEK0"
offset = 0x10
count  = 2
stride = 0x100
access = "r"
notes  = "MAIL0 head, without popping it."

[[register.source]]
kind       = "linux"
ref        = "`bcm2835-mailbox.c` register list (`MAIL0_PEEK`)"
confidence = "medium"

[[register]]
name   = "SENDER0"
offset = 0x14
count  = 2
stride = 0x100
access = "rw"
notes  = "MAIL0 sender tag."

[[register.source]]
kind       = "linux"
ref        = "`bcm2835-mailbox.c` register list (`MAIL0_SENDER`)"
confidence = "medium"

[[register]]
name   = "STATUS0"
offset = 0x18
count  = 2
stride = 0x100
access = "r"
notes  = "MAIL0 FIFO state. `STATUS1` has the same layout."

[[register.source]]
kind       = "linux"
ref        = "`bcm2835-mailbox.c`: `ARM_MS_FULL` / `ARM_MS_EMPTY`"
confidence = "high"

[[register.field]]
name  = "EMPTY"
bits  = "30"
notes = "Nothing queued."

[[register.field.source]]
kind       = "decompile"
ref        = "receive op `0x3EC5AC0C` tests bit 30 of the status word"
confidence = "high"

[[register.field]]
name  = "FULL"
bits  = "31"
notes = "No room for another word; the FIFOs are 8 deep."

[[register.field.source]]
kind       = "linux"
ref        = "`bcm2835-mailbox.c`: `ARM_MS_FULL`"
confidence = "high"

[[register]]
name   = "CONFIG0"
offset = 0x1C
count  = 2
stride = 0x100
access = "rw"
notes  = "MAIL0 interrupt enables and pending flags. `CONFIG1` has the same layout. A pending flag is its condition AND its enable, not the raw condition."

[[register.source]]
kind       = "linux"
ref        = "`bcm2835-mailbox.c` sets `ARM_MC_IHAVEDATAIRQEN` (bit 0) at `+0x1C`"
confidence = "high"

[[register.source]]
kind       = "decompile"
ref        = "ISR `0x3EC58302` reads `0x7E00B9BC`, releases the receive lock on bit 4 and the send lock on bit 6, writes the rest back"
confidence = "high"

[[register.field]]
name  = "EN_HAVE_DATA"
bits  = "0"
notes = "Interrupt while this mailbox has data."

[[register.field.source]]
kind       = "linux"
ref        = "`bcm2835-mailbox.c`: `ARM_MC_IHAVEDATAIRQEN`"
confidence = "high"

[[register.field]]
name  = "EN_HAVE_SPACE"
bits  = "1"
notes = "Interrupt while this mailbox has room."

[[register.field.source]]
kind       = "inferred"
ref        = "the enable matching pending bit 5"
confidence = "medium"

[[register.field]]
name  = "EN_OPP_EMPTY"
bits  = "2"
notes = "Interrupt while the opposite mailbox is empty: how a sender waits for the far side to drain."

[[register.field.source]]
kind       = "decompile"
ref        = "send op arms it; ISR `0x3EC58302` releases the send lock on the matching pending bit 6"
confidence = "medium"

[[register.field]]
name   = "CLEAR"
bits   = "3"
access = "w"
notes  = "Flush this mailbox's FIFO. Does not latch."

[[register.field.source]]
kind       = "decompile"
ref        = "the driver's init writes 8, then 1, to `CONFIG1`"
confidence = "medium"

[[register.field]]
name   = "PEND_HAVE_DATA"
bits   = "4"
access = "r"
notes  = "`EN_HAVE_DATA`'s condition is true."

[[register.field.source]]
kind       = "decompile"
ref        = "ISR `0x3EC58302`: bit 4 releases the `mbox_read` task's lock `gp+243076`"
confidence = "high"

[[register.field]]
name   = "PEND_HAVE_SPACE"
bits   = "5"
access = "r"
notes  = "`EN_HAVE_SPACE`'s condition is true."

[[register.field.source]]

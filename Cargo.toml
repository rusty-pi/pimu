[package]
name = "pimu"
# Not the released version: that is the git tag the release workflow runs on,
# and it is what the packages and the container image are named after. Nothing
# reads `CARGO_PKG_VERSION`, so this stays put and a release needs no commit.
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
description = "A virtual bench for Raspberry Pi VideoCore boot firmware (start4.elf, fixup4.dat, pieeprom.bin)"
license = "MIT"
publish = false

[[bin]]
name = "pimu"
path = "src/cli/main.rs"

[dependencies]
anyhow = "1"
hmac = "0.12"
schemars = "1"
serde = { version = "1", features = ["derive"] }
# `deserialize_in_place`: a snapshot loads into a machine built as usual (`src/snap.rs`).
serde_derive = { version = "1", features = ["deserialize_in_place"] }
serde_json = "1"
# The snapshot format (`src/snap.rs`): binary, and maps keyed by anything.
bincode = "1.3"
sha1 = "0.10"
toml = "0.8"
yaml_serde = "0.10.7"

[features]
default = ["repo"]

# The run-loop diagnostics: the per-step `PIMU_*` switches and `--trace*`
# (docs/diagnostics.md). Off by default, so every normal build — CI's included —
# has those checks compiled out instead of paying a branch per instruction.
# `cargo build --release --features diag` for an investigation.
diag = []

# The commands that only mean something inside a checkout of this repository:
# `run`, `run-all` and `spec-docs`. They read golden transcripts from
# `testdata/`, and `spec-docs` rewrites `docs/` through the build-time
# `CARGO_MANIFEST_DIR`, so a published binary cannot run them at all. On by
# default for repository work; the release build passes
# `--no-default-features`.
repo = []

# A native JIT for the ARM cores' straight runs (`src/arm/jit.rs`), on
# Cranelift. Off by default while it is young; `PIMU_NO_JIT=1` turns it off in
# a build that has it.
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]

[build-dependencies]
# build.rs generates the register constants in src/spec/ from specs/*.toml.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1

# The interpreter hot loop is unusably slow in a plain debug build once we get to
# real firmware, so give the dev profile some optimisation while keeping asserts.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranelift-codegen = { version = "0.137", optional = true }
cranelift-frontend = { version = "0.137", optional = true }
cranelift-jit = { version = "0.137", optional = true }
cranelift-module = { version = "0.137", optional = true }
cranelift-native = { version = "0.137", optional = true }

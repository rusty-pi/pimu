# `aarch64/` is the bare-metal `-kernel` frontend (issue #32 stage 2). It is a
# workspace member so it shares the lockfile and stays visible to `cargo fmt`,
# but `default-members` keeps it out of `cargo build`/`test`/`clippy` at the
# root: it only builds for `aarch64-unknown-none`. Build it with
# `scripts/qemu-kernel.sh` or `cargo build --manifest-path aarch64/Cargo.toml`.
[workspace]
members = ["aarch64"]
default-members = ["."]

[package]
name = "rpi-virt-fw"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "A virtual bench for Raspberry Pi VideoCore boot firmware (start4.elf, fixup4.dat, pieeprom.bin)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1

# The interpreter hot loop is unusably slow in a plain debug build once we get to
# real firmware, so give the dev profile some optimisation while keeping asserts.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The bt-boot card with the WiFi driver on it: `brcmfmac` and what it needs
# (`cfg80211`, `brcmutil`, `rfkill`, and the `cyw` vendor half the kernel
# fetches by itself) as modules under /lib/modules, and the CYW43455's own
# firmware, CLM blob and Pi 4B nvram under /lib/firmware/brcm.
# `scripts/fetch-firmware.sh` fetches both, and
# `BRCMFMAC=1 scripts/make-sd.sh firmware/sd-brcmfmac.img` writes the card.
# `rpi-virt-fw boot-check testdata/boot/wifi-boot.toml` runs it, and so does
# CI.
#
# Config and console are bt-boot's: no `dtoverlay=disable-wifi`, so the
# `mmcnr@7e300000` node is live and the chip's SDIO side answers on the legacy
# EMMC host, and no `dtoverlay=disable-bt`, so Linux talks on the mini-UART.
# The modules are typed in at the busybox prompt rather than loaded by an
# init script, so the transcript shows what each one printed.
#
# WHERE THE DRIVER STOPS
#
# `brcmfmac` now walks the whole chip and downloads its firmware, and stops
# where the chip would have to start answering for itself:
#
#   brcmfmac: F1 signature read @0x18000000=0x10064345
#   brcmfmac: brcmf_fw_alloc_request: using brcm/brcmfmac43455-sdio for chip BCM4345/6
#   brcmfmac: brcmf_sdio_bus_rxctl: resumed on timeout
#   brcmfmac: brcmf_sdio_readshared: invalid sdpcm_shared address 0xFE4B01B4
#   ieee80211 phy0: brcmf_attach: dongle is not responding: err=-110
#
# What ran before that stop:
#
#   1. The chip-id word at backplane `0x18000000` reads `0x10064345`: a
#      BCM4345 revision 6 on an AXI backplane, which is the pair the driver's
#      own firmware table maps to `brcmfmac43455-sdio`.
#   2. The driver walks the enumeration table the chipcommon core points at
#      and finds the chipcommon, SDIO, ARM CR4 and 802.11 cores, then sizes
#      the ARM's memory out of the CR4 core: 768 KiB at `0x198000`.
#   3. It writes the 609309-byte firmware image there and the nvram at the top
#      of it, and takes the ARM out of reset through the core's wrapper.
#   4. Then it asks the firmware for `bus:txglomalign` and waits. Nothing
#      answers, because nothing in the model runs that firmware: the ARM comes
#      out of reset and executes nothing, and function 2 — the frame FIFO the
#      SDPCM handshake goes over — is not modelled.
#
# `invalid sdpcm_shared address 0xFE4B01B4` is the same thing said from the
# other end, and it is worth reading twice: having given up, the driver reads
# the word at the very top of the chip's memory, where the running firmware
# would have left a pointer to its shared block. What it gets back is the last
# word of the nvram *it* wrote there — `brcmf_fw_nvram_strip` ends the image
# with the length in the low half and its complement in the high half, and
# `0x01B4` = 436 words = the 1744 bytes of nvram this card carries. So the
# download went in and reads back, and only the chip's own side is missing.
#
# `cfg80211: failed to load regulatory.db` is expected: the card carries the
# chip's firmware, not linux-firmware's regulatory database, and nothing here
# needs a regulatory domain.

name = "wifi-boot"
description = "The stock-config boot with brcmfmac loaded by hand, pinning where the driver stops against the modelled CYW43455."

[boot]
eeprom = "../../firmware/pieeprom.bin"
sd = "../../firmware/sd-brcmfmac.img"
until = "/ # "
wall_secs = 600
max_skipped = 0

# Where the modules are, once, so the prompt stays `/ # ` for every send that
# follows: a `cd` would change it and the next `after` would never match.
[[boot.input]]
after = "/ # \u001b[6n"
text = "M=/lib/modules/$(uname -r)/kernel\n"

# `cfg80211` needs `rfkill`, which is a module in this kernel too.
[[boot.input]]
after = "/ # \u001b[6n"
text = "insmod $M/net/rfkill/rfkill.ko\n"

[[boot.input]]
after = "/ # \u001b[6n"
text = "insmod $M/net/wireless/cfg80211.ko\n"

[[boot.input]]
after = "/ # \u001b[6n"
text = "insmod $M/drivers/net/wireless/broadcom/brcm80211/brcmutil/brcmutil.ko\n"

# The one that matters, and everything after it on one line. Its probe runs
# inside this `insmod`, because the SDIO device is already on the bus, but the
# firmware download and the handshake that follows are a worker's, so the
# prompt comes back long before the driver is finished: hence the `sleep`,
# which is over three times what the run needs (the driver gives up 2.7 s
# after the `insmod`).
#
# One line rather than four because the prompt is what every send waits for,
# and a `printk` from another core lands in the middle of it often enough to
# matter: the kernel and the shell write the same UART a byte at a time, and
# an interleaved prompt matches nothing. After this line the kernel has said
# everything it is going to.
[[boot.input]]
after = "/ # \u001b[6n"
text = "insmod $M/drivers/net/wireless/broadcom/brcm80211/brcmfmac/brcmfmac.ko; sleep 9; ip link; dmesg | tail -24\n"

[golden]
path = "golden/wifi-boot.txt"

[[milestone]]
why = "The card is bt-boot's, so the console is the mini-UART and the WiFi SDIO host is live."
line = "mmc1: new high speed SDIO card at address 0001"

[[milestone]]
why = "The root filesystem carries /lib/modules: `insmod` found cfg80211 and the kernel took it, vermagic and all, which is what says the modules match the kernel8.img at the pinned firmware ref."
line = "cfg80211: Loading compiled-in X.509 certificates for regulatory database"

[[milestone]]
why = """
`brcmfmac` matched the card — the CIS gives vendor `0x02d0` device `0xa9a6`
(`SDIO_DEVICE_ID_BROADCOM_CYPRESS_43455`), which is in the driver's SDIO
table — and the first thing it does with it lands: `CMD53` reads the
chipcommon chip-id word through the backplane window at function 1 offset
`0x8000`. `0x10064345` is chip `0x4345` revision 6 on an AXI backplane."""
line = "brcmfmac: F1 signature read @0x18000000=0x10064345"

[[milestone]]
why = """
Chip recognition is through: the driver walked the enumeration table, found a
CPU core and the SDIO and chipcommon cores it needs, sized the ARM's memory,
and got as far as naming the firmware it wants. `BCM4345/6` is the chip id
and revision the model answers with, and `brcmf_fw_alloc_request` maps that
pair through the driver's own table to `brcmfmac43455-sdio`, which is the
blob the card carries."""
line = "brcmfmac: brcmf_fw_alloc_request: using brcm/brcmfmac43455-sdio for chip BCM4345/6"

[[milestone]]
why = """
The firmware loader was asked for the blob, which is what says the driver got
past chip recognition. The per-board name is a symlink in firmware-nonfree and
not a file the card carries, so this first request fails and the driver falls
back to the plain `brcmfmac43455-sdio.bin`, which does load — a failure to
load *that* would say so on a line of its own."""
line = "Direct firmware load for brcm/brcmfmac43455-sdio"

[[milestone]]
why = """
Where the bring-up stops now: the firmware and the nvram are in the chip's
memory and the ARM is out of reset, so the driver sends its first control
frame — the `bus:txglomalign` iovar — and waits for the chip's firmware to
answer. Nothing in the model runs that firmware, so it does not."""
line = "brcmfmac: brcmf_sdio_bus_rxctl: resumed on timeout"

[[milestone]]
why = """
The same stop from the other side, and the proof the download landed: the
driver reads the top word of the chip's memory, where a running firmware
would have left the address of its shared block, and gets back the last word
of the nvram it wrote there itself — 436 words in the low half and their
complement in the high half, which is the 1744 bytes of nvram this card
carries."""
line = "brcmfmac: brcmf_sdio_readshared: invalid sdpcm_shared address 0xFE4B01B4"

[[milestone]]
why = "And the driver's own summary of it: the chip took everything it was given and never said anything back."
line = "brcmf_attach: dongle is not responding: err=-110"

[[milestone]]
why = "Only the GENET is up: no `wlan0` until the chip answers its side of the bring-up."
line = "2: eth0: <BROADCAST,MULTICAST> mtu 1500 qdisc noop qlen 1000"

[[milestone]]
why = "What a finished bring-up would add to `ip link`, and what this scenario is here to see appear."
line = "wlan0"
absent = true

[[milestone]]
why = "No panic on the way: a failed probe is a failed probe, not a dead kernel."
line = "Kernel panic"
absent = true

[[milestone]]
why = "No oops: a kernel fault would point at the interpreter or a device model."
line = "Unable to handle kernel"
absent = true

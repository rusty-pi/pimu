# The linux-bt card with the WiFi driver on it: `brcmfmac` and what it needs
# (`cfg80211`, `brcmutil`, `rfkill`, and the `cyw` vendor half the kernel
# fetches by itself) as modules under /lib/modules, and the CYW43455's own
# firmware, CLM blob and Pi 4B nvram under /lib/firmware/brcm.
# `scripts/fetch-firmware.sh` fetches both, and
# `BRCMFMAC=1 scripts/make-sd.sh firmware/sd-brcmfmac.img` writes the card.
# `pimu boot-check testdata/boot/linux-wifi.toml` runs it, and so does
# CI.
#
# Config and console are linux-bt's: no `dtoverlay=disable-wifi`, so the
# `mmcnr@7e300000` node is live and the chip's SDIO side answers on the legacy
# EMMC host, and no `dtoverlay=disable-bt`, so Linux talks on the mini-UART.
# The modules are typed in at the busybox prompt rather than loaded by an
# init script, so the transcript shows what each one printed.
#
# WHAT IT GETS TO
#
# A network interface that is registered, brought up, and scanned with.
# `brcmfmac` walks the chip, downloads its firmware, and then talks to it —
# and what answers is the model, not the image it just wrote:
#
#   brcmfmac: brcmf_c_preinit_dcmds: Firmware: BCM4345/6 pimu model firmware (no radio) version 0
#   3: wlan0: <BROADCAST,MULTICAST> mtu 1500 qdisc noop qlen 1000
#       link/ether 02:00:5e:00:57:01 brd ff:ff:ff:ff:ff:ff
#   3: wlan0: <NO-CARRIER,BROADCAST,MULTICAST,UP> mtu 1500 qdisc pfifo_fast qlen 1000
#   BSS 02:00:5e:00:53:04(on wlan0)
#           SSID: pimu-model-ap
#           DS Parameter set: channel 1
#
# The chip's side of that conversation is `src/periph/sdpcm.rs`: the frame
# protocol over SDIO function 2, and the control protocol inside it. The ARM
# the driver takes out of reset still executes nothing; what the driver is
# talking to is a stand-in that answers the questions `brcmf_bus_started`
# asks on the way to registering an interface, and answers them as itself —
# hence the firmware version, which says where it came from.
#
# `UP` and `NO-CARRIER` together is exactly as far as an interface with no
# radio behind it goes. Bringing one up is `brcmf_netdev_open` (`core.c:601`)
# and then `brcmf_cfg80211_up` (`cfg80211.c:7878`), and that is a straight
# run of commands on the control channel — `BRCMF_C_UP`, the power-save
# mode, the roaming settings, `BRCMF_C_SET_INFRA`, `BRCMF_C_SET_FAKEFRAG`,
# each answered — with no firmware event waited for anywhere in it. Then
# `netif_carrier_off`, because nothing has associated the interface with
# anything, and only an association turns the carrier on.
#
# THE NETWORK IS INVENTED
#
# `pimu-model-ap` at `02:00:5e:00:53:04` is not a place and was never
# on the air. It is named after the model so that a scan result can never be
# mistaken for one taken off a real band, and the address is the next one
# along from the three the model already has — all of them locally
# administered and out of the documentation range in RFC 7042 section 2.1.2.
# `src/periph/sdpcm.rs` is where it is defined and where that is written
# down. The chip reports it after a dwell on each channel, because a scan
# that answered instantly would beat `iw` to the socket it waits for the
# completion on.
#
# What is *not* there:
#
#   1. No radio. The scan finds what the model made up, and nothing
#      associates, so the carrier never comes on and nothing is ever
#      carried. A packet the host tries to transmit is taken off the data
#      channel and goes nowhere. The `events` and `scans` lines in
#      `--- device state ---` are the count of what the chip said unasked.
#   2. One band, thirteen 20 MHz channels, and no HT or VHT. A real 43455 is
#      dual-band 802.11ac, and a real scan of a real band finds more than
#      one network and finds a different set every time.
#   3. The chip's own address is invented too. A real 43455 has a unique one
#      fused into the part; the model comes up with a locally-administered
#      address from the documentation range, the same range the OTP Ethernet
#      MAC and the Bluetooth chip's address come from. The address `wlan0`
#      ends up with is not that one anyway: the card's nvram carries a
#      `macaddr=` line and the chip's firmware takes it, which is what the
#      `cyw43455` line in `--- device state ---` says.
#
# `cfg80211: failed to load regulatory.db` is expected: the card carries the
# chip's firmware, not linux-firmware's regulatory database, and nothing here
# needs a regulatory domain.

name = "linux-wifi"
description = "The stock-config boot with brcmfmac loaded by hand, up to the network interface it registers against the modelled CYW43455."

[boot]
eeprom = "../../firmware/pieeprom.bin"
bootconf = ["BOOT_UART=1"]
sd = "../../firmware/sd-brcmfmac.img"
until = "/ # "
wall_secs = 600
max_skipped = 0

# Where the modules are, once, so the prompt stays `/ # ` for every send that
# follows: a `cd` would change it and the next `after` would never match.
[[boot.input]]
after = "/ # \u001b[6n"
text = "M=/lib/modules/$(uname -r)/kernel\n"

# `cfg80211` needs `rfkill`, which is a module in this kernel too.
[[boot.input]]
after = "/ # \u001b[6n"
text = "insmod $M/net/rfkill/rfkill.ko\n"

[[boot.input]]
after = "/ # \u001b[6n"
text = "insmod $M/net/wireless/cfg80211.ko\n"

[[boot.input]]
after = "/ # \u001b[6n"
text = "insmod $M/drivers/net/wireless/broadcom/brcm80211/brcmutil/brcmutil.ko\n"

# The one that matters, and everything after it on one line. Its probe runs
# inside this `insmod`, because the SDIO device is already on the bus, but the
# firmware download and the conversation that follows are a worker's, so the
# prompt comes back long before the driver is finished: hence the `sleep`,
# which is several times what the run needs (the interface is registered
# about 40 ms of model time after the `insmod`).
#
# One line rather than four because the prompt is what every send waits for,
# and a `printk` from another core lands in the middle of it often enough to
# matter: the kernel and the shell write the same UART a byte at a time, and
# an interleaved prompt matches nothing. After this line the kernel has said
# everything it is going to.
#
# `dmesg` rather than the console alone because the driver's first line about
# the chip is a `pr_debug`, which the ring buffer keeps and the console
# loglevel drops. The count has to be long enough to reach back to it.
[[boot.input]]
after = "/ # \u001b[6n"
text = "insmod $M/drivers/net/wireless/broadcom/brcm80211/brcmfmac/brcmfmac.ko; sleep 9; ip link; dmesg | tail -40\n"

# And then the first thing anyone does with an interface. This one is
# synchronous all the way down — `brcmf_netdev_open` runs the whole of
# `brcmf_cfg80211_up` before it returns — so the `sleep` is only there to let
# the one line the driver prints land before `ip link` writes over it. No
# `dmesg` here: that line is a `pr_info` and reaches the console by itself.
[[boot.input]]
after = "/ # \u001b[6n"
text = "ip link set wlan0 up; sleep 2; ip link show wlan0\n"

# And then the first thing anyone does with a radio. `iw` waits for the scan
# to finish before it dumps what cfg80211 collected, so this needs no `sleep`
# of its own: the chip's results are queued behind the acknowledgement of the
# `escan` request itself, and `iw` is still in the kernel waiting for the
# completion when they arrive.
[[boot.input]]
after = "/ # \u001b[6n"
text = "iw dev wlan0 scan\n"

[golden]
path = "golden/linux-wifi.txt"

[[milestone]]
why = "The card is linux-bt's, so the console is the mini-UART and the WiFi SDIO host is live."
line = "mmc1: new high speed SDIO card at address 0001"

[[milestone]]
why = "The root filesystem carries /lib/modules: `insmod` found cfg80211 and the kernel took it, vermagic and all, which is what says the modules match the kernel8.img at the pinned firmware ref."
line = "cfg80211: Loading compiled-in X.509 certificates for regulatory database"

[[milestone]]
why = """
`brcmfmac` matched the card — the CIS gives vendor `0x02d0` device `0xa9a6`
(`SDIO_DEVICE_ID_BROADCOM_CYPRESS_43455`), which is in the driver's SDIO
table — and the first thing it does with it lands: `CMD53` reads the
chipcommon chip-id word through the backplane window at function 1 offset
`0x8000`. `0x10064345` is chip `0x4345` revision 6 on an AXI backplane. The
line is a `pr_debug`, so it is in the `dmesg` tail above and not on the
console."""
line = "brcmfmac: F1 signature read @0x18000000=0x10064345"

[[milestone]]
why = """
Chip recognition is through: the driver walked the enumeration table, found a
CPU core and the SDIO and chipcommon cores it needs, sized the ARM's memory,
and got as far as naming the firmware it wants. `BCM4345/6` is the chip id
and revision the model answers with, and `brcmf_fw_alloc_request` maps that
pair through the driver's own table to `brcmfmac43455-sdio`, which is the
blob the card carries."""
line = "brcmfmac: brcmf_fw_alloc_request: using brcm/brcmfmac43455-sdio for chip BCM4345/6"

[[milestone]]
why = """
The firmware loader was asked for the blob, which is what says the driver got
past chip recognition. The per-board name is a symlink in firmware-nonfree and
not a file the card carries, so this first request fails and the driver falls
back to the plain `brcmfmac43455-sdio.bin`, which does load — a failure to
load *that* would say so on a line of its own."""
line = "Direct firmware load for brcm/brcmfmac43455-sdio"

[[milestone]]
why = """
The control path works end to end, and it is the model on the other end of
it. `brcmf_c_preinit_dcmds` asks the running firmware for its version and
prints it, so everything up to here landed: the frame protocol over function
2, the SDIO core's interrupt, the sequence numbers, the window the chip has
to open for every frame, and a BCDC request and answer for every command the
driver has sent up to here — the bus settings, the address, the revision, the
CLM blob in its chunks. The version string is the model saying so in its own
name; no firmware ran to produce it."""
line = "Firmware: BCM4345/6 pimu model firmware (no radio) version 0"

[[milestone]]
why = "The first `ip link`, before anything has been brought up: nothing here configures the network, so the GENET is down too and stays down."
line = "2: eth0: <BROADCAST,MULTICAST> mtu 1500 qdisc noop qlen 1000"

[[milestone]]
why = """
What this scenario is here to see: `brcmf_attach` got all the way through
`brcmf_cfg80211_attach` — the band list, the channel list, the interface
modes, the event masks — and registered a network interface."""
line = "3: wlan0: <BROADCAST,MULTICAST> mtu 1500 qdisc noop qlen 1000"

[[milestone]]
why = """
And the address it registered with came off the card. `brcmf_c_preinit_dcmds`
asks the chip for `cur_etheraddr` and takes what it gets, and what the chip
answers is the `macaddr=` line out of the nvram the driver downloaded into it
— `brcmfmac43455-sdio.txt` from RPi-Distro/firmware-nonfree, at the commit
`scripts/fetch-firmware.sh` pins. So this line says the nvram arrived intact
and the chip's firmware read it: the chip's own address, which it would
answer with instead, is `02:00:5e:00:53:03`."""
line = "link/ether 02:00:5e:00:57:01 brd ff:ff:ff:ff:ff:ff"

[[milestone]]
why = """
The same address in the run report, and beside it where it came from — which
`ip link` cannot say, because it prints one address whichever of the three
sources won. `from the card's nvram` is the middle one: the chip came up with
`02:00:5e:00:53:03`, the nvram's line replaced it, and no host wrote one over
that (`brcmf_c_set_cur_etheraddr` is only called with an address the platform
hands down, and nothing here does)."""
line = "cyw43455 MAC 02:00:5e:00:57:01, from the card's nvram"

[[milestone]]
why = """
The interface came up, and `UP` with `NO-CARRIER` is as far as one with no
radio behind it goes. `brcmf_netdev_open` (`core.c:601`) ran the whole of
`brcmf_cfg80211_up` (`cfg80211.c:7878`) against the model — `BRCMF_C_UP`,
the power-save mode, `bcn_timeout` and `roam_off`, the roaming thresholds,
`BRCMF_C_SET_INFRA` for the station role, the ARP and ND offloads,
`BRCMF_C_SET_FAKEFRAG` — and every one of them was answered on the control
channel. It waits for no firmware event anywhere in that run, which is why
this works with an event channel that has nothing to say. The carrier stays
off because only an association turns it on (`brcmf_net_setcarrier`,
`core.c`), and nothing here associates."""
line = "3: wlan0: <NO-CARRIER,BROADCAST,MULTICAST,UP> mtu 1500 qdisc pfifo_fast qlen 1000"

[[milestone]]
why = """
The one line the bring-up prints, and it says the interface really is up:
cfg80211 applies its power-save default the moment an interface comes up,
and `brcmf_cfg80211_set_power_mgmt` (`cfg80211.c:3308`) only gets as far as
printing this when `check_vif_up` is true — which is the
`BRCMF_VIF_STATUS_READY` bit `__brcmf_cfg80211_up` (`cfg80211.c:7847`) sets.
Before that it stores the preference and says nothing. The `BRCMF_C_SET_PM`
and `pm2_sleep_ret` behind it are two more commands the model answered."""
line = "brcmf_cfg80211_set_power_mgmt: power save enabled"

[[milestone]]
why = """
The event mask the chip holds, which reaches the console nowhere: the driver
writes it with an iovar and prints it only with its own event tracing turned
on. Twenty-five codes is every event the driver registered a handler for —
cfg80211's, and `BRCMF_E_PSM_WATCHDOG` (41) from `brcmf_attach`
(`core.c:1397`) — plus `BRCMF_E_IF` (54), which `brcmf_fweh_activate_events`
(`fweh.c:456`) sets whatever else the host wants; 187 to 190 are the four
this chip's vendor half of the driver renumbers (`brcmf_cyw_event_map`,
`cyw/core.c:55`). Two hundred bits because the mask is 25 bytes, which is
`DIV_ROUND_UP(BRCMF_CYW_E_LAST, 8)`. `event_msgs_ext` rather than
`event_msgs` because
`brcmf_cyw_activate_events` (`cyw/core.c:82`) overrides the generic path and
sets the same mask through the extended iovar — so a chip that answered only
the plain one would be listening to nothing."""
line = "events 25 of 200 wanted, last set with `event_msgs_ext`"

[[milestone]]
why = """
And what the chip did with it. One event raised and dropped — the interface
the firmware comes up with, which is a `BRCMF_E_IF` — because the host turns
events on long afterwards in `brcmf_c_preinit_dcmds` (`common.c:419`) and was
not listening when the bsscfg appeared. That is why `brcmfmac` creates
`wlan0` itself (`brcmf_bus_started`, `core.c:1237`) rather than waiting for
the firmware to announce it. The two that went are the scan's: one network
and the completion behind it, which are the only things in this run the chip
says without being asked. No frames on the data channel — the interface is
up but has no carrier, so nothing transmits through it."""
line = "events 2 sent, 1 dropped as unwanted; 0 frames in on the data channel"

[[milestone]]
why = """
The scan from the chip's end, which reaches the console nowhere: the request
is an `escan` iovar on the control channel and the answers are events, so a
scan the chip never saw and one it answered with nothing look the same from
outside."""
line = "scans 1 answered, 1 network reported"

[[milestone]]
why = """
`iw dev wlan0 scan` found something, and the something is the model's own.
Getting here is the event channel carrying a frame for the first time in any
run: `brcmf_cfg80211_scan` (`cfg80211.c:1530`) sent the `escan` request, the
chip took a dwell on each of the thirteen channels it offers, and then a
`BRCMF_E_ESCAN_RESULT` went up the event channel carrying a
`brcmf_escan_result_le` around one `brcmf_bss_info_le` — with
`brcmf_cfg80211_escan_handler` (`cfg80211.c:3642`) agreeing with the model
about every length in it — and a second one to say the scan was over. The
address is invented and documented as invented; nothing here listened to
anything."""
line = "BSS 02:00:5e:00:53:04(on wlan0)"

[[milestone]]
why = """
And the name came out of the information elements rather than out of
`brcmf_bss_info_le.SSID`, which is where cfg80211 looks for it:
`brcmf_inform_single_bss` (`cfg80211.c:3399`) points `notify_ie` at
`ie_offset` bytes into the record and takes `ie_length` bytes from there. An
`ie_offset` off by one is a network with an empty name, not an error."""
line = "SSID: pimu-model-ap"

[[milestone]]
why = """
The channel, which agrees three ways: the `chanspec` and `ctl_ch` in the
record, the DS Parameter Set element beside the SSID, and the frequency
cfg80211 filed the network under. It is one of the thirteen the chip told
`brcmf_construct_chaninfo` (`cfg80211.c:7008`) about, which is the only kind
cfg80211 can place — a result on any other channel is one it drops."""
line = "DS Parameter set: channel 1"

[[milestone]]
why = "The frequency cfg80211 worked out from that channel, so the band the chip claims and the band the result landed in are the same one."
line = "freq: 2412.0"

[[milestone]]
why = "And the signal: the model's invented `RSSI`, read back as a signed 16-bit number and multiplied by a hundred (`cfg80211.c:3401`). A sign error here would print `+60.00 dBm`."
line = "signal: -60.00 dBm"

[[milestone]]
why = """
The scan did not end in the driver's own timeout. `brcmf_escan_timeout`
(`cfg80211.c:3590`) fires ten seconds after the request and aborts the scan,
which reports whatever came in and then tells cfg80211 the scan failed — so
a chip that answered the `escan` and never sent the completion would still
print a network here. This is what says the completion arrived."""
line = "brcmf_cfg80211_escan_timeout_worker"
absent = true

[[milestone]]
why = "No control frame went unanswered: a single one that did would stop the bring-up dead 2.7 s later."
line = "brcmf_sdio_bus_rxctl: resumed on timeout"
absent = true

[[milestone]]
why = "And the driver never had cause to ask whether the chip had died, which is the only thing that reads the shared block the model publishes at the top of the chip's memory."
line = "unable to obtain sdpcm_shared info"
absent = true

[[milestone]]
why = "Where this scenario used to stop, and what a regression in the frame protocol would bring straight back."
line = "brcmf_attach: dongle is not responding"
absent = true

[[milestone]]
why = "Nothing the model answers makes the driver or cfg80211 complain: an answer they cannot place — a channel list for a bandwidth the chip does not have, or a channel spec of zero — is a backtrace apiece."
line = "WARNING:"
absent = true

[[milestone]]
why = "And the bring-up itself did not fail: `brcmf_netdev_open` says this and gives back `-EIO` if any command in `brcmf_cfg80211_up` came back with an error."
line = "failed to bring up cfg80211"
absent = true

[[milestone]]
why = "No panic on the way: a failed probe is a failed probe, not a dead kernel."
line = "Kernel panic"
absent = true

[[milestone]]
why = "No oops: a kernel fault would point at the interpreter or a device model."
line = "Unable to handle kernel"
absent = true

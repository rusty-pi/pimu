# The same firmware boot as `firmware-boot.toml`, on a B0 instead of a C0: the
# first production BCM2711 stepping, on the Pi 4B rev 1.2 it shipped on (#77,
# #78). Nobody in-house has a B0 board, so none of this has been checked
# against one; what it pins is that the paths the firmware takes only on this
# board stay modelled:
#
#   * the VPU `version` value, which start4's chip-feature switch reads;
#   * DMA channel 15 taking legacy control blocks on a B0;
#   * the rev 1.2 board's one PMIC, at 0x1D, and its part-id check.
#
# It stops at the ARM hand-off. What comes after is the same as on a C0, and
# `firmware-boot.toml` covers it.
#
# Re-record the golden with:
#   scripts/boot-check.sh --update --scenario=testdata/boot/b0-boot.toml

name = "b0-boot"
description = "pieeprom.bin + start4.elf on a B0 Pi 4B rev 1.2, through to the ARM hand-off."

[boot]
eeprom = "../../firmware/pieeprom.bin"
sd = "../../firmware/sd-halt.img"
# Also picks the board: `c03112`, a 4B rev 1.2.
stepping = "b0"
# The whole line: the console streams, so a shorter match stops mid-line.
until = "arm_loader: Starting ARM with 948MB"
wall_secs = 200
max_skipped = 0

[golden]
path = "golden/b0-boot.txt"

[[milestone]]
why = "The board `--stepping b0` picks reaches the firmware through OTP row 30 (#77)."
line = "board: boardrev c03112 otp c03112"

[[milestone]]
why = """
On a B0 start4 drives DMA channel 15 with legacy control blocks. Read as DMA4
ones they copied nothing, confzilla's pool was lost and gpioman failed (#77)."""
line = "gpioman: configuration attempt"
absent = true

[[milestone]]
why = """
A rev 1.2 board has one PMIC, at 0x1D. Without it start4's probe hangs on its
first register read, and with the wrong ID register `pmic_get_voltage` stops
the firmware a few calls later (#78)."""
line = "PMIC:"
absent = true

[[milestone]]
why = "The goal, as on C0: the VPU hands the board over to the ARM."
line = "arm_loader: Starting ARM with 948MB"

[[milestone]]
why = "No nop-slides: none of the B0-only paths reaches a null callback."
line = "[derail]"
absent = true

[[milestone]]
why = "An unknown instruction must be reported as a fault, not stepped over."
line = "Unimplemented"
absent = true

# The firmware boot with the cut-down firmware: `start4cd.elf` and
# `fixup4cd.dat`, picked by `gpu_mem=16` in config.txt the way a real card
# picks them. It is the variant a headless board runs, with no camera or codec
# support and 16 MB for the VideoCore.
#
# What it pins beyond `firmware.toml`: the identity this bench guards
# (the root-LUKS passphrase derivation) is the same whichever variant a card boots. The cut-down
# firmware prints nothing on the UART after the bootloader starts it, so
# everything past `Starting start4cd.elf` comes from the run report: the device
# tree is found through the armstub's `dtb_ptr32`, not a console line.
#
# The silence is by design. Raspberry Pi's config.txt documentation says the
# cut-down firmware "removes support for codecs, 3D and debug logging", and
# that `gpu_mem=16` is the only way to select it
# (https://github.com/raspberrypi/documentation/blob/ecd7a8129d4f2cb908d6cbd6ea5a994e0091285d/documentation/asciidoc/computers/config_txt/boot.adoc#L12).
# The binary agrees: `Device tree loaded`, `Starting ARM`, `File read` and the
# other log format strings of `start4.elf` are not in `start4cd.elf` at all,
# and its device tree has no `/chosen/log` message ring either.
#
# The card is `START4=start4cd KERNEL=halt scripts/make-sd.sh
# firmware/sd-halt-start4cd.img`. Re-record the golden and the retired counts
# with:
#   pimu boot-check testdata/boot/firmware-cd.toml --update

name = "firmware-cd"
description = "pieeprom.bin + start4cd.elf boot from the SD image, through to the ARM hand-off."

[boot]
eeprom = "../../firmware/pieeprom.bin"
bootconf = ["BOOT_UART=1"]
sd = "../../firmware/sd-halt-start4cd.img"
# The same requests as `firmware.toml`, which explains each one.
# The model is a board as it leaves the factory, so OTP rows 56-63 - the device
# private key - are blank; only `rpi-otp-private-key`, run by an owner, ever
# fuses them. The crypto milestones below need a provisioned part, so this
# scenario fuses a key of its own. The value is **invented and must stay so**:
# the real rows are secret (`CLAUDE.md`). It is a valid NIST P-256 scalar and
# deliberately ASCII, so a hexdump of it reads as fake.
otp_row = [
  "56=0x52504956", # "RPIV"
  "57=0x49525446", # "IRTF"
  "58=0x574d4f44", # "WMOD"
  "59=0x454c4b45", # "ELKE"
  "60=0x59303030", # "Y000"
  "61=0x30303030", # "0000"
  "62=0x30303030", # "0000"
  "63=0x30303031", # "0001"
]
mbox_property = [
  "0x00000001",
  "0x00028001:8=3.3",
  "0x0003008f",
  "0x00030090=1",
  "0x0003009c=1",
  "0x00030092=0.1.16.0x6c6c6548.0x77202c6f.0x646c726f.0x00000021",
]
# Around 10 s on a dev box: the run ends a minute of model time after the
# firmware's last console byte, which here comes early.
wall_secs = 120
max_skipped = 0

[golden]
path = "golden/firmware-cd.txt"

[[milestone]]
why = "`gpu_mem=16` made the bootloader pick the cut-down pair."
line = ["Read start4cd.elf", "843580"]

[[milestone]]
why = "Its fixup file comes with it."
line = ["Read fixup4cd.dat", "3282"]

[[milestone]]
why = "`fixup4cd.dat` gives the VideoCore 16 MB, and the ARM the rest below 1 GB."
line = "MEM GPU: 16 ARM: 998 TOTAL: 1014"

[[milestone]]
why = "The bootloader hands over to the cut-down firmware, at its own load address."
line = "Starting start4cd.elf @ 0xff000200"

[[milestone]]
why = """
The cut-down firmware logs nothing once started, so this boot never has the
line `boot` used to find the device tree by. Its absence is what makes the
milestones below a test of the armstub path."""
line = "Device tree loaded to"
absent = true

[[milestone]]
why = """
The firmware released the ARM: the armstub handed core 0 the kernel, at the
address `kernel8.img` is loaded to."""
line = ["core 0    left the armstub", "for 0x200000 in EL2"]

[[milestone]]
why = """
The report reads the tree the armstub hands the ARM (`dtb_ptr32`), which the
cut-down firmware needs: it says nothing on the console after it starts."""
line = "device tree handed to the ARM"

[[milestone]]
why = "The same serial as with `start4.elf` (`firmware.toml`)."
line = ["/chosen/rpi-serial64 ", "\"fa1e00231aa2bb31\""]

[[milestone]]
why = "The ARM property mailbox answers after the hand-off."
line = "1 requests taken, 1 replies written"

[[milestone]]
why = """
`GET_FIRMWARE_REVISION` is this build's own timestamp (`0x6a7a16be` =
2026-08-10 18:21:50 UTC), 15 s after `start4.elf`'s. It is the proof that the
cut-down firmware, not the full one, is answering."""
line = ["tag 0x00000001", "answered", "0x6a7a16be"]

[[milestone]]
why = "`SET_POWER_STATE` for USB powers device 3, as with `start4.elf`."
line = ["tag 0x00028001", "answered", "0x00000003 0x00000001"]

[[milestone]]
why = "One OTP key slot."
line = ["tag 0x0003008f", "answered", "0x00000001"]

[[milestone]]
why = "Key 1 is a device private key, from the `otp_row` lines above."
line = ["tag 0x00030090", "answered", "0x00000001"]

[[milestone]]
why = "Key 1 has no usage set."
line = ["tag 0x0003009c", "answered", "0x00000000"]

[[milestone]]
why = """
The crypto service is in the cut-down firmware too, and gives the same
HMAC-SHA256 as `start4.elf` for the same OTP key and message."""
line = ["tag 0x00030092", "answered", "0x6ff9b60e 0x7bb3973a 0x01eb65b0 0x48fd764f 0x8286f48d 0xf1b46aed 0xe8e0da4c 0x9d1e6ea2"]

[[milestone]]
why = "No nop-slides."
line = "[derail]"
absent = true

[[milestone]]
why = "No instruction the decoder does not know."
line = "Unimplemented"
absent = true

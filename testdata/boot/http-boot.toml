# The firmware boot over the network: HTTP (BOOT_ORDER 0x7), plain HTTP.
#
# The bootloader resolves HTTP_HOST (the built-in peer answers every DNS
# query with its own address), and fetches boot.sig and boot.img from
# HTTP_PATH (default `net_install`) of the root `scripts/make-netboot.sh`
# builds. With the default HTTP_HOST the bootloader always uses HTTPS on 443
# (HTTP_PORT is ignored), which needs a CA certificate in the EEPROM; any
# other HTTP_HOST honours HTTP_PORT, so `netboot.test` on port 80 is plain
# HTTP.
#
# HTTP boot only takes a signed boot.img, so boot.sig carries an RSA signature
# by the test key in testdata/netboot/, and its public half goes into the
# model's copy of the EEPROM (`eeprom_pubkey`, as `rpi-eeprom-config --pubkey`
# would put it there).
#
# Re-record the golden and the retired counts with:
#   pimu boot-check testdata/boot/http-boot.toml --update

name = "http-boot"
description = "pieeprom.bin network boot over plain HTTP from the built-in peer, through to the ARM hand-off."

[boot]
eeprom = "../../firmware/pieeprom.bin"
netboot = "../../firmware/netboot"
boot_order = "0xf7"
bootconf = ["HTTP_HOST=netboot.test", "HTTP_PORT=80"]
eeprom_pubkey = "../../firmware/netboot-pubkey.bin"
# It stops at the ARM hand-off, as b0-stepping does: what comes after is the
# same as on an SD boot, and `firmware.toml` covers it. Without this the run
# idled on for a minute of modelled time until nothing had printed for long
# enough. The whole line: the console streams, so a shorter match stops
# mid-line.
until = "arm_loader: Starting ARM with 948MB"
wall_secs = 200
max_skipped = 0

[golden]
path = "golden/http-boot.txt"

[[milestone]]
why = "BOOT_ORDER 0xf7 reached the bootloader: HTTP first."
line = "Boot mode: HTTP (07)"

[[milestone]]
why = "The bootloader's mbedtls initialises and it gets as far as a request: the ww=11 signed-byte load (not a store) keeps ecp_mod_p256's carry right, without which ecp_modp never finished."
line = "HTTP: GET request for http://netboot.test:80/net_install/boot.img"

[[milestone]]
why = "boot.sig's RSA-2048 signature verifies against the key --eeprom-pubkey put in the EEPROM's pubkey.bin slot. A hash-only boot.sig gets \"Invalid RSA signature size 0 bytes\", and the pinned image's all-zero slot \"rsa-verify fail (0x4380)\"."
line = "rsa-verify pass (0x0)"

[[milestone]]
why = "The bootloader boots the downloaded boot.img as a ramdisk."
line = "[ramdisk] recovery.elf not found"

[[milestone]]
why = "The goal: the VPU hands the board over to the ARM, with no SD card in the machine."
line = "arm_loader: Starting ARM with 948MB"

[[milestone]]
why = "The identity is the same however the board booted: same fuses, same pinned serial."
line = ["/chosen/rpi-serial64 ", "\"fa1e00231aa2bb31\""]

[[milestone]]
why = "No nop-slides at all."
line = "[derail]"
absent = true

[[milestone]]
why = "An unknown instruction must be reported as a fault, with its pc and raw bytes."
line = "Unimplemented"
absent = true

# The firmware boot: the regression this project actually exists for.
#
# One EEPROM image, one SD card, one wall budget, and every assertion made
# about the run. `scripts/boot-check.sh` runs it; CI runs that.
#
# Two kinds of assertion, checked against a single boot:
#
#   * the golden transcript below — the whole normalised console, diffed line
#     by line, which catches output that moved or a value that shifted;
#   * the milestones — each one naming the invariant it guards and citing the
#     commit or issue that made it pass, which is what a raw diff cannot say.
#
# After an intentional change, re-record the golden with:
#   scripts/boot-check.sh --update
# and read the diff in the commit before you believe it.
#
# This file is deliberately not under `testdata/scenarios/`: those are the
# in-process scenarios `cargo test` runs in a millisecond each, and this one
# takes minutes and needs firmware blobs that are never committed.

name = "firmware-boot"
description = "pieeprom.bin + start4.elf boot from the SD image, through to the ARM hand-off."

[boot]
eeprom = "../../firmware/pieeprom.bin"
sd = "../../firmware/sd.img"
# Ask the still-running firmware for a property after the hand-off, the way a
# booted Linux would through `/dev/vcio` (#23): the firmware revision, which
# pins that the mailbox round trip works at all, the number of OTP key slots,
# and the crypto key status, which is the service rpi-mkosi#37 ultimately
# cares about.
#
# `0x00030090` is deliberately last. A crypto handler that fails answers its
# own tag but stamps the whole buffer `0x80000001` and stops the walk, so any
# tag placed after it would go unanswered for that reason alone.
mbox_property = ["0x00000001", "0x0003008f", "0x00030090"]
# The runners are roughly 1.6x slower than a dev box, where the last milestone
# lands around 90 s. The budget went 290 -> 330 s so the run reaches the codec
# licence check, which is what exercises the VCE guard below. RVF_BOOT_WALL
# overrides it.
wall_secs = 330
# `recon` stops on an instruction the decoder does not implement rather than
# stepping over it, so a skip can only come from the remaining recon leniencies
# (`bkpt` padding, `sleep`, an unhandled `swi`). Nothing in a clean boot should
# need even those.
max_skipped = 0

[golden]
path = "golden/firmware-boot.txt"

[[milestone]]
why = "The reset cause the bootloader reports; the real board latches HADWRF (1bc5fa1), matching sd-card-boot.log line 4."
line = "PM_RSTS 00000020"

[[milestone]]
why = "The PCIe link trains and the bus scan finds the VL805 that is soldered to every Pi 4B (#18). Same identity the real board prints, sd-card-boot.log:27."
line = "PCIe scan 00001106:00003483"

[[milestone]]
why = """
The bootloader reads the VL805's xHCI capability registers. It reaches them
through 40-bit DMA4 transfers into the PCIe outbound window, not a load, so this
line is the end-to-end proof of that path (src/periph/pcie.rs). The values are
byte-identical to the real board, sd-card-boot.log:29-32."""
line = "xHC0 ver: 256 HCS: 05000420 fc000031 00e70004 HCC: 002841eb"

[[milestone]]
why = "xHCI port and slot counts, same source as the capability registers above."
line = "xHC0 ports 5 slots 32 intrs 4"

[[milestone]]
why = "The PCIe link never trained: the bootloader prints this instead of the scan result above, and everything USB downstream of it is then absent rather than wrong (#18)."
line = "PCIe timeout"
absent = true

[[milestone]]
why = "xHC bring-up failed: the bootloader reached the controller but could not start it, which is a different fault from never finding it, and the enumeration lines below would simply not appear (#18)."
line = "USB xHC init failed"
absent = true

[[milestone]]
why = """
The xHCI ring engine enumerates the VIA Labs hub soldered to root port 1 of
every Pi 4B: port connect, reset, Enable Slot / Address Device, and
GET_DESCRIPTOR over the control ring. All four lines are byte-identical to the
real board, sd-card-boot.log:36-39 (#18 stage 3). This one is the USB2 root port
reporting the hub."""
line = "USB2[1] 400202e1 connected"

[[milestone]]
why = "Root hub port init (#18 stage 3, sd-card-boot.log:36-39)."
line = "USB2 root HUB port 1 init"

[[milestone]]
why = "The hub enumerated over the control ring (#18 stage 3, sd-card-boot.log:36-39)."
line = "DEV [01:00] 2.16 000000:01 class 9 VID 2109 PID 3431"

[[milestone]]
why = "The hub driver bound (#18 stage 3, sd-card-boot.log:36-39)."
line = "HUB init [01:00] 2.16 000000:01"

[[milestone]]
why = """
The pre-handover XHCI-STOP: EINT | PCD, an event posted and a port change seen.
A board with nothing on the bus prints `USBSTS 0`; the reference board prints 18
(sd-card-boot.log:73) because of the hub above."""
line = "USBSTS 18"

[[milestone]]
why = "start4 got past the DMA transfer completion and emitted its first MESS log."
line = ["MESS:", "arasan_emmc_open"]

[[milestone]]
why = "gpioman resolves its pin names from the real dt-blob, so the firmware itself emits the two \"not defined\" lines the reference has (vc4-boot.log 16-17)."
line = "pin DISPLAY_DSI_PORT not defined"
count = 2

[[milestone]]
why = "gpioman registration regressed (#2): gpioman configures its pin providers for real, which needs the confzilla schema pool to survive its DMA relocation."
line = "gpioman: configuration attempt"
absent = true

[[milestone]]
why = "The HDMI phase gives up on EDID once per controller, the way a board with no monitor does (vc4-boot.log 20-31). Needs SCALER_DISPID (#13)."
line = "HDMI0:EDID giving up on reading EDID block 0"

[[milestone]]
why = "Same for the second controller (vc4-boot.log 20-31, #13)."
line = "HDMI1:EDID giving up on reading EDID block 0"

[[milestone]]
why = "Bounded, not a retry storm: posting into HDMI1's event-flags group used to re-trigger its EDID fetch on every pass (71bd94a)."
line = "EDID giving up"
max_count = 16

[[milestone]]
why = "hdmi_get_state deprecation notice, as the reference prints it."
line = "hdmi: HDMI:hdmi_get_state is deprecated"

[[milestone]]
why = "HDMI0 pixel-clock limit."
line = "HDMI0: hdmi_pixel_freq_limit"

[[milestone]]
why = "HDMI1 pixel-clock limit."
line = "HDMI1: hdmi_pixel_freq_limit"

[[milestone]]
why = "Past the second config.txt read into the restart-logging phase (vc4-boot.log line 19)."
line = "*** Restart logging"

[[milestone]]
why = "The file-loading phase, which needed the hardware RNG modelled (e012fad): the ARM device tree (vc4-boot.log lines 32 onward)."
line = "Loaded 'bcm2711-rpi-4-b.dtb'"

[[milestone]]
why = "config.txt dtparam handling in the same file-loading phase (e012fad)."
line = "dtparam: spi=on"

[[milestone]]
why = "Overlay load in the same file-loading phase (e012fad)."
line = "Loaded overlay 'disable-bt'"

[[milestone]]
why = "Kernel command line, same phase (e012fad)."
line = "Read command line from file 'cmdline.txt'"

[[milestone]]
why = "Kernel load, same phase (e012fad)."
line = "Loaded 'kernel8.img'"

[[milestone]]
why = "Device tree relocation, same phase (e012fad)."
line = "Device tree loaded to"

[[milestone]]
why = """
The console baud rate is recomputed for the ARM once the VPU is done with it
(vc4-boot.log 62-65). Getting here needs the ASB bridge handshake modelled:
start4 gates the H264 power domain on the way, and with `0x7E00_A000` unmapped
the bridge never acknowledged the stop request (`src/periph/asb.rs`)."""
line = "Set PL011 baud rate to 103448"

[[milestone]]
why = """
Exactly one "Set", two "done" — that asymmetry is real, not a modelling gap
(#20). The clock notifier calls the PL011 callback `0x3EC799BC` twice in phase 0
and twice in phase 2. Phase 0 prints, then clears the "console usable" flag
`[gp+5176]` and writes `UARTCR = 0`; the console writer `0x3ED85E9C` drops every
byte while that flag is 0, so the second phase-0 line never reaches the wire.
Phase 2 restores the flag before it prints, so both "done" lines do.
`vc4-boot.log` shows two "Set" lines because it is a `vcdbg` dump of the
firmware's message ring (it keeps logging past `arm_loader`, when the UART
already belongs to Linux), not a serial capture. The genuine UART captures agree
with the model: sd-card-boot-perfect.log lines 137-139 are one "Set" and two
"done"."""
line = "Set PL011 baud rate"
count = 1

[[milestone]]
why = "The other half of the #20 asymmetry: two \"done\" lines reach the wire."
line = "Baud rate change done"
count = 2

[[milestone]]
why = """
The last thing before `arm_loader`: `codec_enabled` runs its licence-key check
on the VCE and waits on interrupt source 68. With the block unmapped that wait
timed out and start4 printed this instead (`src/periph/vce.rs`)."""
line = "VCE taking >1s to run"
absent = true

[[milestone]]
why = """
SD card power handover. The board-identity check `arm_loader` gates the ARM
launch on reads OTP rows 19..26; with them blank it failed and start4 blinked
LED error code 4-4 ("unsupported board type") forever
(`src/periph/configotp.rs`)."""
line = "pin SDCARD_CONTROL_POWER not defined"

[[milestone]]
why = "The watchdog is stopped on the way to the hand-off (`src/periph/configotp.rs`, the same board-identity gate)."
line = "Watchdog stopped"

[[milestone]]
why = "The goal: the VPU hands the board over to the ARM, with the same split of a 1 GB board's memory the reference reports (vc4-boot.log 68)."
line = "arm_loader: Starting ARM with 948MB"

[[milestone]]
why = """
The point of the bench (#5, rpi-mkosi#37). Before releasing the ARM,
`arm_loader` patches `/chosen` and publishes `rpi-machine-id` at `0x3EC568F8` —
the string a `rpi-mkosi` image turns into its root-LUKS passphrase. `recon` reads
the patched blob back out of DRAM at the address the firmware logged and prints
the identity properties, so a firmware bump that changes the derivation fails
right here instead of on deployed cards."""
line = "device tree handed to the ARM"

[[milestone]]
why = """
Pinning the value is safe: every OTP row it derives from is invented in
`src/periph/configotp.rs` (see the OTP rule in CLAUDE.md), so this is the
model's own identity and not any real board's. `rpi-serial64` is the same two
rows unhashed, which is what makes the pair a useful regression: if the serial
still matches but the machine id does not, the *derivation* moved."""
line = ["/chosen/rpi-serial64 ", "\"fa1e00231aa2bb31\""]

[[milestone]]
why = """
The other half of the pair: the machine id itself (#5, rpi-mkosi#37).

Fixed inputs, fixed expected output — the OTP rows in
`src/periph/configotp.rs` are invented and pinned, so this string is what this
firmware must publish, full stop. Deliberately *not* checked by recomputing
the derivation the way the firmware does: that reads from the same fuses, so
changing them would move the published id and still agree with itself, masking
exactly the event this exists to catch. `src/identity.rs` reproduces the
algorithm for diagnosis only, and nothing asserts against it."""
line = ["/chosen/rpi-machine-id ", "\"2928640898f6b5035da98885da0ac498\""]

[[milestone]]
why = """
With the ARM running the VPU keeps polling the LPDDR4 MR4 temperature code once
a second and rescales the DRAM refresh interval by 1 << (3 - code); the
reference board reports code 2 and the interval doubles (vc4-boot.log 69,
`sdram: sdram refresh 1562->3124 (2)`). That line never reaches a UART — the
console belongs to Linux by then and only the firmware's internal message ring
has it — so the check is on the controller state instead (`src/periph/sdc.rs`
models the mode-register port at `0x7E00_109C`)."""
line = "refresh interval 658 -> 1562 -> 3124"

[[milestone]]
why = """
The ARM property mailbox answers (#23). `start4` leaves a `mbox_read` task
running after the hand-off; posting a request the way a booted Linux does
through `/dev/vcio` reaches it, and this is the line that proves the whole
round trip — doorbell, interrupt source 94, the ISR at `0x3EC58302` releasing
the reader's lock, the reply written back to MAIL0."""
line = "1 requests taken, 1 replies written"

[[milestone]]
why = """
`GET_FIRMWARE_REVISION` comes back with the pinned build's timestamp
(`0x6a7a16af` = 2026-08-10 18:21:35 UTC). A firmware bump is expected to change
this — when it does, re-pin it deliberately rather than loosening the match,
since it is also the cheapest proof that the reply carries real data rather
than a staged buffer read back."""
line = ["tag 0x00000001", "answered", "0x6a7a16af"]

[[milestone]]
why = """
`GET_CRYPTO_NUM_OTP_KEYS` reports one key slot. This is what makes the failure
below a *provisioning* answer rather than a broken interface: the crypto
service is up and knows how many slots the part has."""
line = ["tag 0x0003008f", "answered", "0x00000001"]

[[milestone]]
why = """
`GET_CRYPTO_KEY_STATUS` answers `0x80000000` — an error, and asking
`GET_CRYPTO_LAST_ERROR` straight afterwards returns 3,
`RPI_FW_CRYPTO_KEY_NOT_FOUND`. That is the correct answer for a board with no
key fused, which is what this bench models, and it is reached through the real
handler: the request costs millions of instructions inside `start4.elf` and no
short-circuit stands in for it.

The firmware treats a failing crypto handler as fatal for the whole buffer —
the tag itself is marked answered, but the header comes back `0x80000001` and
the walk stops — which is why this tag is last in the request.

Provisioning a key is the open half of this (rpi-mkosi#37). Writing invented
values into OTP rows 56-63 does *not* do it: they read back fine and the answer
does not change, because the verdict is reached during boot and cached, with no
OTP row read at all while the request is served."""
line = ["tag 0x00030090", "answered", "0x80000000"]

[[milestone]]
why = "No nop-slides at all: the register file must survive preemptive context switches (8d7c27a) and no callback may be null."
line = "[derail]"
absent = true

[[milestone]]
why = "The wall clock is the fallback stop, not the primary one: an unknown instruction must be reported as a fault, with its pc and raw bytes."
line = "Unimplemented"
absent = true

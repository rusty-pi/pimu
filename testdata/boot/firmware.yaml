# The firmware boot: the regression this project actually exists for.
#
# One EEPROM image, one SD card, one wall budget, and every assertion made
# about the run. `pimu boot-check` runs it, and so does CI.
#
# Three kinds of assertion, checked against a single boot:
#
#   * the golden transcript below — the whole normalised console, diffed line
#     by line, which catches output that moved or a value that shifted;
#   * the milestones — each one naming the invariant it guards and citing the
#     commit or issue that made it pass, which is what a raw diff cannot say;
#   * the retired counts beside the golden (`golden/firmware.retired.toml`)
#     — how many instructions each core ran, which catches a change that makes
#     the boot run differently without printing anything different.
#
# After an intentional change, re-record the golden and the counts with:
#   pimu boot-check testdata/boot/firmware.yaml --update
# and read the diff in the commit before you believe it.
#
# This file is deliberately not under `testdata/scenarios/`: those are the
# in-process scenarios `cargo test` runs in a millisecond each, and this one
# takes minutes and needs firmware blobs that are never committed.

name: "firmware"
description: "pieeprom.bin + start4.elf boot from the SD image, through to the ARM hand-off."

boot:
  eeprom: "../../firmware/pieeprom.bin"
  bootconf: ["BOOT_UART=1"]
# The card from `KERNEL=halt scripts/make-sd.sh firmware/sd-halt.img`: the same
# as the Linux boot's, but its kernel8.img parks the ARM, so the run ends where
# the firmware goes quiet after the handover.
  sd: "../../firmware/sd-halt.img"
# Ask the still-running firmware for a property after the hand-off, the way a
# booted Linux would through `/dev/vcio`: the firmware revision, which
# pins that the mailbox round trip works at all, the number of OTP key slots,
# and the crypto key status, which is the service the root-LUKS passphrase derivation ultimately
# cares about.
#
# The `=1` is load-bearing: crypto key ids are 1-based, and `key_id` 0 answers
# `KEY_NOT_FOUND` on a part whose only key is key 1. A crypto handler that does
# fail answers its own tag but stamps the whole buffer `0x80000001` and stops
# the walk, so a failing tag has to go last or every tag after it reads as
# unanswered for that reason alone.
#
# The last one is an HMAC-SHA256 over a fixed 16-byte message ("Hello, world!"),
# keyed by the OTP key, which is the end-to-end proof that the crypto service
# runs for real.
#
# `SET_POWER_STATE` for USB (device 3, on and wait) goes before the crypto
# tags: its handler waits on two blocks with no timeout, and a wrong answer from
# either parks it with every later request unanswered. Its value buffer
# is two words, so it names its size.
# The model is a board as it leaves the factory, so OTP rows 56-63 - the device
# private key - are blank; only `rpi-otp-private-key`, run by an owner, ever
# fuses them. The crypto milestones below need a provisioned part, so this
# scenario fuses a key of its own. The value is **invented and must stay so**:
# the real rows are secret (`CLAUDE.md`). It is a valid NIST P-256 scalar and
# deliberately ASCII, so a hexdump of it reads as fake.
  otp_row:
    - "56=0x52504956" # "RPIV"
    - "57=0x49525446" # "IRTF"
    - "58=0x574d4f44" # "WMOD"
    - "59=0x454c4b45" # "ELKE"
    - "60=0x59303030" # "Y000"
    - "61=0x30303030" # "0000"
    - "62=0x30303030" # "0000"
    - "63=0x30303031" # "0001"
  mbox_property:
    - "0x00000001"
    - "0x00028001:8=3.3"
    - "0x0003008f"
    - "0x00030090=1"
    - "0x0003009c=1"
    - "0x00030092=0.1.16.0x6c6c6548.0x77202c6f.0x646c726f.0x00000021"
# The runners are roughly 1.6x slower than a dev box, where the last milestone
# lands around 90 s. The budget went 290 -> 330 s so the run reaches the codec
# licence check, which is what exercises the VCE guard below. `boot-check
# --max-wall` overrides it.
  wall_secs: 330
# `boot` stops on an instruction the decoder does not implement rather than
# stepping over it, so a skip can only come from the remaining recon leniencies
# (`bkpt` padding, `sleep`, an unhandled `swi`). Nothing in a clean boot should
# need even those.
  max_skipped: 0

golden:
  path: "golden/firmware.txt"

milestones:
  - why: "The reset cause the bootloader reports; the real board latches HADWRF (1bc5fa1), matching a Raspberry Pi 4B d03115's bootloader log."
    line: "PM_RSTS 00000020"

  - why: "The PCIe link trains and the bus scan finds the VL805 that is soldered to every Pi 4B. Same identity the real board prints, a Raspberry Pi 4B d03115's bootloader log."
    line: "PCIe scan 00001106:00003483"

  - why: >-
      The bootloader reads the VL805's xHCI capability registers. It reaches them
      through 40-bit DMA4 transfers into the PCIe outbound window, not a load, so this
      line is the end-to-end proof of that path (src/periph/pcie.rs). The values are
      byte-identical to the real board, a Raspberry Pi 4B d03115's bootloader log.
    line: "xHC0 ver: 256 HCS: 05000420 fc000031 00e70004 HCC: 002841eb"

  - why: "xHCI port and slot counts, same source as the capability registers above."
    line: "xHC0 ports 5 slots 32 intrs 4"

  - why: "The PCIe link never trained: the bootloader prints this instead of the scan result above, and everything USB downstream of it is then absent rather than wrong."
    line: "PCIe timeout"
    absent: true

  - why: "xHC bring-up failed: the bootloader reached the controller but could not start it, which is a different fault from never finding it, and the enumeration lines below would simply not appear."
    line: "USB xHC init failed"
    absent: true

  - why: >-
      The xHCI ring engine enumerates the VIA Labs hub soldered to root port 1 of
      every Pi 4B: port connect, reset, Enable Slot / Address Device, and
      GET_DESCRIPTOR over the control ring. All four lines are byte-identical to the
      real board, a Raspberry Pi 4B d03115's bootloader log. This one is the USB2 root port
      reporting the hub.
    line: "USB2[1] 400202e1 connected"

  - why: "Root hub port init (a Raspberry Pi 4B d03115's bootloader log)."
    line: "USB2 root HUB port 1 init"

  - why: "The hub enumerated over the control ring (a Raspberry Pi 4B d03115's bootloader log)."
    line: "DEV [01:00] 2.16 000000:01 class 9 VID 2109 PID 3431"

  - why: "The hub driver bound (a Raspberry Pi 4B d03115's bootloader log)."
    line: "HUB init [01:00] 2.16 000000:01"

  - why: >-
      The pre-handover XHCI-STOP: EINT | PCD, an event posted and a port change seen.
      A board with nothing on the bus prints `USBSTS 0`; the reference board prints 18
      (a Raspberry Pi 4B d03115's bootloader log) because of the hub above.
    line: "USBSTS 18"

  - why: "start4 got past the DMA transfer completion and emitted its first MESS log."
    line: ["MESS:", "arasan_emmc_open"]

  - why: "gpioman resolves its pin names from the real dt-blob, so the firmware itself emits the two \"not defined\" lines the reference has (a Raspberry Pi 4B d03115's start4 log)."
    line: "pin DISPLAY_DSI_PORT not defined"
    count: 2

  - why: "gpioman registration regressed: gpioman configures its pin providers for real, which needs the confzilla schema pool to survive its DMA relocation."
    line: "gpioman: configuration attempt"
    absent: true

  - why: "The HDMI phase gives up on EDID once per controller, the way a board with no monitor does (a Raspberry Pi 4B d03115's start4 log). Needs SCALER_DISPID."
    line: "HDMI0:EDID giving up on reading EDID block 0"

  - why: "Same for the second controller (a Raspberry Pi 4B d03115's start4 log)."
    line: "HDMI1:EDID giving up on reading EDID block 0"

  - why: "Bounded, not a retry storm: posting into HDMI1's event-flags group used to re-trigger its EDID fetch on every pass (71bd94a)."
    line: "EDID giving up"
    max_count: 16

  - why: "hdmi_get_state deprecation notice, as the reference prints it."
    line: "hdmi: HDMI:hdmi_get_state is deprecated"

  - why: "HDMI0 pixel-clock limit."
    line: "HDMI0: hdmi_pixel_freq_limit"

  - why: "HDMI1 pixel-clock limit."
    line: "HDMI1: hdmi_pixel_freq_limit"

  - why: "Past the second config.txt read into the restart-logging phase (a Raspberry Pi 4B d03115's start4 log)."
    line: "*** Restart logging"

  - why: "The file-loading phase, which needed the hardware RNG modelled (e012fad): the ARM device tree (a Raspberry Pi 4B d03115's start4 log onward)."
    line: "Loaded 'bcm2711-rpi-4-b.dtb'"

  - why: "config.txt dtparam handling in the same file-loading phase (e012fad)."
    line: "dtparam: spi=on"

  - why: "Overlay load in the same file-loading phase (e012fad)."
    line: "Loaded overlay 'disable-bt'"

  - why: "Kernel command line, same phase (e012fad)."
    line: "Read command line from file 'cmdline.txt'"

  - why: "Kernel load, same phase (e012fad)."
    line: "Loaded 'kernel8.img'"

  - why: "Device tree relocation, same phase (e012fad)."
    line: "Device tree loaded to"

  - why: >-
      The console baud rate is recomputed for the ARM once the VPU is done with it
      (a Raspberry Pi 4B d03115's start4 log). Getting here needs the ASB bridge handshake modelled:
      start4 gates the H264 power domain on the way, and with `0x7E00_A000` unmapped
      the bridge never acknowledged the stop request (`src/periph/asb.rs`).
    line: "Set PL011 baud rate to 103448"

  - why: >-
      Exactly one "Set", two "done" — that asymmetry is real, not a modelling gap. The clock notifier calls the PL011 callback `0x3EC799BC` twice in phase 0
      and twice in phase 2. Phase 0 prints, then clears the "console usable" flag
      `[gp+5176]` and writes `UARTCR = 0`; the console writer `0x3ED85E9C` drops every
      byte while that flag is 0, so the second phase-0 line never reaches the wire.
      Phase 2 restores the flag before it prints, so both "done" lines do.
      a Raspberry Pi 4B d03115's start4 log shows two "Set" lines because it is a `vcdbg` dump of the
      firmware's message ring (it keeps logging past `arm_loader`, when the UART
      already belongs to Linux), not a serial capture. The genuine UART captures agree
      with the model: a Raspberry Pi 4B d03115's log shows one "Set" and two
      "done".
    line: "Set PL011 baud rate"
    count: 1

  - why: "The other half of the baud-change asymmetry: two \"done\" lines reach the wire."
    line: "Baud rate change done"
    count: 2

  - why: >-
      The last thing before `arm_loader`: `codec_enabled` runs its licence-key check
      on the VCE and waits on interrupt source 68. With the block unmapped that wait
      timed out and start4 printed this instead (`src/periph/vce.rs`).
    line: "VCE taking >1s to run"
    absent: true

  - why: >-
      SD card power handover. The board-identity check `arm_loader` gates the ARM
      launch on reads OTP rows 19..26; with them blank it failed and start4 blinked
      LED error code 4-4 ("unsupported board type") forever
      (`src/periph/configotp.rs`).
    line: "pin SDCARD_CONTROL_POWER not defined"

  - why: "The watchdog is stopped on the way to the hand-off (`src/periph/configotp.rs`, the same board-identity gate)."
    line: "Watchdog stopped"

  - why: "The goal: the VPU hands the board over to the ARM, with the same split of a 1 GB board's memory the reference reports (a Raspberry Pi 4B d03115's start4 log)."
    line: "arm_loader: Starting ARM with 948MB"

  - why: >-
      Before releasing the ARM, `arm_loader` patches the identity properties into
      `/chosen`. `boot` reads the patched blob back out of DRAM at the address the
      armstub hands the ARM and prints them, so a firmware bump that moves one fails
      here rather than on a deployed card.
    line: "device tree handed to the ARM"

  - why: >-
      Pinning the value is safe: every OTP row it comes from is invented in
      `src/periph/configotp.rs` (see the OTP rule in CLAUDE.md), so this is the
      model's own identity and not any real board's. The property is the board serial
      of rows 28 and 35, which is what says the firmware read the fuses and published
      what it read.
    line: ["/chosen/rpi-serial64 ", "\"fa1e00231aa2bb31\""]

  - why: >-
      With the ARM running the VPU keeps polling the LPDDR4 MR4 temperature code once
      a second and rescales the DRAM refresh interval by 1 << (3 - code); the
      reference board reports code 2 and the interval doubles (a Raspberry Pi 4B d03115's start4 log,
      `sdram: sdram refresh 1562->3124 (2)`). That line never reaches a UART — the
      console belongs to Linux by then and only the firmware's internal message ring
      has it — so the check is on the controller state instead (`src/periph/sdc.rs`
      models the mode-register port at `0x7E00_109C`).
    line: "refresh interval 658 -> 1562 -> 3124"

  - why: >-
      The ARM property mailbox answers. `start4` leaves a `mbox_read` task
      running after the hand-off; posting a request the way a booted Linux does
      through `/dev/vcio` reaches it, and this is the line that proves the whole
      round trip — doorbell, interrupt source 94, the ISR at `0x3EC58302` releasing
      the reader's lock, the reply written back to MAIL0.
    line: "1 requests taken, 1 replies written"

  - why: >-
      `GET_FIRMWARE_REVISION` comes back with the pinned build's timestamp
      (`0x6a7a16af` = 2026-08-10 18:21:35 UTC). A firmware bump is expected to change
      this — when it does, re-pin it deliberately rather than loosening the match,
      since it is also the cheapest proof that the reply carries real data rather
      than a staged buffer read back.
    line: ["tag 0x00000001", "answered", "0x6a7a16af"]

  - why: >-
      `SET_POWER_STATE` for USB answers device 3, state `1`: powered. The handler
      asks for power at `0x7E80_8008` and waits for the acknowledge at `+0x20`, then
      resets the DWC2 core at `0x7E98_0000` and flushes its FIFOs, with no timeout on
      any of those waits. With both blocks on the catch-all stub it spun forever and
      every request after it went unanswered, which is how the rpi-mkosi image's UEFI
      looked stuck after its banner (`src/periph/usbr.rs`, `src/periph/dwc2.rs`).
      The reference board answers the same to `vcmailbox 0x00028001 8 8 3 3`.
    line: ["tag 0x00028001", "answered", "0x00000003 0x00000001"]

  - why: >-
      `GET_CRYPTO_NUM_OTP_KEYS` reports one key slot — and the id of that one key is
      **1**, not 0. Crypto key ids are 1-based, which is worth a milestone of its own
      because asking for key 0 answers `KEY_NOT_FOUND` and reads exactly like an
      unprovisioned part.
    line: ["tag 0x0003008f", "answered", "0x00000001"]

  - why: >-
      `GET_CRYPTO_KEY_STATUS` for key 1 answers `0x00000001` —
      `ARM_CRYPTO_KEY_STATUS_TYPE_DEVICE_PRIVATE_KEY`, none of the lock bits set. The
      reference board answers the same for key 1 when asked over `/dev/vcio`, and
      `KEY_NOT_FOUND` for 0, 2 and 3.

      This depends on rows 56-63 carrying a key, which the model does not fuse on its
      own: it is a board out of the factory, and only an owner running
      `rpi-otp-private-key` programs that region. The `otp_row` lines above provision
      it for this run, with an invented key — never a real row.
    line: ["tag 0x00030090", "answered", "0x00000001"]

  - why: >-
      `GET_CRYPTO_KEY_USAGE` for key 1 is `0` — `RPI_FW_CRYPTO_KEY_USAGE_UNDEFINED`,
      as on the reference board. Nothing has claimed the key for RPi Connect or a
      user-defined purpose.
    line: ["tag 0x0003009c", "answered", "0x00000000"]

  - why: >-
      The end of the line this project exists for: `GET_CRYPTO_HMAC_SHA256` returns
      status `0`, length `0x20`, and a real HMAC-SHA256 over the fixed 16-byte
      message, computed by `start4.elf`'s own mbedTLS with the OTP key. Nothing is
      short-circuited — the whole crypto service runs.

      This is the shape of the derivation the root-LUKS passphrase derivation needs guarded: a firmware bump
      that changes how the OTP key reaches the HMAC changes this digest, and the diff
      lands here instead of on a thousand cards that will not unlock. The value is
      safe to publish precisely because the key it is derived from is invented.
    line: ["tag 0x00030092", "answered", "0x6ff9b60e 0x7bb3973a 0x01eb65b0 0x48fd764f 0x8286f48d 0xf1b46aed 0xe8e0da4c 0x9d1e6ea2"]

  - why: "No nop-slides at all: the register file must survive preemptive context switches (8d7c27a) and no callback may be null."
    line: "[derail]"
    absent: true

  - why: "The wall clock is the fallback stop, not the primary one: an unknown instruction must be reported as a fault, with its pc and raw bytes."
    line: "Unimplemented"
    absent: true
